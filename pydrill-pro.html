<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="hsl(276,16%,6%)">
<title>Python 組み立てドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   Python 引き出しトレーニング — 脱AI Zine デザインシステム
   ref: たんご共有デザインシステム(assets/zine.css) / リソグラフ同人誌 / IA Writer の禁欲タイポ
   単体オフライン維持のためトークンはインライン（外部fetchなし・フォントのみCDN）。
   絶対規則: 紫はフラット1色インク・純色なし・彩度≤80・紫青グラデ厳禁・絵文字禁止。
   ══════════════════════════════════════════════════════════════ */
:root{
  --paper:hsl(276,15%,8%);--paper-2:hsl(276,13%,12%);--paper-edge:hsl(276,11%,23%);
  --paper-deep:hsl(276,17%,6%);--card:hsl(276,14%,11%);
  --ink:hsl(280,18%,93%);--ink-soft:hsl(280,10%,72%);--pencil:hsl(280,7%,56%);
  --pink:hsl(281,62%,66%);--pink-wash:hsla(281,62%,66%,.18);   /* 主役＝紫 */
  --teal:hsl(168,42%,52%);--teal-wash:hsla(168,42%,52%,.14);   /* 差し色 */
  --good:hsl(150,50%,58%);--good-wash:hsla(150,50%,58%,.14);
  --bad:hsl(2,78%,64%);--bad-wash:hsla(2,78%,64%,.12);--term-err:hsl(2,78%,64%);
  --line:var(--paper-edge);--muted:var(--pencil);
  --code-bg:hsl(276,19%,5%);--code-ink:hsl(280,12%,83%);
  --f1:5px;--f2:8px;--f3:13px;--f4:21px;--f5:34px;--f6:55px;   /* 余白＝2リズム */
  --tilt-a:-1.1deg;--tilt-b:.7deg;--tilt-c:-.4deg;             /* 不完全さ＝傾き */
  --shadow-hand:2px 3px 0 hsl(281,45%,26%),5px 9px 20px hsla(0,0%,0%,.55);
  --shadow-lift:4px 6px 0 hsl(281,45%,30%),10px 16px 34px hsla(0,0%,0%,.62);
  --r-card:14px 7px 13px 8px;--r-big:16px 8px 16px 8px;--r-btn:9px 6px 9px 6px;
  --r-choice:10px 6px 10px 6px;--r-chip:8px 4px 8px 4px;--r-in:8px;   /* 四隅バラバラ角丸 */
  --stripe-a:hsl(276,17%,5%);--stripe-b:hsl(281,58%,45%);            /* 紫黒2色ストライプ */
  --stripes:repeating-linear-gradient(135deg,var(--stripe-a) 0 8px,var(--stripe-b) 8px 16px);
  --f-display:'Anton','Noto Sans JP',sans-serif;--f-body:'Noto Sans JP',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',monospace;--f-hand:'Yomogi',cursive;    /* 書体コントラスト */
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");
  /* 手の痕跡＝四隅のレジストレーションマーク（トンボ）。背景画像で描くのでマークアップ不要 */
  --reg:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><g fill='none' stroke='hsl(168,42%,52%)' stroke-width='1.1'><path d='M8 0V16M0 8H16'/><circle cx='8' cy='8' r='4.4'/></g></svg>");
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:var(--f-body);background:var(--paper);color:var(--ink);min-height:100vh;
  line-height:1.62;overflow-x:hidden;background-image:var(--grain)}
button,select,textarea,input{font-family:var(--f-body);color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
::selection{background:var(--pink-wash)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── 画面遷移 ── */
.screen{position:fixed;inset:0;background:var(--paper-deep);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:10;overflow-y:auto;background-image:var(--grain)}
.screen.active{opacity:1;pointer-events:all}
/* 誌面＝四隅にトンボ（レジストレーションマーク）。中央寄せの版面 */
.wrap{max-width:620px;margin:0 auto;padding:var(--f5) var(--f4) var(--f6);position:relative;
  background-image:var(--reg),var(--reg),var(--reg),var(--reg);background-repeat:no-repeat;
  background-position:9px 9px,right 9px top 9px,left 9px bottom 9px,right 9px bottom 9px;background-size:16px 16px}
@media(max-width:520px){.wrap{padding:var(--f4) var(--f3) var(--f6)}}

/* ── ホーム ── */
.logo{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,10vw,3rem);color:var(--ink);
  line-height:.96;letter-spacing:.01em;transform:rotate(var(--tilt-a));transform-origin:left;margin-top:var(--f3)}
.logo em{color:var(--pink);font-style:normal}
.logo-sub{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--pencil);margin-top:var(--f3)}
.stat-card{background:var(--paper-2);border:1.5px solid var(--paper-edge);border-radius:var(--r-card);
  padding:var(--f3) var(--f4);margin:var(--f4) 0;display:flex;gap:var(--f4);box-shadow:var(--shadow-hand);transform:rotate(var(--tilt-c))}
.stat{flex:1}
.stat-n{font-family:var(--f-mono);font-size:1.5rem;font-weight:700;color:var(--pink);line-height:1}
.stat-l{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin-top:var(--f1)}
.sec-h{font-family:var(--f-display);font-weight:400;font-size:1.35rem;color:var(--ink);letter-spacing:.01em;margin:0 0 var(--f1)}
.sec-d{font-size:.76rem;color:var(--ink-soft);margin-bottom:var(--f3);line-height:1.6}
/* ふつうのカード＝細罫と余白で分ける。交互に微傾き */
.mode{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--paper-edge);
  border-radius:var(--r-card);padding:var(--f3) var(--f4);margin-bottom:var(--f2);box-shadow:var(--shadow-hand);
  transition:transform .14s ease}
.mode:nth-of-type(even){transform:rotate(var(--tilt-b))}
.mode:nth-of-type(odd){transform:rotate(var(--tilt-c))}
.mode:active{transform:translateY(1px) rotate(0deg)}
.mode-n{font-weight:700;font-size:1rem;color:var(--ink)}
.mode-d{font-size:.74rem;color:var(--ink-soft);margin-top:var(--f1);line-height:1.55}
.mode-bar{height:5px;background:var(--paper-edge);border-radius:2px;margin-top:var(--f2);overflow:hidden}
.mode-bar i{display:block;height:100%;background:var(--pink);border-radius:2px}
/* 主役カード＝紫黒ストライプの背表紙＋紫ウォッシュ。紫はここに集約 */
.mode.wide{position:relative;overflow:hidden;background:
  radial-gradient(120% 140% at 100% 0%,var(--pink-wash),transparent 46%),var(--card);
  border:2px solid var(--ink);border-radius:var(--r-big);padding-left:calc(var(--f4) + 12px);box-shadow:var(--shadow-lift);transform:rotate(var(--tilt-a))}
.mode.wide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background-image:var(--stripes);opacity:.9}
.mode.wide .mode-n{color:var(--ink)}
.mode.wide .mode-d{color:var(--ink-soft)}
.mode.wide .mode-bar{background:hsla(0,0%,100%,.12)}
.reset-link{display:block;width:100%;text-align:center;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;color:var(--pencil);margin-top:var(--f5)}
.spacer{height:var(--f4)}

/* ── クイズ ── */
#scr-quiz{display:flex;flex-direction:column}
.qbar{display:flex;align-items:center;gap:var(--f3);padding:var(--f3) var(--f4) 0;max-width:620px;margin:0 auto;width:100%}
.qclose{font-size:1.4rem;color:var(--pencil);line-height:1;padding:4px 6px}
.prog{flex:1;height:9px;background:var(--paper-2);border:1px solid var(--paper-edge);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pink);border-radius:5px;transition:width .3s ease}
.combo{font-family:var(--f-mono);font-size:.78rem;font-weight:700;color:var(--pink);min-width:34px;text-align:right}
.qbody{flex:1;overflow-y:auto;max-width:620px;margin:0 auto;width:100%;padding:var(--f4)}
.qcat{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);margin-bottom:var(--f2)}
.qtask{font-size:1.05rem;font-weight:500;line-height:1.55;margin-bottom:var(--f3)}

/* コード面＝深い黒紙・等幅。スロットは紫ウォッシュ */
.code{font-family:var(--f-mono);font-size:.92rem;background:var(--code-bg);color:var(--code-ink);
  border:1px solid var(--paper-edge);border-radius:var(--r-in);padding:var(--f3) var(--f3);white-space:pre;overflow-x:auto;line-height:1.75}
.code .slot{background:var(--pink-wash);border-bottom:2px solid var(--pink);color:var(--ink);padding:1px 3px;border-radius:3px}
.code .slot.empty{color:var(--pencil)}
.code .caret{display:inline-block;width:7px;height:.95em;background:var(--teal);vertical-align:-1px;animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}

.target{border:2px dashed var(--paper-edge);border-radius:var(--r-in);padding:var(--f2);min-height:62px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;margin:var(--f2) 0}
.target:empty::before{content:'下のブロックをタップして組み立てる';font-family:var(--f-hand);font-size:.86rem;color:var(--pencil);align-self:center;margin:auto}
.pool{display:flex;flex-wrap:wrap;gap:7px;padding:var(--f2);background:var(--paper-2);border:1px solid var(--paper-edge);border-radius:var(--r-in);min-height:56px}
.chip{font-family:var(--f-mono);font-size:.94rem;font-weight:500;background:var(--card);border:1.5px solid var(--paper-edge);
  border-bottom-width:3px;border-radius:var(--r-chip);padding:9px 13px;color:var(--ink);transition:opacity .12s,transform .12s;box-shadow:var(--shadow-hand)}
.chip:active{transform:translateY(1px);border-bottom-width:2px}
.chip.used{opacity:.2;pointer-events:none}
.chip.placed{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .pos{font-size:.6rem;color:var(--teal);margin-right:5px}
.status{font-family:var(--f-mono);font-size:.72rem;color:var(--pencil);text-align:center;margin:var(--f2) 0}

.choices{display:flex;flex-direction:column;gap:var(--f2);margin-top:var(--f3)}
.choice{font-family:var(--f-mono);font-size:.95rem;text-align:left;background:var(--card);border:1.5px solid var(--paper-edge);
  border-bottom-width:3px;border-radius:var(--r-choice);padding:var(--f3) var(--f4);color:var(--ink);white-space:pre-wrap;box-shadow:var(--shadow-hand)}
.choice:active{transform:translateY(1px)}
.choice.ok{background:var(--good);color:var(--paper);border-color:var(--good)}
.choice.ng{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.choice.dim{opacity:.38}

.term{background:var(--code-bg);border:1px solid var(--paper-edge);border-radius:var(--r-in);padding:var(--f3);margin-top:var(--f3);font-family:var(--f-mono);font-size:.9rem}
.term-l{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin-bottom:var(--f1)}
.term-o{color:var(--good);white-space:pre-wrap;word-break:break-all}
.verdict{font-family:var(--f-display);font-weight:400;font-size:1.15rem;letter-spacing:.02em;margin-top:var(--f3)}
.verdict.ok{color:var(--good)}
.verdict.ng{color:var(--bad)}
/* 解説＝差し色tealの罫。手書きのニュアンスは見出しだけ */
.exp{background:var(--paper-2);border-left:3px solid var(--teal);border-radius:0 var(--r-in) var(--r-in) 0;padding:var(--f3) var(--f3);margin-top:var(--f2);font-size:.84rem;line-height:1.75;color:var(--ink-soft)}
.exp code{font-family:var(--f-mono);background:var(--code-bg);color:var(--code-ink);padding:1px 5px;border-radius:3px;font-size:.9em}
.exp b{color:var(--ink);font-weight:700}
.qfoot{padding:var(--f3) var(--f4) var(--f4);max-width:620px;margin:0 auto;width:100%;display:flex;gap:var(--f2)}
.btn{flex:1;padding:15px;border-radius:var(--r-btn);font-weight:700;font-size:.94rem;box-shadow:var(--shadow-hand)}
.btn-main{background:var(--ink);color:var(--paper)}
.btn-main:disabled{background:var(--paper-edge);color:var(--pencil);cursor:default;box-shadow:none}
.btn-sub{background:transparent;color:var(--ink);border:1.5px solid var(--paper-edge);flex:0 0 auto;padding:15px 18px;box-shadow:none}

/* ── 辞書 ── */
.dbar{display:flex;align-items:center;gap:var(--f2);margin-bottom:var(--f3)}
.dbar .qclose{padding:4px 2px}
.dsearch{flex:1;font-size:.9rem;padding:11px 14px;border:1.5px solid var(--paper-edge);border-radius:var(--r-in);background:var(--paper-2);color:var(--ink)}
.dsearch::placeholder{color:var(--pencil)}
.dcat{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);margin:var(--f4) 0 var(--f2)}
.dcat:first-of-type{margin-top:var(--f1)}
.ditem{background:var(--card);border:1.5px solid var(--paper-edge);border-radius:var(--r-card);margin-bottom:var(--f2);overflow:hidden}
.dhead{display:block;width:100%;text-align:left;padding:var(--f3) var(--f4);font-size:.92rem;font-weight:500;color:var(--ink);line-height:1.5;position:relative;padding-right:38px}
.dhead::after{content:'＋';position:absolute;right:15px;top:14px;color:var(--pink);font-size:.9rem}
.ditem.open .dhead::after{content:'−'}
.ditem.open .dhead{font-weight:700;border-bottom:1px solid var(--paper-edge)}
.dbody{padding:var(--f3) var(--f4) var(--f4);display:none}
.ditem.open .dbody{display:block}
.dvar{margin-bottom:var(--f3)}
.dvl{font-size:.74rem;color:var(--ink-soft);margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dcopy{font-family:var(--f-mono);font-size:.62rem;color:var(--ink);border:1px solid var(--paper-edge);border-radius:5px;padding:3px 8px;flex:0 0 auto}
.dio{font-family:var(--f-mono);font-size:.78rem;margin-top:6px;line-height:1.6}
.dio i{color:var(--pencil);font-style:normal}
.dio .in{color:var(--ink)}
.dio .out{color:var(--good);font-weight:700}
.duse{font-size:.8rem;line-height:1.7;background:var(--paper-2);border-radius:var(--r-in);padding:10px 12px;margin-top:4px;color:var(--ink-soft)}
.dtrap{font-size:.8rem;line-height:1.7;border-left:3px solid var(--bad);background:var(--bad-wash);border-radius:0 var(--r-in) var(--r-in) 0;padding:10px 12px;margin-top:8px;color:var(--ink-soft)}
.duse code,.dtrap code{font-family:var(--f-mono);background:var(--code-bg);color:var(--code-ink);padding:1px 4px;border-radius:3px;font-size:.9em}
.dtrap b,.duse b{color:var(--ink)}
.dlab{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.12em;color:var(--pencil);margin-bottom:4px}
.dnone{font-family:var(--f-hand);font-size:.9rem;color:var(--ink-soft);text-align:center;padding:var(--f5) 0}

/* ── 結果 ── */
.res-n{font-family:var(--f-display);font-weight:400;font-size:3.6rem;color:var(--ink);line-height:1;transform:rotate(var(--tilt-c))}
.res-l{font-size:.82rem;color:var(--ink-soft);margin-top:var(--f1);line-height:1.6}
.res-row{display:flex;justify-content:space-between;font-size:.85rem;padding:11px 0;border-bottom:1px solid var(--paper-edge)}
.res-row b{font-family:var(--f-mono);color:var(--pink)}
.miss{font-family:var(--f-mono);font-size:.8rem;background:var(--card);border-radius:var(--r-in);padding:10px 12px;margin-bottom:7px;border:1px solid var(--paper-edge);white-space:pre-wrap;color:var(--ink)}
.miss span{display:block;font-family:var(--f-body);font-size:.72rem;color:var(--ink-soft);margin-top:4px}

/* ── トースト ── */
.notif{position:fixed;top:18px;left:50%;transform:translate(-50%,-220%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:var(--r-btn);font-size:.82rem;font-weight:700;z-index:99;transition:transform .3s cubic-bezier(.2,1.3,.4,1);white-space:nowrap;box-shadow:var(--shadow-lift)}
.notif.show{transform:translate(-50%,0)}
.notif.ok{background:var(--good);color:var(--paper)}
.notif.ng{background:var(--bad);color:var(--paper)}

/* ── 記述モード（pro のみ・Pyodide 採点） ── */
.wio{display:flex;gap:var(--f2);margin-bottom:var(--f3);flex-wrap:wrap}
.wio>div{flex:1 1 46%;min-width:130px;background:var(--paper-2);border:1px solid var(--paper-edge);border-radius:var(--r-in);padding:9px 11px}
.wio .wl{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin-bottom:4px}
.wio .wv{font-family:var(--f-mono);font-size:.85rem;color:var(--ink);white-space:pre-wrap;line-height:1.5}
.wio .wv.exp{color:var(--good);font-weight:700;background:none;border:none;padding:0;margin:0}
.wboot{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-soft);display:flex;align-items:center;gap:7px;margin:var(--f2) 0}
.wboot .d{width:7px;height:7px;border-radius:50%;background:var(--pink);flex:0 0 auto;animation:blink 1.2s ease-in-out infinite}
.wboot .d.ready{background:var(--good);animation:none}
.wboot .d.fail{background:var(--bad);animation:none}
.wboot.fail{color:var(--bad);line-height:1.6}
.wretry{font-family:var(--f-mono);font-size:.64rem;color:var(--ink);border:1px solid var(--paper-edge);border-radius:5px;padding:3px 9px}
.wdiag{font-size:.74rem;line-height:1.7;background:var(--paper-2);border-left:3px solid var(--teal);border-radius:0 var(--r-in) var(--r-in) 0;padding:10px 12px;margin-top:8px;color:var(--ink-soft)}
.wdiag b{color:var(--ink)}
.wdiag code{font-family:var(--f-mono);background:var(--code-bg);color:var(--code-ink);padding:1px 4px;border-radius:3px;font-size:.9em}
.wmodel{font-family:var(--f-mono);font-size:.85rem;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--paper-edge);border-radius:var(--r-in);padding:12px 14px;white-space:pre;overflow-x:auto;line-height:1.7;margin-top:8px}
#w-code{width:100%;font-family:var(--f-mono);font-size:.92rem;line-height:1.65;padding:14px;border:1px solid var(--paper-edge);border-radius:var(--r-in);background:var(--code-bg);color:var(--code-ink);resize:vertical;tab-size:4;caret-color:var(--teal);min-height:150px;margin-top:var(--f2)}
</style>
</head>
<body>

<div class="notif" id="notif"></div>

<!-- ══════ HOME ══════ -->
<section class="screen active" id="scr-home">
  <div class="wrap">
    <h1 class="logo">Python<br><em>組み立て</em>ドリル</h1>
    <p class="logo-sub">tap to build · 46問 + 記述18問</p>

    <div class="stat-card">
      <div class="stat"><div class="stat-n" id="h-xp">0</div><div class="stat-l">XP</div></div>
      <div class="stat"><div class="stat-n" id="h-streak">0</div><div class="stat-l">連続日数</div></div>
      <div class="stat"><div class="stat-n" id="h-acc">—</div><div class="stat-l">正答率</div></div>
    </div>

    <button class="mode wide" onclick="openDict()" style="margin-bottom:22px">
      <div class="mode-n">辞書を開く</div>
      <div class="mode-d">やりたいこと から形を引く · 30見出し / 79パターン</div>
    </button>

    <div id="h-modes"></div>

    <button class="reset-link" onclick="resetAll()">記録をすべて消す</button>
  </div>
</section>

<!-- ══════ QUIZ ══════ -->
<section class="screen" id="scr-quiz">
  <div class="qbar">
    <button class="qclose" onclick="goHome()" aria-label="やめる">×</button>

const PYO='https://cdn.jsdelivr.net/pyodide/v0.28.3/full/';
const RUNNER=`import sys, io, builtins, contextlib, traceback, linecache
_out = io.StringIO()
sys.stdin = io.StringIO(_STDIN)
linecache.cache['code.py'] = (len(_SRC), None, _SRC.splitlines(True), 'code.py')
def _inp(prompt=''):
    line = sys.stdin.readline()
    if line == '':
        raise EOFError('入力データが足りません')
    return line.rstrip('\\n')
builtins.input = _inp
_err = 0
try:
    with contextlib.redirect_stdout(_out), contextlib.redirect_stderr(_out):
        exec(compile(_SRC, 'code.py', 'exec'), {'__name__': '__main__'})
except BaseException:
    _err = 1
    _keep = []
    _skip = False
    for _l in traceback.format_exc().splitlines():
        if _l.startswith('  File "'):
            _skip = 'code.py' not in _l
            if not _skip:
                _keep.append(_l)
        elif _l.startswith('    '):
            if not _skip:
                _keep.append(_l)
        else:
            _skip = False
            _keep.append(_l)
    _out.write('\\n'.join(_keep) + '\\n')
[_out.getvalue(), _err]`;

let PY=null,PYSTATE='idle',PYERR='';

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src;s.onload=()=>res();
    s.onerror=()=>rej(new Error('スクリプトを取得できませんでした'));
    document.head.appendChild(s);
  });
}

async function ensurePython(){
  if(PYSTATE==='ready')return true;
  PYSTATE='loading';PYERR='';paintBoot();
  try{
    if(typeof loadPyodide==='undefined')await loadScript(PYO+'pyodide.js');
    PY=await loadPyodide({indexURL:PYO});
    PYSTATE='ready';paintBoot();return true;
  }catch(e){
    PYSTATE='fail';PYERR=(e&&e.message)||String(e);paintBoot();return false;
  }
}

function paintBoot(){
  const b=document.getElementById('w-boot');if(!b)return;
  const msg={loading:'Python 3 を読み込み中（初回は10MBほど / 数十秒）',
             ready:'Python 3 準備完了',
             fail:'読み込み失敗 — '+PYERR}[PYSTATE]||'';
  b.className='wboot'+(PYSTATE==='fail'?' fail':'');
  b.innerHTML=`<span class="d ${PYSTATE==='ready'?'ready':PYSTATE==='fail'?'fail':''}"></span><span>${esc(msg)}</span>`;
  if(PYSTATE==='fail'){
    const r=document.createElement('button');
    r.className='wretry';r.textContent='再試行';
    r.onclick=()=>ensurePython().then(()=>{const w=document.getElementById('w-run');if(w)w.disabled=PYSTATE!=='ready';});
    b.appendChild(r);
    const d=document.createElement('div');
    d.className='wdiag';
    d.innerHTML='Python 本体を CDN から取得できていません。よくある原因は3つです。<br>'
      +'<b>1.</b> チャット内のプレビューで開いている → 一度ダウンロードしてブラウザで開く<br>'
      +(location.protocol==='file:'?'<b>2.</b> <code>file://</code> で開いている（現在これ）→ 同じフォルダで <code>python3 -m http.server</code>、または静的ホスティングに置く<br>':'<b>2.</b> ネット未接続 → 記述モードだけは通信が必要<br>')
      +'<b>3.</b> 社内ネットや拡張機能が cdn.jsdelivr.net を遮断している';
    b.after(d);
  }
  const run=document.getElementById('w-run');
  if(run)run.disabled=PYSTATE!=='ready';
}

function normOut(s){
  return String(s).replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+$/,'')).join('\n').replace(/^\n+|\n+$/g,'');
}

function renderWrite(q){
  document.getElementById('q-check').style.display='none';
  document.getElementById('q-reset').style.display='none';
  document.getElementById('q-body').innerHTML=`
    <div class="qcat">記述</div>
    <p class="qtask">${esc(q.q)}</p>
    <div class="wio">
      ${q.in?`<div><div class="wl">入力データ</div><div class="wv">${esc(q.in)}</div></div>`:''}
      <div><div class="wl">期待する出力</div><div class="wv exp">${esc(q.o)}</div></div>
    </div>
    <textarea id="w-code" spellcheck="false" autocapitalize="off" autocomplete="off">${esc(q.st)}</textarea>
    <div class="wboot" id="w-boot"></div>
    <div style="display:flex;gap:9px"><button class="btn btn-main" id="w-run" style="flex:1" disabled onclick="judgeWrite()">実行して判定</button><button class="btn-sub" onclick="giveUpWrite()">答えを見る</button></div>
    <div id="q-feedback"></div>`;
  const ta=document.getElementById('w-code');
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){
      e.preventDefault();
      const s=ta.selectionStart,en=ta.selectionEnd;
      ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(en);
      ta.selectionStart=ta.selectionEnd=s+4;
    }
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();judgeWrite();}
  });
  ta.selectionStart=ta.selectionEnd=ta.value.length;
  paintBoot();
  ensurePython();
}

async function judgeWrite(){
  if(QS.answered||PYSTATE!=='ready')return;
  const q=QS.list[QS.i];
  const btn=document.getElementById('w-run');
  btn.disabled=true;btn.textContent='実行中';
  let txt='',err=0;
  try{
    PY.globals.set('_SRC',document.getElementById('w-code').value);
    PY.globals.set('_STDIN',q.in||'');
    const r=await PY.runPythonAsync(RUNNER);
    txt=r.get(0);err=r.get(1);r.destroy();
  }catch(e){txt=String(e);err=1;}
  btn.textContent='実行して判定';

  const ok=!err&&normOut(txt)===normOut(q.o);
  if(!ok){
    // 不正解でも何度でも試せる
    document.getElementById('q-feedback').innerHTML=`
      <div class="verdict ng">まだ合っていません</div>
      <div class="term"><div class="term-l">${err?'例外':'実行結果'}</div>
        <div class="term-o" style="${err?'color:var(--term-err)':''}">${esc(txt.replace(/\n+$/,'')||'（出力なし）')}</div></div>
      <div class="term" style="margin-top:8px"><div class="term-l">期待する出力</div>
        <div class="term-o">${esc(q.o)}</div></div>`;
    btn.disabled=false;
    document.getElementById('q-feedback').scrollIntoView({behavior:'smooth',block:'end'});
    return;
  }
  QS.answered=true;
  score(q,true);
  btn.style.display='none';
  document.getElementById('q-feedback').innerHTML=`
    <div class="verdict ok">正解</div>
    <div class="term"><div class="term-l">実行結果</div><div class="term-o">${esc(txt.replace(/\n+$/,''))}</div></div>
    <div class="exp">${q.e}</div>
    <div class="dlab" style="margin-top:10px">模範解答</div>
    <div class="wmodel">${esc(q.m)}</div>`;
  const n=document.getElementById('q-next');
  n.style.display='';n.textContent=(QS.i+1>=QS.list.length)?'結果を見る':'次へ';
  n.focus();
}

}

const KW=['if','in','for','while','return','else','and','or','not','is','import','elif'];

function defaultST(){return{xp:0,streak:0,lastDate:'',totalA:0,totalC:0,stats:{}};}
function loadST(){try{const r=localStorage.getItem(SK);return r?Object.assign(defaultST(),JSON.parse(r)):defaultST();}catch(e){return defaultST();}}
function saveST(){try{localStorage.setItem(SK,JSON.stringify(ST));}catch(e){}}
function todayStr(){return new Date().toISOString().slice(0,10);}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
function goHome(){QS=null;renderHome();show('scr-home');}
function notify(m,t=''){const e=document.getElementById('notif');e.textContent=m;e.className='notif show '+t;setTimeout(()=>e.classList.remove('show'),1700);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── トークン列 → 表示用コード（判定は配列で行うので表示専用） ── */
function isName(t){return /^[A-Za-z_][\w.]*$/.test(t)&&!KW.includes(t)||/[)\]'"]$/.test(t);}
function joinCode(ts){
  let s='';
  ts.forEach((t,i)=>{
    if(i>0){
      const p=ts[i-1];
      const tight=[')',']',',',':'].includes(t)||(['(','['].includes(t)&&isName(p))||['(','['].includes(p);
      if(!tight)s+=' ';
    }
    s+=t;
  });
  return s;
}

  document.getElementById('h-xp').textContent=ST.xp;

    box.appendChild(h);
    card('間違えた問題',' ',weak,true);
  }
}

/* ── 出題 ── */
function start(qs){
  QS={list:shuffle(qs),i:0,correct:0,miss:[],order:[],used:[],answered:false,pool:[]};
  const t=todayStr();
  if(ST.lastDate!==t){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    ST.streak=(ST.lastDate===y)?ST.streak+1:1;
    ST.lastDate=t;saveST();
  }
  show('scr-quiz');renderQ();
}

  const q=QS.list[QS.i];
  QS.answered=false;QS.order=[];

  document.getElementById('q-prog').style.width=(QS.i/QS.list.length*100)+'%';
  document.getElementById('q-combo').textContent=QS.correct>1?'×'+QS.correct:'';
  document.getElementById('q-next').style.display='none';

      const b=document.createElement('button');

      box.appendChild(b);
    });

  }

  QS.pool=shuffle([...q.tokens.map(t=>({t})),...q.extra.map(t=>({t}))]);

  document.getElementById('q-check').style.display='';

  document.getElementById('q-body').innerHTML=`
    <div class="qcat">${q.cat}</div>
    <p class="qtask">${q.q}</p>
    <div class="code" id="q-code"></div>

/* ── 前提コード＋スロットの描画 ── */
function renderCode(q,built,final){
  const inner=built.length
    ? `<span class="slot">${esc(joinCode(built))}</span>`+(final?'':'<span class="caret"></span>')
    : `<span class="slot empty">▁▁▁</span><span class="caret"></span>`;
  if(Array.isArray(q.ctx)){
    return q.ctx.map(l=>l.includes(SLOT)?esc(l).replace(SLOT,inner):esc(l)).join('\n');
  }
  const head=(typeof q.ctx==='string'&&q.ctx)?esc(q.ctx)+'\n':'';
  return head+inner;
}

function place(i){if(QS.answered||QS.used[i])return;QS.used[i]=true;QS.order.push(i);update();}
function unplace(pos){if(QS.answered)return;QS.used[QS.order[pos]]=false;QS.order.splice(pos,1);update();}
function clearTokens(){if(QS.answered)return;QS.order=[];QS.used.fill(false);update();}

function update(){
  const q=QS.list[QS.i];
  document.querySelectorAll('#q-pool .chip').forEach((c,i)=>c.classList.toggle('used',QS.used[i]));
  const tgt=document.getElementById('q-target');tgt.innerHTML='';
  QS.order.forEach((pi,pos)=>{
    const c=document.createElement('button');
    c.className='chip placed';
    c.innerHTML=`<span class="pos">${pos+1}</span>${esc(QS.pool[pi].t)}`;
    c.onclick=()=>unplace(pos);
    tgt.appendChild(c);
  });
  document.getElementById('q-code').innerHTML=renderCode(q,QS.order.map(i=>QS.pool[i].t),false);
  document.getElementById('q-check').disabled=QS.order.length===0;
  document.getElementById('q-status').textContent=
    `${QS.order.length} ブロック配置中 ・ 使わないブロックが混ざっています`;
}

/* ── 採点 ── */
function score(q,ok){
  if(!ST.stats[q.id])ST.stats[q.id]={c:0,a:0};
  ST.stats[q.id].a++;ST.totalA++;
  if(ok){
    ST.stats[q.id].c++;ST.totalC++;QS.correct++;
    const xp=10+(QS.correct>=3?10:0);ST.xp+=xp;
    notify('正解 +'+xp+'XP','ok');
  }else{QS.miss.push(q);notify('おしい','ng');}
  saveST();
}
function feedback(q,ok,label){
  document.getElementById('q-feedback').innerHTML=`
    <div class="verdict ${ok?'ok':'ng'}">${ok?'正解':label}</div>
    ${q.out!==null&&q.out!==undefined
      ? `<div class="term"><div class="term-l">実行結果</div><div class="term-o">${esc(q.out)}</div></div>`
      : `<div class="term"><div class="term-l">この行だけでは出力なし（構文の問題）</div></div>`}
    <div class="exp">${q.exp}</div>`;
  const n=document.getElementById('q-next');
  n.style.display='';n.textContent=(QS.i+1>=QS.list.length)?'結果を見る':'次へ';
  n.focus();
}

function checkAnswer(){
  if(QS.answered)return;
  QS.answered=true;
  const q=QS.list[QS.i];
  const user=QS.order.map(i=>QS.pool[i].t);
  const ok=[q.tokens,...(q.alt||[])].some(c=>c.length===user.length&&c.every((t,i)=>t===user[i]));
  score(q,ok);

  document.getElementById('q-code').innerHTML=renderCode(q,q.tokens,true);
  const tgt=document.getElementById('q-target');tgt.innerHTML='';
  q.tokens.forEach((t,i)=>{
    const c=document.createElement('div');c.className='chip placed';
    c.innerHTML=`<span class="pos">${i+1}</span>${esc(t)}`;tgt.appendChild(c);
  });
  document.getElementById('q-status').textContent='';
  document.getElementById('q-check').style.display='none';
  document.getElementById('q-reset').style.display='none';
  feedback(q,ok,'不正解 — 上が正しい並び');
}

function checkPredict(sel){
  if(QS.answered)return;
  QS.answered=true;
  const q=QS.list[QS.i];
  const ok=sel===q.ans;
  score(q,ok);
  document.querySelectorAll('#q-choices .choice').forEach((b,i)=>{
    if(i===q.ans)b.classList.add('ok');
    else if(i===sel)b.classList.add('ng');
    else b.classList.add('dim');
    b.onclick=null;
  });
  feedback(q,ok,'不正解 — 緑が正しい出力');
}

function nextQ(){QS.i++;if(QS.i>=QS.list.length)showResult();else renderQ();}

function showResult(){
  const total=QS.list.length,c=QS.correct;
  document.getElementById('r-head').innerHTML=`
    <div class="res-n">${c}<span style="font-size:1.4rem;color:#9a9388">/${total}</span></div>
    <div class="res-l">${c===total?'全問正解。次は速度を上げる。':c/total>=.7?'土台はできている。落とした形を覚え直す。':'まだ引き出しになっていない。同じ範囲をもう一周。'}</div>`;
  document.getElementById('r-stats').innerHTML=`
    <div class="res-row"><span>累計 XP</span><b>${ST.xp}</b></div>
    <div class="res-row"><span>連続日数</span><b>${ST.streak}</b></div>
    <div class="res-row"><span>通算正答率</span><b>${Math.round(ST.totalC/ST.totalA*100)}%</b></div>`;
  document.getElementById('r-miss').innerHTML=QS.miss.length
    ? '<h2 class="sec-h">落とした形</h2>'+QS.miss.map(q=>
        `<div class="miss">${esc(q.type==='write'?q.m:q.type==='predict'?q.code.join('\n')+'  →  '+q.out:joinCode(q.tokens))}<span>${q.q}</span></div>`).join('')
    : '';
  show('scr-result');
}

function resetAll(){
  if(!confirm('XP・連続日数・正答記録をすべて消します。よろしいですか。'))return;
  ST=defaultST();saveST();renderHome();notify('記録を消しました');
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!QS)return;
  if(QS.answered)nextQ();
  else{const b=document.getElementById('q-check');if(b.style.display!=='none'&&!b.disabled)checkAnswer();}
});

function openDict(){renderDict(document.getElementById('d-search').value);show('scr-dict');}

function renderDict(filter){
  const f=(filter||'').trim().toLowerCase();
  const box=document.getElementById('d-list');box.innerHTML='';
  let hits=0;
  DICT.forEach(cat=>{
    const items=cat.items.filter(it=>{
      if(!f)return true;
      const hay=(it.head+' '+it.use+' '+it.trap+' '+cat.cat+' '+it.v.map(v=>v.l+' '+v.c).join(' ')).toLowerCase();
      return hay.includes(f);
    });
    if(!items.length)return;
    hits+=items.length;
    const ch=document.createElement('div');
    ch.className='dcat';ch.textContent=cat.cat;box.appendChild(ch);
    items.forEach(it=>{
      const d=document.createElement('div');
      d.className='ditem';
      const b=document.createElement('button');
      b.className='dhead';b.textContent=it.head;
      b.onclick=()=>{
        d.classList.toggle('open');
        if(d.classList.contains('open')&&!d.dataset.built){buildDictBody(d,it);d.dataset.built='1';}
      };
      d.appendChild(b);
      const body=document.createElement('div');
      body.className='dbody';d.appendChild(body);
      box.appendChild(d);
      if(f&&items.length<=3){d.classList.add('open');buildDictBody(d,it);d.dataset.built='1';}
    });
  });
  if(!hits)box.innerHTML='<div class="dnone">見つかりません。別の言い方で探してみてください。</div>';
}

function buildDictBody(d,it){
  const body=d.querySelector('.dbody');
  body.innerHTML=it.v.map((v,i)=>`
    <div class="dvar">
      <div class="dvl"><span>${esc(v.l)}</span><button class="dcopy" onclick="copyCode('${it.id}',${i})">コピー</button></div>
      <div class="code">${esc(v.c)}</div>
      <div class="dio">
        ${v.i?`<div><i>入力</i> <span class="in">${esc(v.i).replace(/\n/g,' ⏎ ')}</span></div>`:''}
        <div><i>結果</i> <span class="out">${esc(v.o).replace(/\n/g,' ⏎ ')}</span></div>
      </div>
    </div>`).join('')
    +`<div class="dlab">どこで使うか</div><div class="duse">${it.use}</div>
      <div class="dtrap">${it.trap}</div>`;
}

function copyCode(id,i){
  let code=null;
  DICT.forEach(c=>c.items.forEach(it=>{if(it.id===id)code=it.v[i].c;}));
  if(!code)return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>notify('コピーしました','ok'),()=>notify('コピーできませんでした','ng'));
  }else notify('このブラウザではコピーできません','ng');
}
