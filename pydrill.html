e":"数なら乗算、文字列やリストなら反復","use":"<code>'-' * 20</code> で区切り線、<code>[0] * 5</code> で長さ5の初期リスト。図を描くのに効く。","trap":"<code>[[0] * 3] * 2</code> は<b>同じ行を2回参照する</b>だけ。片方を書き換えると両方変わる。","v":[{"l":"数なら掛ける","c":"print(3 * 4)","o":"12"},{"l":"文字列を繰り返す","c":"print('-' * 10)","o":"----------"},{"l":"リストを繰り返す","c":"print([0] * 3)","o":"[0, 0, 0]"},{"l":"入れ子は同じ物を指す","c":"kansu = [[0] * 2] * 2\nkansu[0][0] = 9\nprint(kansu)","o":"[[9, 0], [9, 0]]"}]},{"id":"a10","sym":"/","head":"/ は必ず小数になる割り算","role":"割って float を返す","use":"平均や比率。割り切れても <code>.0</code> が付く。","trap":"整数どうしでも結果は<b>必ず float</b>。<code>6 / 2</code> は <code>3</code> ではなく <code>3.0</code>。整数が欲しいなら <code>//</code>。","v":[{"l":"割り切れても小数","c":"print(6 / 2)","o":"3.0"},{"l":"割り切れない","c":"print(7 / 2)","o":"3.5"}]},{"id":"a11","sym":"//","head":"// は切り捨ての割り算","role":"商だけを整数で返す","use":"箱詰め、ページ数、単位変換の「上の単位」。<code>%</code> と対で使う。","trap":"負の数では<b>0方向ではなく下方向</b>に丸める。<code>-7 // 2</code> は <code>-3</code> ではなく <code>-4</code>。他言語と答えが違う。","v":[{"l":"商だけ残る","c":"print(7 // 2)","o":"3"},{"l":"負の数は下に丸まる","c":"print(-7 // 2)","o":"-4"},{"l":"秒を分に","c":"kansu = 125\nprint(kansu // 60)","o":"2"}]},{"id":"a12","sym":"%","head":"% は余り","role":"割った余りを返す","use":"偶数奇数の判定、<b>循環</b>（<code>i % len(kansu)</code> で添字を折り返す）、単位の「下の桁」。","trap":"負の数では<b>結果が正</b>になる。<code>-7 % 2</code> は <code>1</code>。<code>//</code> と辻褄が合うように決まっている。","v":[{"l":"余りが出る","c":"print(7 % 2)","o":"1"},{"l":"偶数判定","c":"kansu = 8\nprint(kansu % 2 == 0)","o":"True"},{"l":"循環させる","c":"kansu = ['A', 'B', 'C']\nfor i in range(4):\n    print(kansu[i % len(kansu)], end='')","o":"ABCA"}]},{"id":"a13","sym":"**","head":"** は累乗","role":"左を右の回数だけ掛ける","use":"2乗・3乗。<code>0.5</code> 乗で平方根になる。","trap":"<b>右から計算する</b>。<code>2 ** 3 ** 2</code> は <code>64</code> ではなく <code>512</code>。また <code>9 ** 0.5</code> は <code>3</code> ではなく <code>3.0</code>。","v":[{"l":"2乗","c":"print(3 ** 2)","o":"9"},{"l":"右から計算される","c":"print(2 ** 3 ** 2)","o":"512"},{"l":"平方根は float","c":"print(9 ** 0.5)","o":"3.0"}]}]},{"cat":"代入する","items":[{"id":"a14","sym":"= ==","head":"= と == の違い","role":"= は入れる、== は比べる","use":"<code>=</code> は「右の値を左の名前に入れる」命令。<code>==</code> は「同じか？」を聞いて <code>True</code>/<code>False</code> を返す式。","trap":"<code>if kansu = 0:</code> と書くと<b>構文エラー</b>。判定は必ず <code>==</code>。","v":[{"l":"= は入れる","c":"kansu = 5\nprint(kansu)","o":"5"},{"l":"== は比べる","c":"kansu = 5\nprint(kansu == 5)","o":"True"},{"l":"違えば False","c":"print(5 == 6)","o":"False"}]},{"id":"a15","sym":"+=","head":"+= などの複合代入","role":"自分自身を使って更新する","use":"<code>kansu += 1</code> は <code>kansu = kansu + 1</code> の短縮。<code>-=</code> <code>*=</code> <code>//=</code> <code>%=</code> も同じ形。集計のカウンタで多用する。","trap":"リストに <code>+=</code> するときは<b>右もリスト</b>。<code>kansu += 5</code> は <code>TypeError</code>、<code>kansu += [5]</code> が正しい。","v":[{"l":"数を足し込む","c":"kansu = 0\nkansu += 3\nprint(kansu)","o":"3"},{"l":"文字列も伸ばせる","c":"kansu = 'a'\nkansu += 'b'\nprint(kansu)","o":"ab"},{"l":"リストは右もリスト","c":"kansu = [1]\nkansu += [2]\nprint(kansu)","o":"[1, 2]"},{"l":"掛けて更新","c":"kansu = 3\nkansu *= 4\nprint(kansu)","o":"12"}]},{"id":"a16","sym":"a, b = b, a","head":"分解代入と入れ替え","role":"右をまとめて作ってから左へ配る","use":"右側が<b>先に全部できてから</b>左に配られる。だから <code>kansu1, kansu2 = kansu2, kansu1</code> で一時変数なしに入れ替えできる。","trap":"左右の<b>個数が合わない</b>と <code>ValueError: not enough values to unpack</code>。<code>input().split()</code> は入力次第で個数が変わるので落ちやすい。","v":[{"l":"まとめて入れる","c":"kansu1, kansu2 = 1, 2\nprint(kansu1, kansu2)","o":"1 2"},{"l":"一時変数なしで入れ替え","c":"kansu1, kansu2 = 1, 2\nkansu1, kansu2 = kansu2, kansu1\nprint(kansu1, kansu2)","o":"2 1"},{"l":"リストもほどける","c":"kansu1, kansu2 = [3, 7]\nprint(kansu1 + kansu2)","o":"10"}]},{"id":"a17","sym":"*rest","head":"* を付けた受け取り（残りをまとめる）","role":"余った分をリストで受け取る","use":"個数が決まっていない時。<code>先頭, *残り = ...</code> で頭だけ取って後は束ねる。真ん中に置くこともできる。","trap":"<code>*</code> が付いた変数は<b>必ずリスト</b>。1個でもリスト、0個でも空リストになる。","v":[{"l":"残りをまとめる","c":"kansu1, *kansu2 = [1, 2, 3]\nprint(kansu1, kansu2)","o":"1 [2, 3]"},{"l":"0個でも空リスト","c":"kansu1, *kansu2 = [1]\nprint(kansu2)","o":"[]"},{"l":"真ん中を束ねる","c":"kansu1, *kansu2, kansu3 = [1, 2, 3, 4]\nprint(kansu2)","o":"[2, 3]"}]}]},{"cat":"比べる","items":[{"id":"a18","sym":"< >","head":"< > <= >= （大小を比べる）","role":"どちらが大きいかを True / False で返す","use":"数はもちろん、<b>文字列も比べられる</b>（辞書順）。リストも先頭から順に比べる。","trap":"文字列の大小は<b>文字コード順</b>。大文字は小文字より小さい（<code>'Z' &lt; 'a'</code> が True）。","v":[{"l":"数の大小","c":"print(3 < 5, 3 >= 5)","o":"True False"},{"l":"文字列は辞書順","c":"print('apple' < 'banana')","o":"True"},{"l":"大文字が先に来る","c":"print('Z' < 'a')","o":"True"}]},{"id":"a19","sym":"!=","head":"!= （違うか）","role":"同じでなければ True","use":"<code>==</code> の反対。<code>not (a == b)</code> と同じ意味だが、こちらの方が読みやすい。","trap":"<code>=!</code> ではなく <code>!=</code>。順番を間違えると構文エラー。","v":[{"l":"違えば True","c":"print(3 != 5)","o":"True"},{"l":"同じなら False","c":"print(3 != 3)","o":"False"},{"l":"not で書くと冗長","c":"print(not (3 == 5))","o":"True"}]},{"id":"a20","sym":"a < b < c","head":"連鎖比較","role":"範囲の内側かを1行で書く","use":"<code>0 <= i < len(kansu)</code> が定型。添字を触る前の安全確認に使う。数学の書き方がそのまま通る。","trap":"「以上・未満」で読む。<code>len</code> そのものは<b>範囲外</b>。<code>&lt;=</code> を両側に使うと最後の要素で落ちる。","v":[{"l":"範囲の内側か","c":"kansu = 5\nprint(0 <= kansu < 10)","o":"True"},{"l":"外なら False","c":"kansu = 10\nprint(0 <= kansu < 10)","o":"False"},{"l":"添字の安全確認","c":"kansu = [1, 2, 3]\ni = 5\nprint(kansu[i] if 0 <= i < len(kansu) else '範囲外')","o":"範囲外"}]},{"id":"a21","sym":"is","head":"== と is の違い","role":"== は中身が同じか、is は同じ物か","use":"値を比べたいときは<b>常に <code>==</code></b>。<code>is</code> を使う場面は実質 <code>is None</code> だけ。","trap":"中身が同じでも別物なら <code>is</code> は <code>False</code>。小さい数だと偶然 <code>True</code> になることがあり、<b>それを当てにすると壊れる</b>。","v":[{"l":"中身は同じ","c":"kansu1 = [1, 2]\nkansu2 = [1, 2]\nprint(kansu1 == kansu2)","o":"True"},{"l":"でも別物","c":"kansu1 = [1, 2]\nkansu2 = [1, 2]\nprint(kansu1 is kansu2)","o":"False"},{"l":"None の判定はこれ","c":"kansu = None\nprint(kansu is None)","o":"True"}]}]},{"cat":"論理でつなぐ","items":[{"id":"a22","sym":"and or not","head":"and / or / not","role":"判定をつなぐ・ひっくり返す","use":"<code>and</code> は両方、<code>or</code> はどちらか、<code>not</code> は反転。<b>左から評価して、決まった時点で止まる</b>（短絡）。","trap":"短絡は守りに使える。<code>kansu and kansu[0]</code> は空なら右を<b>評価しない</b>ので落ちない。順番を逆にすると <code>IndexError</code>。","v":[{"l":"両方必要","c":"print(True and False)","o":"False"},{"l":"どちらかでいい","c":"print(True or False)","o":"True"},{"l":"ひっくり返す","c":"print(not True)","o":"False"},{"l":"短絡で守る","c":"kansu = ''\nprint(bool(kansu and kansu[0] == 'a'))","o":"False"}]},{"id":"a23","sym":"or","head":"or で既定値を置く","role":"空なら別の値を使う","use":"<code>kansu or '匿名'</code> は「空っぽなら右」。未入力時の表示名などに効く。返るのは <b>True/False ではなく値そのもの</b>。","trap":"<b><code>0</code> も空扱い</b>になる。0 が有効な値なら使えない。その時は <code>if kansu is None</code> で書く。","v":[{"l":"空なら右を使う","c":"kansu = ''\nprint(kansu or '匿名')","o":"匿名"},{"l":"中身があれば左","c":"kansu = 'たろう'\nprint(kansu or '匿名')","o":"たろう"},{"l":"0 も空扱いになる","c":"kansu = 0\nprint(kansu or 10)","o":"10"}]}]},{"cat":"所属と繰り返し","items":[{"id":"a24","sym":"in","head":"in は「含む」と「取り出す」の2役","role":"判定にも for の一部にもなる","use":"単独なら<b>含まれるかの判定</b>。<code>for</code> と一緒なら<b>1つずつ取り出す</b>。同じ単語だが仕事が違う。","trap":"文字列に対する <code>in</code> は<b>部分一致</b>。<code>'a' in 'banana'</code> も <code>'ana' in 'banana'</code> も True。","v":[{"l":"含むか判定","c":"print('a' in 'banana')","o":"True"},{"l":"つながりでも判定","c":"print('ana' in 'banana')","o":"True"},{"l":"for では取り出す","c":"for kansu in [1, 2]:\n    print(kansu)","o":"1\n2"},{"l":"辞書では キー を見る","c":"kansu = {'a': 1}\nprint('a' in kansu)","o":"True"}]},{"id":"a25","sym":"not in","head":"not in （含まれないか）","role":"無いことを確かめる","use":"許可リスト・禁止リストの判定、重複除去の <code>if x not in kansu</code>。<code>not (x in ...)</code> より読みやすい。","trap":"<code>not x in kansu</code> でも動くが、読み手が <code>(not x) in kansu</code> と誤読する。<b><code>not in</code> と続けて書く</b>。","v":[{"l":"無ければ True","c":"print('x' not in ['a', 'b'])","o":"True"},{"l":"初出だけ残す","c":"kansu = []\nfor x in [1, 2, 1]:\n    if x not in kansu:\n        kansu += [x]\nprint(kansu)","o":"[1, 2]"}]},{"id":"a26","sym":"for","head":"for （取り出して繰り返す）","role":"並びから1つずつ取り出す","use":"リスト・文字列・range・辞書などから順に取り出す。回数だけ欲しいなら <code>for _ in range(n)</code>。","trap":"辞書を <code>for</code> で回すと出てくるのは<b>キー</b>。値が欲しいなら <code>.values()</code>、両方なら <code>.items()</code>。","v":[{"l":"リストから取り出す","c":"for kansu in [10, 20]:\n    print(kansu)","o":"10\n20"},{"l":"文字列は1文字ずつ","c":"for kansu in 'abc':\n    print(kansu, end='')","o":"abc"},{"l":"辞書はキーが出る","c":"kansu = {'a': 1, 'b': 2}\nfor k in kansu:\n    print(k, end='')","o":"ab"}]},{"id":"a27","sym":"while","head":"while （条件が続く限り）","role":"終わりが決まっていない繰り返し","use":"回数が先に決まらない時。入力待ち、条件を満たすまでの再試行、ゲームのループ。<code>while True</code> + <code>break</code> が定型。","trap":"<b>中で条件を変えないと無限ループ</b>。カウンタの更新を忘れやすい。","v":[{"l":"条件で回す","c":"kansu = 3\nwhile kansu > 0:\n    print(kansu, end='')\n    kansu -= 1","o":"321"},{"l":"True + break","c":"kansu = 0\nwhile True:\n    if kansu >= 2:\n        break\n    print(kansu, end='')\n    kansu += 1","o":"01"}]},{"id":"a28","sym":"range()","head":"range() の3つの引数","role":"数の並びを作る","use":"<code>range(終わり)</code> / <code>range(始まり, 終わり)</code> / <code>range(始まり, 終わり, 歩幅)</code>。歩幅を負にすると逆順。","trap":"終わりは<b>含まない</b>。<code>range(1, 6)</code> は 1〜5。<code>range(5)</code> は 0〜4 で、5回まわる。","v":[{"l":"0から n-1","c":"for i in range(3):\n    print(i, end='')","o":"012"},{"l":"始まりを指定","c":"for i in range(1, 4):\n    print(i, end='')","o":"123"},{"l":"歩幅を付ける","c":"for i in range(0, 10, 3):\n    print(i, end=' ')","o":"0 3 6 9 "},{"l":"逆順は歩幅を負に","c":"for i in range(3, 0, -1):\n    print(i, end='')","o":"321"}]},{"id":"a29","sym":"enumerate()","head":"enumerate()（番号つきで回す）","role":"添字と中身を同時に取り出す","use":"「何番目か」も要るとき。<code>for i, x in enumerate(kansu)</code>。<code>range(len(kansu))</code> より短く、添字ミスも起きない。","trap":"受け取りは<b>2つ</b>。1つで受けると <code>(0, 'a')</code> のような組がそのまま入る。開始番号は <code>enumerate(kansu, 1)</code> で変えられる。","v":[{"l":"番号と中身","c":"for i, kansu in enumerate(['a', 'b']):\n    print(i, kansu)","o":"0 a\n1 b"},{"l":"1から数える","c":"for i, kansu in enumerate(['a', 'b'], 1):\n    print(i, kansu)","o":"1 a\n2 b"},{"l":"1つで受けると組になる","c":"for kansu in enumerate(['a']):\n    print(kansu)","o":"(0, 'a')"}]},{"id":"a30","sym":"zip()","head":"zip()（2つを並べて回す）","role":"複数の並びを横に揃えて取り出す","use":"名前と点数のように<b>対になっている別々のリスト</b>を同時に回す。<code>dict(zip(キー, 値))</code> で辞書も作れる。","trap":"<b>短い方に合わせて止まる</b>。長さが違うとはみ出した分は黙って捨てられる。","v":[{"l":"対にして回す","c":"for a, b in zip([1, 2], ['x', 'y']):\n    print(a, b)","o":"1 x\n2 y"},{"l":"短い方で止まる","c":"print(list(zip([1, 2, 3], ['x'])))","o":"[(1, 'x')]"},{"l":"辞書を作る","c":"print(dict(zip(['a', 'b'], [1, 2])))","o":"{'a': 1, 'b': 2}"}]}]},{"cat":"流れを変える","items":[{"id":"a31","sym":"if elif else","head":"if / elif / else","role":"条件で道を分ける","use":"上から順に見て、<b>最初に True になった枝だけ</b>を実行する。<code>elif</code> は何個でも、<code>else</code> はどれにも当たらない時。","trap":"<code>elif</code> を <code>if</code> の連続で書くと<b>全部が評価される</b>。範囲で分けるときは結果が変わるので注意。","v":[{"l":"分岐する","c":"kansu = 5\nif kansu > 3:\n    print('大')\nelse:\n    print('小')","o":"大"},{"l":"3つ以上に分ける","c":"kansu = 0\nif kansu > 0:\n    print('正')\nelif kansu < 0:\n    print('負')\nelse:\n    print('ゼロ')","o":"ゼロ"},{"l":"最初の1つだけ通る","c":"kansu = 5\nif kansu > 1:\n    print('A')\nelif kansu > 3:\n    print('B')","o":"A"}]},{"id":"a32","sym":"break continue","head":"break / continue / pass","role":"ループを抜ける・飛ばす・何もしない","use":"<code>break</code> はループごと終了、<code>continue</code> はこの回だけ飛ばして次へ、<code>pass</code> は<b>文法上何か要る場所の穴埋め</b>。","trap":"<code>break</code> は<b>いちばん内側のループ</b>しか抜けない。二重ループを一気に抜けたいならフラグか関数化。","v":[{"l":"見つけたら抜ける","c":"for kansu in [1, 5, 9]:\n    if kansu == 5:\n        break\n    print(kansu, end='')","o":"1"},{"l":"この回だけ飛ばす","c":"for kansu in range(5):\n    if kansu % 2 == 0:\n        continue\n    print(kansu, end='')","o":"13"},{"l":"pass は何もしない","c":"for kansu in range(2):\n    pass\nprint('終わった')","o":"終わった"}]},{"id":"a33","sym":"A if C else B","head":"三項演算子（1行の if）","role":"条件で値そのものを選ぶ","use":"<b>値を選ぶ</b>ための書き方。<code>print()</code> の中や代入の右側にそのまま置ける。<code>if</code> 文と違って<b>式</b>なので値になる。","trap":"読む順は<b>真ん中の条件から</b>。入れ子にすると急に読めなくなるので、2段までにする。","v":[{"l":"値を選ぶ","c":"kansu = 7\nprint('奇数' if kansu % 2 else '偶数')","o":"奇数"},{"l":"代入の右側に置く","c":"kansu = 0\nkansu2 = 'なし' if kansu == 0 else kansu\nprint(kansu2)","o":"なし"},{"l":"ゼロ除算を避ける","c":"kansu = 0\nprint(10 / kansu if kansu != 0 else '割れない')","o":"割れない"}]}]},{"cat":"関数とモジュール","items":[{"id":"a34","sym":"def return","head":"def / return","role":"処理に名前を付けて再利用する","use":"<code>def 名前(引数):</code> で作り、<code>return</code> で値を返す。同じ処理を何度も書かなくて済み、名前が説明になる。","trap":"<code>return</code> を書かない関数は <b><code>None</code> を返す</b>。<code>print</code> しただけでは値は返らない。","v":[{"l":"作って呼ぶ","c":"def tasu(a, b):\n    return a + b\nprint(tasu(2, 3))","o":"5"},{"l":"return が無いと None","c":"def hyouji(a):\n    print(a)\nkansu = hyouji(1)\nprint(kansu)","o":"1\nNone"},{"l":"return で即座に抜ける","c":"def saisho(kansu):\n    for x in kansu:\n        if x > 1:\n            return x\n    return None\nprint(saisho([1, 5, 9]))","o":"5"}]},{"id":"a35","sym":"import","head":"import（道具を持ってくる）","role":"標準ライブラリなどを使えるようにする","use":"Python に最初から入っている道具箱を開ける命令。<code>import math</code> と書くと <code>math.sqrt()</code> のように<b>モジュール名.機能</b>で呼べる。ファイルの<b>先頭</b>に書くのが慣習。","trap":"綴りを間違えると <code>ModuleNotFoundError</code>。また <code>import math</code> しただけでは <code>sqrt()</code> 単体では呼べない。<b><code>math.</code> を付ける</b>必要がある。","v":[{"l":"持ってきて使う","c":"import math\nprint(math.ceil(3.2))","o":"4"},{"l":"モジュール名を付ける","c":"import math\nprint(math.floor(3.8))","o":"3"},{"l":"平方根","c":"import math\nprint(math.sqrt(9))","o":"3.0"}]},{"id":"a36","sym":"from as","head":"from ... import ... / as","role":"名前を選んで持ってくる・別名を付ける","use":"<code>from math import ceil</code> なら <code>ceil()</code> と<b>直接書ける</b>。<code>as</code> は長い名前を短くする（<code>import math as m</code>）。","trap":"<code>from ... import *</code> は<b>全部持ってくる</b>ので、自分の変数と名前がぶつかって上書きされる事故が起きる。使わない。","v":[{"l":"名前を選んで持ってくる","c":"from math import ceil\nprint(ceil(3.2))","o":"4"},{"l":"複数まとめて","c":"from math import ceil, floor\nprint(ceil(3.2), floor(3.8))","o":"4 3"},{"l":"別名を付ける","c":"import math as m\nprint(m.ceil(3.2))","o":"4"}]},{"id":"a37","sym":"引数","head":"引数の渡し方","role":"位置で渡す・名前で渡す・既定値を置く","use":"順番どおりに渡すのが<b>位置引数</b>、<code>名前=値</code> が<b>キーワード引数</b>。定義側で <code>=</code> を書くと<b>既定値</b>になり、省略できる。","trap":"<b>既定値にリストを置かない</b>。関数を作った時に1個だけ作られ、呼ぶたびに使い回されて中身が残る。","v":[{"l":"位置で渡す","c":"def hiku(a, b):\n    return a - b\nprint(hiku(5, 2))","o":"3"},{"l":"名前で渡せば順不同","c":"def hiku(a, b):\n    return a - b\nprint(hiku(b=2, a=5))","o":"3"},{"l":"既定値は省略できる","c":"def aisatsu(namae, kotoba='こんにちは'):\n    return kotoba + namae\nprint(aisatsu('たろう'))","o":"こんにちはたろう"}]},{"id":"a38","sym":"lambda","head":"lambda（その場の小さい関数）","role":"名前を付けずに1行の関数を作る","use":"<code>sorted()</code> の <code>key=</code> のように<b>関数を引数として渡す</b>時に使う。<code>lambda 引数: 返す値</code> の形。","trap":"<b>1行の式しか書けない</b>。分岐や複数行が要るなら素直に <code>def</code> にする。無理に詰めると読めなくなる。","v":[{"l":"その場で作る","c":"tasu = lambda a, b: a + b\nprint(tasu(2, 3))","o":"5"},{"l":"並べ替えの基準に","c":"kansu = ['bbb', 'a', 'cc']\nprint(sorted(kansu, key=lambda x: len(x)))","o":"['a', 'cc', 'bbb']"},{"l":"2番目で並べ替え","c":"kansu = [(1, 'b'), (2, 'a')]\nprint(sorted(kansu, key=lambda x: x[1]))","o":"[(2, 'a'), (1, 'b')]"}]}]},{"cat":"入れ物の記号","items":[{"id":"a39","sym":"[ ]","head":"[ ] は 作る・取り出す・切る の3役","role":"リテラル / 添字 / スライス","use":"何の直後に書くかで意味が変わる。<b>単独なら作る</b>、<b>名前の直後なら取り出す</b>、<b>中に <code>:</code> があれば切る</b>。","trap":"添字は <b>0 から</b>。3文字目は <code>[2]</code>。<code>[-1]</code> は最後。","v":[{"l":"作る","c":"kansu = [1, 2, 3]\nprint(kansu)","o":"[1, 2, 3]"},{"l":"取り出す","c":"kansu = [1, 2, 3]\nprint(kansu[0])","o":"1"},{"l":"後ろから取る","c":"kansu = [1, 2, 3]\nprint(kansu[-1])","o":"3"},{"l":"切る（以上・未満）","c":"kansu = 'ABC123'\nprint(kansu[1:4])","o":"BC1"}]},{"id":"a40","sym":"[::]","head":"スライスの3つ目（歩幅）","role":"飛ばして取る・逆順にする","use":"<code>[始まり:終わり:歩幅]</code>。省略すると端まで。<code>[::-1]</code> が<b>逆順</b>の定型で、文字列にもリストにも効く。","trap":"スライスは<b>新しい物を作る</b>。元は変わらない。範囲を外れても<code>IndexError</code>にならず、黙って短い結果が返る。","v":[{"l":"1つ飛ばし","c":"print('abcdef'[::2])","o":"ace"},{"l":"逆順にする","c":"print('abc'[::-1])","o":"cba"},{"l":"リストも逆順","c":"print([1, 2, 3][::-1])","o":"[3, 2, 1]"},{"l":"範囲外でも落ちない","c":"print([1, 2][:99])","o":"[1, 2]"}]},{"id":"a41","sym":"{ }","head":"{ } は 辞書 と 集合","role":"キーと値の組、または重複なしの集まり","use":"<code>{'a': 1}</code> は辞書、<code>{1, 2}</code> は集合。数え上げは辞書、重複除去は集合。","trap":"<b><code>{}</code> は空の辞書</b>。空の集合は <code>set()</code> と書く。集合は<b>順番を保証しない</b>。","v":[{"l":"辞書を作る","c":"kansu = {'a': 1}\nprint(kansu['a'])","o":"1"},{"l":"{} は空の辞書","c":"kansu = {}\nprint(type(kansu).__name__)","o":"dict"},{"l":"集合は重複が消える","c":"print(sorted({1, 2, 1}))","o":"[1, 2]"}]},{"id":"a42","sym":"( )","head":"( ) は 呼ぶ・まとめる・組にする の3役","role":"呼び出し / 優先順位 / タプル","use":"名前の直後なら<b>呼び出し</b>、式を囲めば<b>先に計算</b>、カンマが入れば<b>タプル</b>（変えられない並び）。","trap":"<code>print</code> と <code>print()</code> は別物。前者は関数そのもの、後者は呼んだ結果。","v":[{"l":"呼び出す","c":"print(len('abc'))","o":"3"},{"l":"先に計算させる","c":"print((2 + 3) * 4)","o":"20"},{"l":"カンマがあればタプル","c":"kansu = (1, 2)\nprint(type(kansu).__name__)","o":"tuple"}]},{"id":"a43","sym":"*引数","head":"呼び出しの * （展開して渡す）","role":"並びをばらして引数にする","use":"<code>print(*kansu)</code> で「リストの中身を1個ずつ渡す」。<code>sep</code> と組むと <code>join</code> なしで並べられる。辞書には <code>**</code>。","trap":"<code>print(kansu)</code> と <code>print(*kansu)</code> は<b>まったく違う</b>。前者はリストごと1個、後者は中身を個別に渡す。","v":[{"l":"ばらして渡す","c":"kansu = [1, 2, 3]\nprint(*kansu)","o":"1 2 3"},{"l":"付けないとリストのまま","c":"kansu = [1, 2, 3]\nprint(kansu)","o":"[1, 2, 3]"},{"l":"区切りも変えられる","c":"kansu = [1, 2, 3]\nprint(*kansu, sep=', ')","o":"1, 2, 3"}]},{"id":"a44","sym":",","head":"， は区切りと 組にする","role":"並べる。文脈によっては組を作る","use":"引数の区切り、要素の区切り、<b>複数の値をまとめて受け取る</b>。<code>print(a, b)</code> は空白を挟んで出す。","trap":"<code>kansu = 1,</code> は数ではなく<b>要素1個のタプル</b>。行末の余計なカンマに注意。","v":[{"l":"print の区切りは空白","c":"print(1, 2)","o":"1 2"},{"l":"まとめて受け取る","c":"kansu1, kansu2 = 1, 2\nprint(kansu1, kansu2)","o":"1 2"},{"l":"末尾のカンマでタプル化","c":"kansu = 1,\nprint(type(kansu).__name__)","o":"tuple"}]},{"id":"a45","sym":".","head":"． は「その中の物」を指す","role":"型が持つ機能を呼び出す","use":"<code>文字列.メソッド()</code> の形。何が使えるかは<b>左側の型で決まる</b>。","trap":"型に無い名前を呼ぶと <code>AttributeError</code>。リストに足すのは <code>push</code> ではなく <code>append</code>。小数の <code>.</code> とは別の記号。","v":[{"l":"文字列の機能","c":"kansu = 'abc'\nprint(kansu.upper())","o":"ABC"},{"l":"リストの機能","c":"kansu = []\nkansu.append(1)\nprint(kansu)","o":"[1]"},{"l":"辞書の安全な取り出し","c":"kansu = {'a': 1}\nprint(kansu.get('b', 0))","o":"0"}]}]},{"cat":"形をつくる記号","items":[{"id":"a46","sym":":","head":": は ブロック・切る・組・書式 の4役","role":"後ろに何か続くことを示す","use":"行末なら<b>ブロックの始まり</b>、<code>[ ]</code> の中なら<b>スライス</b>、<code>{ }</code> の中なら<b>キーと値</b>、f文字列の中なら<b>書式指定</b>。","trap":"行末の <code>:</code> を忘れると <code>SyntaxError: expected ':'</code>。ブロックを作る語（if / for / while / def）は全部この形。","v":[{"l":"ブロックの始まり","c":"if True:\n    print('中')","o":"中"},{"l":"スライス","c":"print('abcd'[1:3])","o":"bc"},{"l":"キーと値","c":"print({'a': 1}['a'])","o":"1"},{"l":"書式指定","c":"print(f'{7:03}')","o":"007"}]},{"id":"a47","sym":"␣␣␣␣","head":"字下げ（インデント）","role":"どこからどこまでが中身かを示す","use":"他の言語の <code>{ }</code> に当たる。<b>スペース4つ</b>が標準。深さがそのまま入れ子の深さ。","trap":"足りなければ <code>IndentationError: expected an indented block</code>、余計なら <code>unexpected indent</code>。タブと空白を混ぜると見た目が同じでも落ちる。","v":[{"l":"中身は下げる","c":"for i in range(2):\n    print(i)","o":"0\n1"},{"l":"深さが入れ子の深さ","c":"for i in range(2):\n    for j in range(2):\n        print(i, j)","o":"0 0\n0 1\n1 0\n1 1"},{"l":"戻せばループの外","c":"for i in range(2):\n    pass\nprint('外')","o":"外"}]},{"id":"a48","sym":"_","head":"_ は「受け取るが使わない」印","role":"名前を付ける必要が無い時の置き場","use":"回数だけ欲しい <code>for _ in range(3):</code>。分解代入で要らない位置にも使う。<b>ただの変数名</b>で、特別な機能は無い。","trap":"使わないという<b>人間向けの合図</b>。使っても動くが、読む人を混乱させる。","v":[{"l":"回数だけ回す","c":"for _ in range(3):\n    print('OK', end='')","o":"OKOKOK"},{"l":"要らない位置を捨てる","c":"kansu1, _, kansu2 = 1, 2, 3\nprint(kansu1, kansu2)","o":"1 3"}]}]},{"cat":"組み込みの道具","items":[{"id":"a49","sym":"len()","head":"len()（長さ）","role":"要素や文字の個数を返す","use":"文字列・リスト・辞書・集合の<b>個数</b>。ループの上限や、空かどうかの判定に使う。","trap":"<b>数には使えない</b>（<code>TypeError: object of type 'int' has no len()</code>）。桁数が欲しいなら <code>len(str(kansu))</code>。","v":[{"l":"文字数","c":"print(len('abc'))","o":"3"},{"l":"要素数","c":"print(len([1, 2]))","o":"2"},{"l":"辞書はキーの数","c":"print(len({'a': 1, 'b': 2}))","o":"2"},{"l":"桁数は文字列にしてから","c":"kansu = 1234\nprint(len(str(kansu)))","o":"4"}]},{"id":"a50","sym":"print()","head":"print() の sep と end","role":"区切りと行末を変える","use":"既定は<b>空白区切り・改行で終わり</b>。<code>sep</code> で間を、<code>end</code> で終わりを変える。1行に並べたい時は <code>end=''</code>。","trap":"<code>end=''</code> のまま最後まで行くと<b>改行されない</b>。ループの後に <code>print()</code> を1回置く。","v":[{"l":"既定は空白区切り","c":"print(1, 2, 3)","o":"1 2 3"},{"l":"区切りを変える","c":"print(1, 2, 3, sep=',')","o":"1,2,3"},{"l":"改行しない","c":"for i in range(3):\n    print(i, end='')","o":"012"},{"l":"最後に改行を足す","c":"for i in range(3):\n    print(i, end='')\nprint()\nprint('次')","o":"012\n次"}]},{"id":"a51","sym":"sum() max()","head":"sum() / max() / min() / sorted()","role":"まとめて計算する・並べ替える","use":"自分で <code>for</code> を書き始めたら、まずこれらを思い出す。<code>sorted()</code> は<b>新しいリストを返す</b>（元は変わらない）。","trap":"空のリストに <code>max()</code> は <code>ValueError</code>、<code>sum()</code> は <code>0</code>。<code>sorted()</code> と <code>.sort()</code> は別物。","v":[{"l":"合計と最大","c":"kansu = [80, 95, 60]\nprint(sum(kansu), max(kansu))","o":"235 95"},{"l":"最大の位置","c":"kansu = [80, 95, 60]\nprint(kansu.index(max(kansu)))","o":"1"},{"l":"並べ替えは新しい物","c":"kansu = [3, 1, 2]\nprint(sorted(kansu), kansu)","o":"[1, 2, 3] [3, 1, 2]"},{"l":"空でも sum は 0","c":"print(sum([]))","o":"0"}]}]},{"cat":"特別な値","items":[{"id":"a52","sym":"True False","head":"True / False（真偽値）","role":"判定の答えそのもの","use":"比較の結果がこれ。<code>if</code> が見ているのもこれ。<b>数としては 1 と 0</b> なので <code>sum()</code> で数を数えられる。","trap":"先頭が<b>大文字</b>。<code>true</code> では <code>NameError</code>。空の文字列・空のリスト・<code>0</code> は False 扱いになる。","v":[{"l":"比較の結果","c":"print(3 > 2)","o":"True"},{"l":"数としては 1 と 0","c":"print(True + True)","o":"2"},{"l":"条件を数える","c":"kansu = [1, 5, 9]\nprint(sum(x > 3 for x in kansu))","o":"2"},{"l":"空っぽは False 扱い","c":"print(bool(''), bool([]), bool(0))","o":"False False False"}]},{"id":"a53","sym":"None","head":"None（値が無いという値）","role":"「まだ無い」を表す専用の値","use":"何も返さない関数の戻り値。初期値として置いておく。<b>0 や空文字とは違う</b>。","trap":"判定は <code>== None</code> ではなく <b><code>is None</code></b>。<code>print()</code> の戻り値も None なので <code>kansu = print(1)</code> とすると None が入る。","v":[{"l":"is で判定する","c":"kansu = None\nprint(kansu is None)","o":"True"},{"l":"0 や空文字とは別物","c":"print(None == 0, None == '')","o":"False False"},{"l":"返さない関数は None を返す","c":"kansu = print('出力')\nprint(kansu)","o":"出力\nNone"}]}]}];
const ERRORS=[{"id":"e1","cat":"書き方が違う","err":"SyntaxError","msg":"expected ':'","why":"ブロックを始める行の最後に <code>:</code> が無い。<code>for</code> / <code>if</code> / <code>while</code> / <code>def</code> は全部この形。","bad":"for i in range(3)\n    print(i)","bi":"","fix":"for i in range(3):\n    print(i)","fi":"","fo":"0\n1\n2","note":"エラーは「次に <code>:</code> が来るはずだった」と言っている。<b>行番号の行の末尾</b>を見る。"},{"id":"e2","cat":"書き方が違う","err":"IndentationError","msg":"expected an indented block","why":"<code>:</code> で始めたブロックの中身が字下げされていない。Python は字下げでブロックを表す。","bad":"for i in range(3):\nprint(i)","bi":"","fix":"for i in range(3):\n    print(i)","fi":"","fo":"0\n1\n2","note":"中身は<b>スペース4つ</b>下げる。「after 'for' statement on line 1」が、どの行の中身が足りないかを教えている。"},{"id":"e3","cat":"書き方が違う","err":"IndentationError","msg":"unexpected indent","why":"ブロックでもないのに字下げした。前の行が <code>:</code> で終わっていないのに下げている。","bad":"kansu = 1\n    print(kansu)","bi":"","fix":"kansu = 1\nprint(kansu)","fi":"","fo":"1","note":"コピペで行頭に空白が紛れた時にもよく出る。"},{"id":"e4","cat":"無い物を呼んだ","err":"NameError","msg":"name 'kansu' is not defined","why":"その名前の変数をまだ作っていない。または<b>綴りが違う</b>。","bad":"print(kansu)","bi":"","fix":"kansu = 5\nprint(kansu)","fi":"","fo":"5","note":"「使う前に作る」が順番。<code>kansu</code> と <code>kansuu</code> のような1文字違いが一番多い。"},{"id":"e5","cat":"無い物を呼んだ","err":"ModuleNotFoundError","msg":"No module named 'randomm'","why":"<code>import</code> した名前のモジュールが無い。たいてい綴り間違い。","bad":"import randomm","bi":"","fix":"import random\nprint(type(random).__name__)","fi":"","fo":"module","note":"標準ライブラリなら綴りを疑う。外部ライブラリなら、そもそも入っていない。"},{"id":"e6","cat":"無い物を呼んだ","err":"AttributeError","msg":"'list' object has no attribute 'push'","why":"その型に無いメソッドを呼んだ。リストに足すのは <code>push</code> ではなく <code>append</code>。","bad":"kansu = []\nkansu.push(1)","bi":"","fix":"kansu = []\nkansu.append(1)\nprint(kansu)","fi":"","fo":"[1]","note":"他の言語の名前を持ち込むと出る。<b>「型」と「持っていないもの」</b>が両方書いてあるので、型に合う名前を探す。"},{"id":"e7","cat":"種類が合わない","err":"TypeError","msg":"can only concatenate str (not \"int\") to str","why":"文字列に数を足そうとした。<code>input()</code> の戻り値は<b>必ず文字列</b>。","bad":"kansu = input()\nprint(kansu + 1)","bi":"5","fix":"kansu = int(input())\nprint(kansu + 1)","fi":"5","fo":"6","note":"この教材で一番出るエラー。<code>int()</code> を通すか、逆に数を <code>str()</code> にするか、どちらを意図したのかで決める。"},{"id":"e8","cat":"種類が合わない","err":"TypeError","msg":"unsupported operand type(s) for +: 'int' and 'str'","why":"e7 の左右が逆。数に文字列を足そうとした。","bad":"kansu = 5\nprint(kansu + '1')","bi":"","fix":"kansu = 5\nprint(str(kansu) + '1')","fi":"","fo":"51","note":"<code>+</code> は「両方が数」か「両方が文字列」でしか使えない。つなげたいのか足したいのかを決める。"},{"id":"e9","cat":"種類が合わない","err":"TypeError","msg":"object of type 'int' has no len()","why":"数に <code>len()</code> を使った。長さを持つのは文字列・リストなど。","bad":"kansu = 5\nprint(len(kansu))","bi":"","fix":"kansu = 5\nprint(len(str(kansu)))","fi":"","fo":"1","note":"「数の桁数」が欲しいなら文字列にしてから数える。"},{"id":"e10","cat":"種類が合わない","err":"TypeError","msg":"'int' object is not iterable","why":"数をそのまま <code>for</code> で回した。回せるのは範囲・リスト・文字列など。","bad":"for i in 5:\n    print(i)","bi":"","fix":"for i in range(5):\n    print(i, end=' ')","fi":"","fo":"0 1 2 3 4 ","note":"「5回まわす」は <code>range(5)</code>。<code>for i in 5</code> ではない。"},{"id":"e11","cat":"種類が合わない","err":"TypeError","msg":"list indices must be integers or slices, not str","why":"リストの添字に文字列を使った。リストの添字は<b>整数</b>。","bad":"kansu = [1, 2]\nprint(kansu['0'])","bi":"","fix":"kansu = [1, 2]\nprint(kansu[0])","fi":"","fo":"1","note":"文字列をキーにしたいなら、それはリストではなく辞書（dict）。"},{"id":"e12","cat":"種類が合わない","err":"TypeError","msg":"'str' object does not support item assignment","why":"文字列の1文字を書き換えようとした。文字列は<b>作り直すことしかできない</b>。","bad":"kansu = 'abc'\nkansu[0] = 'x'","bi":"","fix":"kansu = 'abc'\nkansu = 'x' + kansu[1:]\nprint(kansu)","fi":"","fo":"xbc","note":"加工したいならスライスで組み直すか、リストにしてから <code>join</code> で戻す。"},{"id":"e13","cat":"中身が想定外","err":"ValueError","msg":"invalid literal for int() with base 10: 'abc'","why":"数に見えない文字列を <code>int()</code> に渡した。型は合っているが<b>中身</b>が数でない。","bad":"kansu = int(input())\nprint(kansu)","bi":"abc","fix":"kansu = input()\nprint(int(kansu) if kansu.lstrip('-').isdigit() else '数ではない')","fi":"abc","fo":"数ではない","note":"<code>TypeError</code> は「種類が違う」、<code>ValueError</code> は「種類は合うが中身が変」。この違いが読めると原因の切り分けが速い。"},{"id":"e14","cat":"中身が想定外","err":"ValueError","msg":"not enough values to unpack (expected 2, got 1)","why":"左辺の変数の数と、右辺の要素数が合っていない。入力が1つしか無いのに2つに分けようとした。","bad":"kansu1, kansu2 = input().split()\nprint(kansu1)","bi":"3","fix":"kansu1, kansu2 = input().split()\nprint(kansu1, kansu2)","fi":"3 7","fo":"3 7","note":"<code>split()</code> は空白で切る。入力が <code>3 7</code> なら2つ、<code>3</code> だけなら1つ。<b>入力データの方</b>を疑う。"},{"id":"e15","cat":"範囲とキー","err":"IndexError","msg":"list index out of range","why":"リストに無い番号を見た。要素3個なら使えるのは <code>0,1,2</code> まで。","bad":"kansu = [1, 2, 3]\nprint(kansu[3])","bi":"","fix":"kansu = [1, 2, 3]\nprint(kansu[len(kansu) - 1])","fi":"","fo":"3","note":"最後の要素は <code>[-1]</code> でも取れる。ループなら <code>range(len(kansu))</code> にしておくと範囲を外さない。"},{"id":"e16","cat":"範囲とキー","err":"KeyError","msg":"'b'","why":"辞書に無いキーを見た。メッセージには<b>無かったキーそのもの</b>が出る。","bad":"kansu = {'a': 1}\nprint(kansu['b'])","bi":"","fix":"kansu = {'a': 1}\nprint(kansu.get('b', 0))","fi":"","fo":"0","note":"<code>get(キー, 既定値)</code> なら無くても落ちない。数え上げの <code>kansu.get(c, 0) + 1</code> はこれが理由。"},{"id":"e17","cat":"実行してから起きる","err":"ZeroDivisionError","msg":"division by zero","why":"0 で割った。割る前に0かどうかを見ていない。","bad":"kansu = 0\nprint(10 / kansu)","bi":"","fix":"kansu = 0\nprint(10 / kansu if kansu != 0 else '0では割れない')","fi":"","fo":"0では割れない","note":"平均を出す時に<b>空のリスト</b>を <code>len()</code> で割ると、これが出る。"},{"id":"e18","cat":"実行してから起きる","err":"EOFError","msg":"EOF when reading a line","why":"<code>input()</code> を呼んだのに、読む行がもう無い。入力欄の行数が足りていない。","bad":"kansu1 = input()\nkansu2 = input()\nprint(kansu1, kansu2)","bi":"3","fix":"kansu1 = input()\nkansu2 = input()\nprint(kansu1, kansu2)","fi":"3\n7","fo":"3 7","note":"コードは正しくても<b>入力データ側</b>が足りないと出る。<code>input()</code> を呼んだ回数と行数を合わせる。"}];

function openDict(){renderDict(document.getElementById('d-search').value);show('scr-dict');}

function renderDict(filter){
  const f=(filter||'').trim().toLowerCase();
  const box=document.getElementById('d-list');box.innerHTML='';
  let hits=0;
  DICT.forEach(cat=>{
    const items=cat.items.filter(it=>{
      if(!f)return true;
      const hay=(it.head+' '+it.use+' '+it.trap+' '+cat.cat+' '+it.v.map(v=>v.l+' '+v.c).join(' ')).toLowerCase();
      return hay.includes(f);
    });
    if(!items.length)return;
    hits+=items.length;
    const ch=document.createElement('div');
    ch.className='dcat';ch.textContent=cat.cat;box.appendChild(ch);
    items.forEach(it=>{
      const d=document.createElement('div');
      d.className='ditem';
      const b=cardFace(it.id, it.head, plain(it.use), it.v[0].c, it.v.length+' パターン');
      b.onclick=()=>{
        d.classList.toggle('open');
        if(d.classList.contains('open')&&!d.dataset.built){buildDictBody(d,it);d.dataset.built='1';}
      };
      d.appendChild(b);
      const body=document.createElement('div');
      body.className='dbody';d.appendChild(body);
      box.appendChild(d);
      if(f&&items.length<=3){d.classList.add('open');buildDictBody(d,it);d.dataset.built='1';}
    });
  });
  if(!hits)box.innerHTML='<div class="dnone">見つかりません。別の言い方で探してみてください。</div>';
}

function buildDictBody(d,it){
  const body=d.querySelector('.dbody');
  body.innerHTML=varsTabs(it)
    +'<div class="dlab">どこで使うか</div><div class="duse">'+it.use+'</div>'
    +'<div class="dtrap">'+it.trap+'</div>';
  wireTabs(body);
}

function copyCode(id,i){
  let code=null;
  DICT.forEach(c=>c.items.forEach(it=>{if(it.id===id)code=it.v[i].c;}));
  ATOMS.forEach(c=>c.items.forEach(it=>{if(it.id===id)code=it.v[i].c;}));
  if(!code)return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>notify('コピーしました','ok'),()=>notify('コピーできませんでした','ng'));
  }else notify('このブラウザではコピーできません','ng');
}

/* ══════════════════════════════════════════════════════════════
   PyRun — 共有 Python ランタイム（Web Worker 版）＋その場実行パネル

   なぜ Worker か:
     ・メインスレッドで動かすと time.sleep() がブラウザごと固まり、
       出力は最後にまとめてしか出ない（画面を描き直す隙が無いため）。
     ・Worker に追い出すと sleep はワーカー側だけを止め、UI は生きたまま。
       print() のたびに postMessage が飛ぶので、出力欄に1行ずつ流れる。
     ・無限ループも terminate() で切れる＝「中断」が作れる。

   壊してはいけない構造:
     ・Pyodide は「実行」を押した瞬間にだけ取りに行く（起動時に読まない）。
     ・取得に失敗しても46問と辞書は無傷で、実行機能だけが丁寧に失敗する。
     ・Python のラッパは postMessage で渡す（Worker のソースに埋めない）。
       二重エスケープの沼を避けるため。
   ══════════════════════════════════════════════════════════════ */
var PyRun=(function(){
  var CDN='https://cdn.jsdelivr.net/pyodide/v0.28.3/full/';
  var w=null, ready=null, job=null, seq=0, ver='', booted=false;

  /* Worker 側の JS。Python は一切含めない（boot 時に文字列で渡す） */
  var WORKER=[
    'var py=null, RUNNER=null;',
    'function post(o){ self.postMessage(o); }',
    'self.onmessage=function(e){',
    '  var m=e.data;',
    '  if(m.t==="boot"){ boot(m.cdn, m.runner); return; }',
    '  if(m.t==="run"){ exec(m.id, m.code, m.stdin); return; }',
    '};',
    'function boot(cdn, runner){',
    '  RUNNER=runner;',
    '  try{ importScripts(cdn+"pyodide.js"); }',
    '  catch(err){ post({t:"bootfail", m:"Python 本体を取得できませんでした"}); return; }',
    '  loadPyodide({indexURL:cdn}).then(function(p){',
    '    py=p;',
    '    py.setStdout({batched:function(s){ post({t:"out", s:s+"\\n"}); }});',
    '    py.setStderr({batched:function(s){ post({t:"out", s:s+"\\n"}); }});',
    '    var v="";',
    '    try{ v=py.runPython("import sys; \'.\'.join(map(str, sys.version_info[:3]))"); }catch(e){}',
    '    post({t:"ready", v:v});',
    '  }).catch(function(err){ post({t:"bootfail", m:(err&&err.message)||String(err)}); });',
    '}',
    'function exec(id, code, stdin){',
    '  try{',
    '    py.globals.set("_SRC", code);',
    '    py.globals.set("_STDIN", stdin||"");',
    '    py.runPythonAsync(RUNNER).then(function(r){',
    '      var tb=r.get(0), er=r.get(1); r.destroy();',
    '      post({t:"done", id:id, tb:tb, err:er===1});',
    '    }).catch(function(err){ post({t:"done", id:id, tb:(err&&err.message)||String(err), err:true}); });',
    '  }catch(err){ post({t:"done", id:id, tb:(err&&err.message)||String(err), err:true}); }',
    '}'
  ].join('\n');

  /* 実行ラッパ。stdout は Worker 側で逐次転送されるので溜め込まない。
     例外だけ「書いた行」を指すよう整形して返す。 */
  var RUNNER=[
    'import sys, io, builtins, traceback, linecache',
    'sys.stdin = io.StringIO(_STDIN)',
    "linecache.cache['code.py'] = (len(_SRC), None, _SRC.splitlines(True), 'code.py')",
    "def _inp(prompt=''):",
    '    line = sys.stdin.readline()',
    "    if line == '':",
    "        raise EOFError('EOF when reading a line — 入力データが足りません（input() を呼んだ回数と入力欄の行数を合わせる）')",
    "    return line.rstrip('\\n')",
    'builtins.input = _inp',
    '_err = 0',
    "_tb = ''",
    'try:',
    "    exec(compile(_SRC, 'code.py', 'exec'), {'__name__': '__main__'})",
    'except BaseException:',
    '    _err = 1',
    '    _keep = []',
    '    _skip = False',
    '    for _l in traceback.format_exc().splitlines():',
    '        if _l.startswith(\'  File "\'):',
    "            _skip = 'code.py' not in _l",
    '            if not _skip:',
    '                _keep.append(_l)',
    "        elif _l.startswith('    '):",
    '            if not _skip:',
    '                _keep.append(_l)',
    '        else:',
    '            _skip = False',
    '            _keep.append(_l)',
    "    _tb = '\\n'.join(_keep)",
    'try:',
    '    sys.stdout.flush()',
    'except Exception:',
    '    pass',
    '[_tb, _err]'
  ].join('\n');

  function kill(){
    if(w){try{w.terminate();}catch(e){}}
    w=null; ready=null; booted=false;
  }

  function ensure(){
    if(ready)return ready;
    ready=new Promise(function(res,rej){
      var abs=CDN;
      try{abs=new URL(CDN,location.href).href;}catch(e){}
      try{
        var url=URL.createObjectURL(new Blob([WORKER],{type:'text/javascript'}));
        w=new Worker(url);
      }catch(e){
        ready=null;
        rej(new Error('この環境では実行機能を使えません'));
        return;
      }
      w.onmessage=function(e){
        var m=e.data;
        if(m.t==='ready'){ver=m.v||'';booted=true;res();return;}
        if(m.t==='bootfail'){kill();rej(new Error(m.m||'Python 本体を取得できませんでした'));return;}
        if(m.t==='out'){
          if(!job)return;
          job.acc+=m.s;
          if(job.onChunk)job.onChunk(m.s);
          return;
        }
        if(m.t==='done'){
          if(!job||job.id!==m.id)return;
          var j=job; job=null;
          if(m.err&&m.tb){
            var tbs=m.tb+'\n';
            j.acc+=tbs;
            if(j.onChunk)j.onChunk(tbs);
          }
          j.res({out:j.acc,err:!!m.err,cancelled:false});
        }
      };
      w.onerror=function(){
        var j=job; job=null; kill();
        if(j)j.res({out:j.acc,err:true,cancelled:false});
        rej(new Error('実行環境が落ちました'));
      };
      w.postMessage({t:'boot',cdn:abs,runner:RUNNER});
    });
    return ready;
  }

  function run(code,stdin,onChunk){
    if(job)return Promise.reject(new Error('まだ実行中です'));
    return ensure().then(function(){
      return new Promise(function(res){
        job={id:++seq,acc:'',onChunk:onChunk,res:res};
        w.postMessage({t:'run',id:job.id,code:code,stdin:stdin||''});
      });
    });
  }

  /* 無限ループでも確実に止まる。次の実行で Worker を建て直す */
  function cancel(){
    if(!job)return;
    var j=job; job=null; kill();
    j.res({out:j.acc,err:false,cancelled:true});
  }

  function norm(s){
    return String(s).replace(/\r/g,'').split('\n')
      .map(function(l){return l.replace(/\s+$/,'');}).join('\n').replace(/^\n+|\n+$/g,'');
  }

  function el(tag,cls,txt){
    var e=document.createElement(tag);
    if(cls)e.className=cls;
    if(txt!==undefined&&txt!==null)e.textContent=txt;
    return e;
  }

  /* その場実行パネル。出力は届いた順に追記する */
  function panel(opts){
    var code=opts.code||'', stdin=opts.stdin||'', expect=opts.expect;
    var wrap=el('div','runner'), running=false;

    var l1=el('div','rlab','コード');
    l1.appendChild(el('span','','書き換えて実行できます'));
    var ta=el('textarea','rcode'); ta.value=code;
    ta.spellcheck=false; ta.setAttribute('autocapitalize','off'); ta.setAttribute('autocomplete','off');
    ta.setAttribute('aria-label','実行するコード');
    wrap.appendChild(l1); wrap.appendChild(ta);

    var si=null;
    if(opts.showStdin!==false){
      var l2=el('div','rlab','入力データ');
      l2.appendChild(el('span','','input() が上から1行ずつ読みます'));
      si=el('textarea','rin'); si.value=stdin;
      si.spellcheck=false; si.setAttribute('aria-label','標準入力');
      wrap.appendChild(l2); wrap.appendChild(si);
    }

    var row=el('div','rrow');
    var go=el('button','btn btn-main rgo','実行');
    var rs=el('button','btn-sub rreset','もどす');
    go.type='button'; rs.type='button';
    row.appendChild(go); row.appendChild(rs); wrap.appendChild(row);

    var boot=el('div','rboot'); boot.style.display='none';
    var dot=el('span','d'); boot.appendChild(dot); boot.appendChild(el('span','m',''));
    wrap.appendChild(boot);

    var term=el('div','term');
    term.appendChild(el('div','term-l','結果'));
    var out=el('div','term-o idle','まだ実行していません');
    out.setAttribute('aria-live','polite');
    term.appendChild(out); wrap.appendChild(term);
    var match=el('div','rmatch'); match.style.display='none'; wrap.appendChild(match);

    function say(msg,state){
      boot.style.display=msg?'flex':'none';
      boot.querySelector('.m').textContent=msg||'';
      dot.className='d'+(state?' '+state:'');
      boot.className='rboot'+(state==='fail'?' fail':'');
    }
    function setRunning(on){
      running=on;
      go.textContent=on?'中断':'実行';
      go.classList.toggle('stop',on);
      rs.disabled=on;
    }

    rs.onclick=function(){
      if(running)return;
      ta.value=code; if(si)si.value=stdin;
      out.className='term-o idle'; out.textContent='まだ実行していません';
      match.style.display='none'; say('');
    };

    go.onclick=function(){
      if(running){PyRun.cancel();return;}
      setRunning(true);
      out.className='term-o'; out.textContent='';
      match.style.display='none';
      if(!booted)say('Python を読み込み中（初回は10MBほど / 数十秒）','');
      PyRun.run(ta.value, si?si.value:'', function(chunk){
        out.textContent+=chunk;
      }).then(function(r){
        setRunning(false); say('');
        if(r.cancelled){
          out.textContent+=(out.textContent?'\n':'')+'— 中断しました —';
          out.className='term-o idle'; return;
        }
        if(out.textContent===''){out.className='term-o idle';out.textContent='（出力なし）';}
        else if(r.err)out.className='term-o err';
        if(expect===undefined||expect===null||r.err){match.style.display='none';return;}
        var same=norm(r.out)===norm(expect);
        match.style.display='';
        match.className='rmatch '+(same?'ok':'ng');
        match.textContent=same?'期待どおりの出力':'期待と違う出力 — 期待は '+String(expect).replace(/\n/g,' ⏎ ');
      }).catch(function(e){
        setRunning(false);
        say((e&&e.message)||String(e),'fail');
        out.className='term-o idle';
        out.textContent='Python を取得できませんでした。通信が必要なのはここだけで、辞書と46問はこのまま使えます。';
        match.style.display='none';
      });
    };

    ta.addEventListener('keydown',function(e){
      if(e.key==='Tab'){
        e.preventDefault();
        var s=ta.selectionStart,t=ta.selectionEnd;
        ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(t);
        ta.selectionStart=ta.selectionEnd=s+4;
      }else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){
        e.preventDefault(); go.click();
      }
    });
    /* いじり場が「壊れた形 / 直した形」を差し替えるための口 */
    wrap.setCode=function(c,s){ta.value=c;if(si)si.value=s||'';
      out.className='term-o idle';out.textContent='まだ実行していません';
      match.style.display='none';say('');};
    wrap.setExpect=function(v){expect=v;};
    return wrap;
  }

  return {ensure:ensure, run:run, cancel:cancel, panel:panel, norm:norm,
          busy:function(){return !!job;},
          booted:function(){return booted;},
          version:function(){return ver;}};
})();

/* 辞書: 「動かす」でその場に実行パネルを開く */
function toggleRun(btn,id,i){
  var host=btn.closest('.dvar');
  var open=host.querySelector('.runner');
  if(open){open.remove();btn.textContent='動かす';return;}
  var v=null;
  DICT.forEach(function(c){c.items.forEach(function(it){if(it.id===id)v=it.v[i];});});
  ATOMS.forEach(function(c){c.items.forEach(function(it){if(it.id===id)v=it.v[i];});});
  if(!v)return;
  host.appendChild(PyRun.panel({code:v.c, stdin:v.i||'', expect:v.o}));
  btn.textContent='とじる';
}

/* 出題: 答え合わせのあと「いじってみる」で正解形を書き換えて試す */
function toggleQuizRun(btn){
  var host=document.getElementById('q-feedback');
  var open=host.querySelector('.runner');
  if(open){open.remove();btn.textContent='いじってみる';return;}
  var q=QS.list[QS.i], src='';
  if(q.type==='predict'){
    src=(q.code||[]).join('\n');
  }else if(Array.isArray(q.ctx)){
    var built=joinCode(q.tokens);
    src=q.ctx.map(function(l){return l.split(SLOT).join(built);}).join('\n');
  }else{
    src=(typeof q.ctx==='string'&&q.ctx?q.ctx+'\n':'')+joinCode(q.tokens);
  }
  host.appendChild(PyRun.panel({code:src, stdin:'', showStdin:false,
    expect:(q.out===null||q.out===undefined)?null:q.out}));
  btn.textContent='とじる';
}

/* ══ エラー辞書 ══
   「やりたいこと」から引く本編の辞書に対して、こちらは
   **目の前に出ているエラー文から引く**。学習者が持っている手がかりが
   エラー文そのものなので、索引はそれに合わせる。
   各項目に いじり場 を持たせ、壊れた形と直した形を往復できるようにする。 */
function openErr(){renderErr(document.getElementById('e-search').value);show('scr-err');}

function renderErr(filter){
  var f=(filter||'').trim().toLowerCase();
  var box=document.getElementById('e-list');box.innerHTML='';
  var cats=[],map={},hits=0;
  ERRORS.forEach(function(e){
    var hay=(e.err+' '+e.msg+' '+e.why+' '+e.cat+' '+e.note+' '+e.bad).toLowerCase();
    if(f&&hay.indexOf(f)<0)return;
    if(!map[e.cat]){map[e.cat]=[];cats.push(e.cat);}
    map[e.cat].push(e);hits++;
  });
  cats.forEach(function(c){
    var ch=document.createElement('div');ch.className='dcat';ch.textContent=c;box.appendChild(ch);
    map[c].forEach(function(e){
      var d=document.createElement('div');d.className='ditem eitem';
      var b=cardFace(e.id, e.err, e.msg, e.bad, 'いじり場あり');
      b.onclick=function(){
        d.classList.toggle('open');
        if(d.classList.contains('open')&&!d.dataset.built){buildErrBody(d,e);d.dataset.built='1';}
      };
      d.appendChild(b);
      var body=document.createElement('div');body.className='dbody ebody';d.appendChild(body);
      box.appendChild(d);
      if(f&&hits<=3){d.classList.add('open');buildErrBody(d,e);d.dataset.built='1';}
    });
  });
  if(!hits)box.innerHTML='<div class="dnone">見つかりません。エラー文の一部（型の名前など）で探してみてください。</div>';
}

function buildErrBody(d,e){
  var body=d.querySelector('.ebody');
  var h='<div class="dlab">なぜ出るか</div><div class="duse">'+e.why+'</div>'
   +'<div class="dlab">これを実行すると出る</div><div class="code">'+esc(e.bad)+'</div>';
  if(e.bi)h+='<div class="dio"><i>入力</i> <span class="in">'+esc(e.bi).replace(/\n/g,' ⏎ ')+'</span></div>';
  h+='<div class="eout">'+esc(e.err+': '+e.msg)+'</div>'
   +'<div class="dlab">直した形</div><div class="code">'+esc(e.fix)+'</div>';
  if(e.fi)h+='<div class="dio"><i>入力</i> <span class="in">'+esc(e.fi).replace(/\n/g,' ⏎ ')+'</span></div>';
  h+='<div class="dio"><i>結果</i> <span class="out">'+esc(e.fo).replace(/\n/g,' ⏎ ')+'</span></div>'
   +'<div class="dtrap">'+e.note+'</div>'
   +'<button type="button" class="eplay" onclick="toggleErrRun(this,\''+e.id+'\')">いじり場をひらく</button>';
  body.innerHTML=h;
}

/* いじり場: 壊れた形で開き、ボタンで直した形と往復する */
function toggleErrRun(btn,id){
  var host=btn.closest('.eitem');
  var open=host.querySelector('.runner');
  if(open){
    var sw=host.querySelector('.eswitch');
    if(sw)sw.remove();
    open.remove();btn.textContent='いじり場をひらく';return;
  }
  var e=null;ERRORS.forEach(function(x){if(x.id===id)e=x;});
  if(!e)return;
  var body=host.querySelector('.ebody');
  var sw2=document.createElement('div');sw2.className='eswitch';
  var b1=document.createElement('button');b1.type='button';b1.className='eswbtn on';b1.textContent='壊れた形';
  var b2=document.createElement('button');b2.type='button';b2.className='eswbtn';b2.textContent='直した形';
  sw2.appendChild(b1);sw2.appendChild(b2);
  var pan=PyRun.panel({code:e.bad,stdin:e.bi||'',expect:null});
  body.appendChild(sw2);body.appendChild(pan);
  b1.onclick=function(){
    pan.setExpect(null);pan.setCode(e.bad,e.bi||'');
    b1.classList.add('on');b2.classList.remove('on');
  };
  b2.onclick=function(){
    pan.setExpect(e.fo);pan.setCode(e.fix,e.fi||'');
    b2.classList.add('on');b1.classList.remove('on');
  };
  btn.textContent='いじり場をとじる';
}

/* ══ カード面の組み立て ══
   スロットは media(コードの断片) / header(eyebrow + title) / body(説明) /
   metadata / footer(アクション) の順。カード全体で1個の <button> にして、
   中身は <span> で組む（<button> の中に <div> を置くと HTML として不正で、
   カードを <a> で包んで中にリンクを入れ子にするのと同じ事故になる）。 */
function plain(h){var d=document.createElement('div');d.innerHTML=h||'';return (d.textContent||'').trim();}

function cardFace(eyebrow,title,desc,code,meta){
  var b=document.createElement('button');
  b.type='button';b.className='dhead';
  var head=String(code||'').split('\n').slice(0,3).join('\n');
  b.innerHTML=
     '<span class="c-media"><span class="c-code">'+esc(head)+'</span></span>'
    +'<span class="c-head">'
    +  '<span class="c-eyebrow">'+esc(eyebrow)+'</span>'
    +  '<span class="c-title">'+esc(title)+'</span>'
    +'</span>'
    +'<span class="c-body">'+esc(desc)+'</span>'
    +'<span class="c-meta">'+esc(meta)+'</span>'
    +'<span class="c-foot"><span class="c-act"></span><span class="c-sign"></span></span>';
  return b;
}

/* 実行例1件分のマークアップ。辞書・原子辞書で共用（入れ子テンプレートリテラルを避け文字列連結で組む） */
function varHtml(it,v,i){
  var h='<div class="dvar">'
   +'<div class="dvl"><span>'+esc(v.l)+'</span>'
   +'<span style="display:flex;gap:6px;flex:0 0 auto">'
   +'<button class="dcopy drun" onclick="toggleRun(this,\''+it.id+'\','+i+')">動かす</button>'
   +'<button class="dcopy" onclick="copyCode(\''+it.id+'\','+i+')">コピー</button>'
   +'</span></div>'
   +'<div class="code">'+esc(v.c)+'</div>'
   +'<div class="dio">';
  if(v.i)h+='<div><i>入力</i> <span class="in">'+esc(v.i).replace(/\n/g,' ⏎ ')+'</span></div>';
  h+='<div><i>結果</i> <span class="out">'+esc(v.o).replace(/\n/g,' ⏎ ')+'</span></div>'
   +'</div></div>';
  return h;
}

/* ══ 原子辞書 ══
   記号ひとつを「役割 → なにができる → 例 → 落とし穴」で引く。
   本編の辞書が「やりたいこと」から、エラー辞書が「出たエラー文」から引くのに対し、
   これは **目の前のコードに写っている記号** から引く。 */
function openAtom(){renderAtomChips();renderAtom(document.getElementById('a-search').value);show('scr-atom');}

function cardFaceSym(sym,eyebrow,title,desc,meta){
  var b=document.createElement('button');
  b.type='button';b.className='dhead';
  var long=String(sym).length>6?' long':'';   /* def return のような長い記号は縮めて折り返す */
  b.innerHTML=
     '<span class="c-media c-sym"><span class="c-symtext'+long+'">'+esc(sym)+'</span></span>'
    +'<span class="c-head">'
    +  '<span class="c-eyebrow">'+esc(eyebrow)+'</span>'
    +  '<span class="c-title">'+esc(title)+'</span>'
    +'</span>'
    +'<span class="c-body">'+esc(desc)+'</span>'
    +'<span class="c-meta">'+esc(meta)+'</span>'
    +'<span class="c-foot"><span class="c-act"></span><span class="c-sign"></span></span>';
  return b;
}

function renderAtom(filter){
  var f=(filter||'').trim().toLowerCase();
  var box=document.getElementById('a-list');box.innerHTML='';
  var hits=0;
  ATOMS.forEach(function(cat){
    if(ATOM_CAT&&cat.cat!==ATOM_CAT)return;
    var items=cat.items.filter(function(it){
      if(!f)return true;
      var hay=(it.sym+' '+it.head+' '+it.role+' '+it.use+' '+it.trap+' '+cat.cat+' '
              +it.v.map(function(v){return v.l+' '+v.c;}).join(' ')).toLowerCase();
      return hay.indexOf(f)>=0;
    });
    if(!items.length)return;
    hits+=items.length;
    var ch=document.createElement('div');ch.className='dcat';ch.textContent=cat.cat;box.appendChild(ch);
    items.forEach(function(it){
      var d=document.createElement('div');d.className='ditem aitem';
      var b=cardFaceSym(it.sym, it.id, it.head, it.role, it.v.length+' 例');
      b.onclick=function(){
        d.classList.toggle('open');
        if(d.classList.contains('open')&&!d.dataset.built){buildAtomBody(d,it);d.dataset.built='1';}
      };
      d.appendChild(b);
      var body=document.createElement('div');body.className='dbody';d.appendChild(body);
      box.appendChild(d);
      if(f&&items.length<=3){d.classList.add('open');buildAtomBody(d,it);d.dataset.built='1';}
    });
  });
  if(!hits)box.innerHTML='<div class="dnone">見つかりません。記号そのもの（* や : など）や、やりたい動きで探してみてください。</div>';
}

function buildAtomBody(d,it){
  var body=d.querySelector('.dbody');
  body.innerHTML='<div class="arole">'+esc(it.role)+'</div>'
    +'<div class="dlab">なにができるか</div><div class="duse">'+it.use+'</div>'
    +'<div class="dlab">動かして確かめる</div>'
    +varsTabs(it)
    +'<div class="dtrap">'+it.trap+'</div>';
  wireTabs(body);
}

/* ══ タブ（例の切り替え） ══
   ref: ant.design/components/tabs の line タイプ（インクバーが active の下を動く）
   Ant の文書はキーボード操作に触れていないので、そこは WAI-ARIA の tabs パターンで補う:
   role=tablist/tab/tabpanel、aria-selected、aria-controls、
   roving tabindex（active だけ 0、他は -1）、←→ と Home/End で移動。 */
function varsTabs(it){
  var g=it.id, h='<div class="tabs"><div class="tablist" role="tablist" aria-label="実行例">';
  it.v.forEach(function(v,i){
    h+='<button type="button" role="tab" class="tab'+(i===0?' on':'')+'"'
      +' id="tb-'+g+'-'+i+'" aria-controls="tp-'+g+'-'+i+'"'
      +' aria-selected="'+(i===0?'true':'false')+'" tabindex="'+(i===0?'0':'-1')+'">'
      +esc(v.l)+'</button>';
  });
  h+='<span class="ink"></span></div>';
  it.v.forEach(function(v,i){
    h+='<div role="tabpanel" class="tabpanel" id="tp-'+g+'-'+i+'"'
      +' aria-labelledby="tb-'+g+'-'+i+'"'+(i===0?'':' hidden')+'>'
      +varHtml(it,v,i)+'</div>';
  });
  return h+'</div>';
}

function wireTabs(root){
  [].forEach.call(root.querySelectorAll('.tabs'),function(g){
    var tabs=[].slice.call(g.querySelectorAll('[role=tab]'));
    var ink=g.querySelector('.ink');
    function moveInk(){
      var a=g.querySelector('[role=tab].on');
      if(!a||!ink)return;
      ink.style.left=a.offsetLeft+'px';
      ink.style.width=a.offsetWidth+'px';
    }
    function select(i,focus){
      tabs.forEach(function(t,j){
        var on=(i===j);
        t.classList.toggle('on',on);
        t.setAttribute('aria-selected',on?'true':'false');
        t.tabIndex=on?0:-1;
        var p=document.getElementById(t.getAttribute('aria-controls'));
        if(p)p.hidden=!on;
      });
      moveInk();
      if(focus){
        tabs[i].focus();
        // 端のタブが見切れないよう、横スクロールを合わせる
        if(tabs[i].scrollIntoView)tabs[i].scrollIntoView({block:'nearest',inline:'nearest'});
      }
    }
    tabs.forEach(function(t,i){
      t.onclick=function(){select(i,false);};
      t.onkeydown=function(e){
        var n=null, last=tabs.length-1;
        if(e.key==='ArrowRight')n=(i+1)%tabs.length;
        else if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;
        else if(e.key==='Home')n=0;
        else if(e.key==='End')n=last;
        if(n!==null){e.preventDefault();select(n,true);}
      };
    });
    moveInk();
  });
}

/* ══ クラス（分類）の絞り込みチップ ══ */
var ATOM_CAT='';
function renderAtomChips(){
  var box=document.getElementById('a-chips');
  if(!box)return;
  var h='<button type="button" class="chipf'+(ATOM_CAT===''?' on':'')+'" onclick="setAtomCat(\'\')">'
       +'ぜんぶ<span class="n">'+ATOMS.reduce(function(a,c){return a+c.items.length;},0)+'</span></button>';
  ATOMS.forEach(function(c){
    h+='<button type="button" class="chipf'+(ATOM_CAT===c.cat?' on':'')+'"'
      +' onclick="setAtomCat(\''+c.cat+'\')">'+esc(c.cat)
      +'<span class="n">'+c.items.length+'</span></button>';
  });
  box.innerHTML=h;
}
function setAtomCat(c){
  ATOM_CAT=c;
  renderAtomChips();
  renderAtom(document.getElementById('a-search').value);
  document.getElementById('scr-atom').scrollTop=0;
}

renderHome();
