<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="hsl(276,13%,15%)">
<title>Python 組み立てドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   Python 引き出しトレーニング — ダーク Neumorphism (Soft UI)
   ref: namethatui.com/styles/neumorphism ／ 押下物理は同サイトの Soft UI ブリーフ準拠
   ref: ボタン階層・固定CTA・タップ領域は LINE / メルカリ / 食べログ / Yahoo!ショッピング 実測準拠

   定義シグナル(厳守): コントロールは地と同一のマット色を共有 ／ 浮きは二重ソフト影(明=左上・暗=右下)
   ／ 押下と入力は同じ影ペアを inset に反転 ／ 枠線は置かない ／ 角丸は均一かつ大きめ
   ／ 質感・光沢・素材模倣は持たない(skeuomorphism へ寄らせない)

   影だけでは WCAG 1.4.11 の 3:1 に届かない(暗地での上限は実測 1.46)。
   よってプロンプト規定どおり
     ・主アクションのみ彩度アクセントのベタ塗り(紫に濃文字＝4.93:1)
     ・focus と状態は「影ではない」手がかり(輪郭リング／塗り／字形)
   で補う。ここは削らない。
   ══════════════════════════════════════════════════════════════ */
:root{
  /* ── 一続きのマット面。地もコントロールも同じ色 ── */
  --surface:hsl(276,13%,15%);
  --sunken:hsl(276,22%,7%);
  --ink:hsl(280,18%,93%);--ink-soft:hsl(280,10%,72%);--pencil:hsl(280,7%,56%);
  --accent:hsl(281,66%,62%);--accent-press:hsl(281,62%,53%);--accent-wash:hsla(281,66%,62%,.15);
  --teal:hsl(168,42%,52%);--good:hsl(150,50%,58%);--bad:hsl(2,78%,64%);--term-err:hsl(2,78%,64%);
  --code-ink:hsl(280,12%,84%);
  --on-accent:hsl(276,20%,11%);        /* 紫ベタ塗りの上の文字＝4.93:1 */
  --disabled-ink:hsl(280,7%,50%);

  /* ── 二重ソフト影（光源は常に左上・回転させない） ── */
  --sh-l:hsl(276,11%,26%);--sh-d:hsl(276,26%,3%);
  --raise:   -6px -6px 14px var(--sh-l),  6px  6px 14px var(--sh-d);
  --raise-sm:-3px -3px  7px var(--sh-l),  3px  3px  7px var(--sh-d);
  --raise-lg:-9px -9px 22px var(--sh-l),  9px  9px 22px var(--sh-d);
  --press:   inset -4px -4px  9px var(--sh-l), inset  4px  4px  9px var(--sh-d);
  --press-sm:inset -2px -2px  5px var(--sh-l), inset  2px  2px  5px var(--sh-d);
  --well:    inset -5px -5px 11px var(--sh-l), inset  5px  5px 11px var(--sh-d);

  /* ── 角丸は均一（非対称にすると光の回り込みが破綻する） ── */
  --r-lg:22px;--r-md:16px;--r-sm:13px;--r-pill:999px;

  /* ── 寸法（実測: CTA 56 / 既定 48 / 小 40 / タップ下限 44） ── */
  --h-cta:56px;--h-ctl:48px;--h-sm:40px;--hit:44px;

  /* ── 余白 ── */
  --f1:5px;--f2:8px;--f3:13px;--f4:21px;--f5:34px;--f6:55px;

  /* ── モーション（押下は色変化が主・動きは従） ── */
  --t-down:30ms;--t-up:90ms;--t-state:140ms;--t-enter:220ms;--t-bar:260ms;
  --e-out:cubic-bezier(.22,1,.36,1);--e-std:cubic-bezier(.4,0,.2,1);

  --z-bar:40;--z-toast:60;

  --f-display:'Anton','Noto Sans JP',sans-serif;--f-body:'Noto Sans JP',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',monospace;--f-hand:'Yomogi',cursive;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:var(--f-body);background:var(--surface);color:var(--ink);min-height:100vh;
  line-height:1.62;overflow-x:hidden}
button,select,textarea,input{font-family:var(--f-body);color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-wash)}

/* ── focus＝影ではない唯一の輪郭。no-border 方針の例外はここだけ（プロンプト規定） ── */
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:inherit}

/* ── 押下物理: 浮き→inset へ反転。色変化を必ず伴わせる（影だけに頼らない） ── */
.press{transition:box-shadow var(--t-up) var(--e-out),transform var(--t-up) var(--e-out),
  background-color var(--t-state) var(--e-std),color var(--t-state) var(--e-std)}
.press:active{transition-duration:var(--t-down),var(--t-down),var(--t-state),var(--t-state);
  box-shadow:var(--press);transform:translateY(1px)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  /* 動きを消しても「押した」ことは伝わらねばならない＝静的な状態変化で代替 */
  .press:active{transform:none;box-shadow:var(--press);filter:brightness(1.12)}
}

/* ── 画面 ── */
.screen{position:fixed;inset:0;background:var(--surface);opacity:0;pointer-events:none;
  transition:opacity .25s ease;z-index:10;overflow-y:auto}
.screen.active{opacity:1;pointer-events:all}
.wrap{max-width:620px;margin:0 auto;padding:var(--f5) var(--f4) var(--f6)}
@media(max-width:520px){.wrap{padding:var(--f4) var(--f3) var(--f6)}}

/* ── ホーム ── */
.logo{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,10vw,3rem);color:var(--ink);
  line-height:.98;letter-spacing:.01em;margin-top:var(--f3)}
.logo em{color:var(--accent);font-style:normal}
.logo-sub{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--pencil);margin-top:var(--f3)}
/* 統計＝浮いた1枚の面 */
.stat-card{background:var(--surface);border-radius:var(--r-lg);padding:var(--f4);
  margin:var(--f4) 0;display:flex;gap:var(--f4);box-shadow:var(--raise)}
.stat{flex:1}
.stat-n{font-family:var(--f-mono);font-size:1.5rem;font-weight:700;color:var(--accent);line-height:1}
.stat-l{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pencil);margin-top:var(--f1)}
.sec-h{font-family:var(--f-display);font-weight:400;font-size:1.35rem;color:var(--ink);margin:0 0 var(--f1)}
.sec-d{font-size:.76rem;color:var(--ink-soft);margin-bottom:var(--f3);line-height:1.6}
/* モードカード＝浮き。押すと沈む */
.mode{display:block;width:100%;text-align:left;background:var(--surface);border-radius:var(--r-lg);
  padding:var(--f4);margin-bottom:var(--f3);min-height:var(--h-ctl);box-shadow:var(--raise);
  transition:box-shadow var(--t-up) var(--e-out),transform var(--t-up) var(--e-out)}
.mode:active{transition-duration:var(--t-down);box-shadow:var(--press);transform:translateY(1px)}
.mode-n{font-weight:700;font-size:1rem;color:var(--ink)}
.mode-d{font-size:.74rem;color:var(--ink-soft);margin-top:var(--f1);line-height:1.55}
/* 進捗＝沈んだ溝にアクセントが満ちる */
.mode-bar{height:8px;background:var(--sunken);border-radius:var(--r-pill);margin-top:var(--f3);
  overflow:hidden;box-shadow:var(--press-sm)}
.mode-bar i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill)}
/* 主役カード＝唯一の彩度アクセントを薄く敷く（ベタ塗りは主アクションのために温存） */
.mode.wide{background:linear-gradient(var(--accent-wash),var(--accent-wash)),var(--surface);
  box-shadow:var(--raise-lg)}
.mode.wide .mode-n{color:var(--accent)}
.mode.wide .mode-d{color:var(--ink-soft)}
.mode.wide .mode-bar{background:var(--sunken)}
.reset-link{display:block;width:100%;min-height:var(--hit);text-align:center;font-family:var(--f-mono);
  font-size:.68rem;letter-spacing:.12em;color:var(--pencil);margin-top:var(--f5);border-radius:var(--r-md)}
.reset-link:active{color:var(--ink)}
.spacer{height:var(--f4)}

/* ── クイズ ── */
#scr-quiz{display:flex;flex-direction:column;height:100dvh}
.qbar{display:flex;align-items:center;gap:var(--f3);padding:var(--f3) var(--f4) 0;
  max-width:620px;margin:0 auto;width:100%;flex:0 0 auto}
/* アイコンボタン＝見た目40pxでも当たり判定は44px */
.qclose{position:relative;width:var(--h-sm);height:var(--h-sm);padding:0;border-radius:var(--r-sm);
  font-size:1.3rem;line-height:1;color:var(--ink-soft);background:var(--surface);box-shadow:var(--raise-sm);
  transition:box-shadow var(--t-up) var(--e-out),color var(--t-state) var(--e-std)}
.qclose::before{content:"";position:absolute;inset:calc((var(--h-sm) - var(--hit))/2)}
.qclose:active{box-shadow:var(--press-sm);color:var(--ink)}
.prog{flex:1;height:10px;background:var(--sunken);border-radius:var(--r-pill);overflow:hidden;box-shadow:var(--press-sm)}
.prog i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill);transition:width .3s ease}
.combo{font-family:var(--f-mono);font-size:.78rem;font-weight:700;color:var(--accent);min-width:34px;text-align:right}
.qbody{flex:1 1 auto;min-height:0;overflow-y:auto;max-width:620px;margin:0 auto;width:100%;padding:var(--f4)}
.qcat{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--pencil);margin-bottom:var(--f2)}
.qtask{font-size:1.05rem;font-weight:500;line-height:1.55;margin-bottom:var(--f4)}

/* コード面＝彫り込んだ窪み（入力面は inset というソフトUIの規定どおり） */
.code{font-family:var(--f-mono);font-size:.92rem;background:var(--sunken);color:var(--code-ink);
  border-radius:var(--r-md);padding:var(--f4);white-space:pre;overflow-x:auto;line-height:1.8;
  box-shadow:var(--well)}
.code .slot{background:var(--accent-wash);color:var(--accent);padding:2px 5px;border-radius:6px;font-weight:700}
.code .slot.empty{color:var(--pencil)}
.code .caret{display:inline-block;width:7px;height:.95em;background:var(--accent);vertical-align:-1px;
  animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}

/* 置き場＝深い窪み。枠線は置かず、深さで「入れる所」を示す */
.target{background:var(--sunken);border-radius:var(--r-md);padding:var(--f3);min-height:76px;
  display:flex;flex-wrap:wrap;gap:var(--f2);align-content:flex-start;margin:var(--f3) 0;box-shadow:var(--well)}
.target:empty::before{content:'下のブロックをタップして組み立てる';font-family:var(--f-hand);
  font-size:.88rem;color:var(--pencil);align-self:center;margin:auto}
.pool{display:flex;flex-wrap:wrap;gap:var(--f2);padding:var(--f3);background:var(--sunken);
  border-radius:var(--r-md);min-height:64px;box-shadow:var(--well)}
/* チップ＝窪みの中に浮く小片。44px を確保 */
.chip{font-family:var(--f-mono);font-size:.94rem;font-weight:500;min-height:var(--hit);
  padding:11px var(--f3);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);
  white-space:nowrap;box-shadow:var(--raise-sm);
  transition:box-shadow var(--t-up) var(--e-out),transform var(--t-up) var(--e-out),
    background-color var(--t-state) var(--e-std),color var(--t-state) var(--e-std)}
.chip:active{transition-duration:var(--t-down);box-shadow:var(--press-sm);transform:translateY(1px)}
.chip.used{opacity:.3;box-shadow:none;pointer-events:none}
.chip.placed{background:var(--accent);color:var(--on-accent);box-shadow:var(--raise-sm)}
.chip .pos{font-size:.6rem;color:var(--pencil);margin-right:5px}
.chip.placed .pos{color:var(--on-accent);opacity:.75}
.status{font-family:var(--f-mono);font-size:.72rem;color:var(--pencil);text-align:center;margin:var(--f3) 0}

/* 選択肢＝浮いた面。正誤は色だけでなく字形でも示す（1.4.1） */
.choices{display:flex;flex-direction:column;gap:var(--f2);margin-top:var(--f3)}
.choice{font-family:var(--f-mono);font-size:.95rem;text-align:left;background:var(--surface);
  min-height:var(--h-ctl);border-radius:var(--r-md);padding:var(--f3) var(--f4);color:var(--ink);
  white-space:pre-wrap;box-shadow:var(--raise);
  transition:box-shadow var(--t-up) var(--e-out),transform var(--t-up) var(--e-out),
    background-color var(--t-state) var(--e-std),color var(--t-state) var(--e-std)}
.choice:active{transition-duration:var(--t-down);box-shadow:var(--press);transform:translateY(1px)}
.choice.ok{background:var(--good);color:var(--on-accent);box-shadow:var(--raise)}
.choice.ng{background:var(--bad);color:var(--on-accent);box-shadow:var(--raise)}
.choice.ok::after{content:"○";float:right;font-family:var(--f-hand);font-weight:700;margin-left:var(--f2)}
.choice.ng::after{content:"×";float:right;font-family:var(--f-hand);font-weight:700;margin-left:var(--f2)}
.choice.dim{opacity:.42;box-shadow:none}

/* 出力＝窪み */
.term{background:var(--sunken);border-radius:var(--r-md);padding:var(--f3) var(--f4);margin-top:var(--f3);
  font-family:var(--f-mono);font-size:.9rem;box-shadow:var(--well)}
.term-l{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pencil);margin-bottom:var(--f1)}
.term-o{color:var(--good);white-space:pre-wrap;word-break:break-all}
.verdict{font-family:var(--f-display);font-weight:400;font-size:1.25rem;letter-spacing:.02em;margin-top:var(--f3)}
.verdict.ok{color:var(--good)}
.verdict.ng{color:var(--bad)}
.exp{background:var(--sunken);border-radius:var(--r-md);padding:var(--f4);margin-top:var(--f3);
  font-size:.84rem;line-height:1.8;color:var(--ink-soft);box-shadow:var(--well)}
.exp code{font-family:var(--f-mono);background:var(--surface);color:var(--code-ink);padding:2px 6px;
  border-radius:6px;font-size:.9em}
.exp b{color:var(--ink);font-weight:700}

/* ── 固定アクションバー（実測: 16px padding・safe-area・不透明・ぼかし無し） ── */
.qfoot{flex:0 0 auto;position:relative;z-index:var(--z-bar);max-width:620px;margin:0 auto;width:100%;
  display:flex;gap:var(--f2);background:var(--surface);
  padding:var(--f3) var(--f4);padding-bottom:max(var(--f3),env(safe-area-inset-bottom));
  box-shadow:0 -7px 18px var(--sh-d)}
/* スクリム＝多段グラデ。blur() は使わない（旧GPUでスクロールが死ぬため） */
.qfoot::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:30px;pointer-events:none;
  background:linear-gradient(to top,hsl(276,13%,15%) 0%,hsla(276,13%,15%,.9) 28%,
    hsla(276,13%,15%,.55) 56%,hsla(276,13%,15%,0) 100%)}

/* ── ボタン ── */
.btn{flex:1;min-height:var(--h-cta);padding:var(--f3) var(--f4);border-radius:var(--r-md);
  font-weight:700;font-size:.98rem;line-height:1.2;box-shadow:var(--raise);
  transition:box-shadow var(--t-up) var(--e-out),transform var(--t-up) var(--e-out),
    background-color var(--t-state) var(--e-std),color var(--t-state) var(--e-std)}
.btn:active{transition-duration:var(--t-down);box-shadow:var(--press);transform:translateY(1px)}
/* 主アクション＝唯一の彩度ベタ塗り。濃文字で 4.93:1 */
.btn-main{background:var(--accent);color:var(--on-accent)}
.btn-main:active{background:var(--accent-press)}
.btn-main:disabled{background:var(--surface);color:var(--disabled-ink);box-shadow:var(--press-sm);
  transform:none;cursor:default}
/* 副アクション＝地と同じ面のまま浮かせる */
.btn-sub{flex:0 0 auto;min-width:var(--hit);min-height:var(--h-cta);padding:var(--f3) var(--f4);
  border-radius:var(--r-md);background:var(--surface);color:var(--ink);font-size:.92rem;
  box-shadow:var(--raise)}
.btn-sub:active{box-shadow:var(--press);transform:translateY(1px)}
.btn-sub:disabled{color:var(--disabled-ink);box-shadow:var(--press-sm);transform:none;cursor:default}

/* ── 辞書 ── */
.dbar{display:flex;align-items:center;gap:var(--f2);margin-bottom:var(--f4)}
.dsearch{flex:1;min-height:var(--h-ctl);font-size:1rem;padding:var(--f3) var(--f4);border:none;
  border-radius:var(--r-md);background:var(--sunken);color:var(--ink);box-shadow:var(--well)}
.dsearch::placeholder{color:var(--pencil)}
.dcat{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--pencil);margin:var(--f5) 0 var(--f3)}
.dcat:first-of-type{margin-top:var(--f2)}
.ditem{background:var(--surface);border-radius:var(--r-lg);margin-bottom:var(--f3);box-shadow:var(--raise)}
.ditem.open{box-shadow:var(--raise-lg)}
.dhead{display:block;width:100%;min-height:var(--h-ctl);text-align:left;padding:var(--f3) var(--f4);
  font-size:.94rem;font-weight:500;color:var(--ink);line-height:1.5;position:relative;padding-right:46px;
  border-radius:var(--r-lg)}
.dhead::after{content:'＋';position:absolute;right:18px;top:50%;transform:translateY(-50%);
  color:var(--accent);font-size:1rem}
.ditem.open .dhead::after{content:'−'}
.ditem.open .dhead{font-weight:700;color:var(--accent)}
.dbody{padding:0 var(--f4) var(--f4);display:none}
.ditem.open .dbody{display:block}
.dvar{margin-bottom:var(--f4)}
.dvl{font-size:.74rem;color:var(--ink-soft);margin-bottom:var(--f2);display:flex;
  justify-content:space-between;align-items:center;gap:var(--f2)}
/* コピー＝見た目は小さくても 44px の当たり判定 */
.dcopy{position:relative;font-family:var(--f-mono);font-size:.64rem;color:var(--ink-soft);
  min-height:var(--h-sm);padding:0 var(--f3);border-radius:var(--r-sm);background:var(--surface);
  flex:0 0 auto;box-shadow:var(--raise-sm);transition:box-shadow var(--t-up) var(--e-out)}
.dcopy::before{content:"";position:absolute;inset:calc((var(--h-sm) - var(--hit))/2) 0}
.dcopy:active{box-shadow:var(--press-sm)}
.dio{font-family:var(--f-mono);font-size:.78rem;margin-top:var(--f2);line-height:1.7}
.dio i{color:var(--pencil);font-style:normal}
.dio .in{color:var(--ink)}
.dio .out{color:var(--good);font-weight:700}
.duse{font-size:.8rem;line-height:1.75;background:var(--sunken);border-radius:var(--r-sm);
  padding:var(--f3);margin-top:var(--f2);color:var(--ink-soft);box-shadow:var(--well)}
.dtrap{font-size:.8rem;line-height:1.75;background:var(--sunken);border-radius:var(--r-sm);
  padding:var(--f3);margin-top:var(--f2);color:var(--ink-soft);box-shadow:var(--well)}
.dtrap b{color:var(--bad)}
.duse b{color:var(--ink)}
.duse code,.dtrap code{font-family:var(--f-mono);background:var(--surface);color:var(--code-ink);
  padding:2px 6px;border-radius:6px;font-size:.9em}
.dlab{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.12em;color:var(--pencil);margin-bottom:var(--f1)}
.dnone{font-family:var(--f-hand);font-size:.9rem;color:var(--ink-soft);text-align:center;padding:var(--f5) 0}

/* ── 結果 ── */
.res-n{font-family:var(--f-display);font-weight:400;font-size:3.6rem;color:var(--ink);line-height:1}
.res-l{font-size:.82rem;color:var(--ink-soft);margin-top:var(--f1);line-height:1.6}
.res-row{display:flex;justify-content:space-between;font-size:.85rem;padding:var(--f3) 0}
.res-row b{font-family:var(--f-mono);color:var(--accent)}
.miss{font-family:var(--f-mono);font-size:.8rem;background:var(--sunken);border-radius:var(--r-sm);
  padding:var(--f3);margin-bottom:var(--f2);white-space:pre-wrap;color:var(--ink);box-shadow:var(--well)}
.miss span{display:block;font-family:var(--f-body);font-size:.72rem;color:var(--ink-soft);margin-top:var(--f1)}

/* ── トースト ── */
.notif{position:fixed;top:18px;left:50%;transform:translate(-50%,-220%);background:var(--accent);
  color:var(--on-accent);padding:var(--f3) var(--f4);border-radius:var(--r-pill);font-size:.82rem;
  font-weight:700;z-index:var(--z-toast);transition:transform var(--t-bar) var(--e-out);
  white-space:nowrap;box-shadow:var(--raise-lg)}
.notif.show{transform:translate(-50%,0)}
.notif.ok{background:var(--good);color:var(--on-accent)}
.notif.ng{background:var(--bad);color:var(--on-accent)}

/* ── その場実行パネル（辞書・出題で共用） ── */
.runner{margin-top:var(--f3);padding:var(--f3);background:var(--surface);border-radius:var(--r-md);
  box-shadow:var(--raise-sm)}
.rlab{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--pencil);margin:var(--f3) 0 var(--f2);display:flex;justify-content:space-between;
  align-items:flex-end;gap:var(--f2)}
.rlab:first-child{margin-top:0}
.rlab span{font-family:var(--f-hand);font-size:.74rem;letter-spacing:0;text-transform:none;color:var(--ink-soft)}
.rcode,.rin{width:100%;font-family:var(--f-mono);font-size:1rem;line-height:1.7;padding:var(--f3);
  border:none;border-radius:var(--r-sm);background:var(--sunken);color:var(--code-ink);
  resize:vertical;tab-size:4;caret-color:var(--accent);box-shadow:var(--well)}
.rcode{min-height:132px}
.rin{min-height:58px}
.rrow{display:flex;gap:var(--f2);margin-top:var(--f3)}
.rrow .rgo{flex:1;min-height:var(--h-ctl)}
.rrow .rreset{flex:0 0 auto;min-height:var(--h-ctl);padding:0 var(--f4);border-radius:var(--r-md);
  background:var(--surface);color:var(--ink);font-size:.88rem;font-weight:700;box-shadow:var(--raise)}
.rrow .rreset:active{box-shadow:var(--press);transform:translateY(1px)}
.rboot{display:flex;align-items:center;gap:var(--f2);font-family:var(--f-mono);font-size:.68rem;
  color:var(--ink-soft);margin-top:var(--f3)}
.rboot.fail{color:var(--bad)}
.rboot .d{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto;
  animation:blink 1.2s ease-in-out infinite}
.rboot .d.fail{background:var(--bad);animation:none}
.runner .term{margin-top:var(--f3)}
.runner .term-o.err{color:var(--term-err)}
.runner .term-o.idle{color:var(--pencil)}
/* 一致判定は色だけに頼らず字形も添える */
.rmatch{font-family:var(--f-mono);font-size:.74rem;margin-top:var(--f2);line-height:1.6}
.rmatch.ok{color:var(--good)}
.rmatch.ng{color:var(--bad)}
.rmatch.ok::before{content:"○ ";font-family:var(--f-hand);font-weight:700}
.rmatch.ng::before{content:"× ";font-family:var(--f-hand);font-weight:700}
/* 「動かす」ボタンは コピー と同じ寸法系 */
.drun{color:var(--accent)}
/* 出題側の「いじってみる」 */
.qplay{display:block;width:100%;min-height:var(--h-ctl);margin-top:var(--f3);border-radius:var(--r-md);
  background:var(--surface);color:var(--ink);font-weight:700;font-size:.88rem;box-shadow:var(--raise)}
.qplay:active{box-shadow:var(--press);transform:translateY(1px)}

/* 実行中は主ボタンが「中断」になる（無限ループでも必ず止められる） */
.btn.stop,.rgo.stop{background:var(--bad);color:var(--on-accent)}
.btn.stop:active,.rgo.stop:active{background:hsl(2,70%,55%)}
.rreset:disabled{opacity:.45;cursor:default;box-shadow:var(--press-sm)}

/* ── エラー辞書 ── */
.mode-e{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--bad);margin-bottom:var(--f1)}
.ehead{padding-top:var(--f3);padding-bottom:var(--f3)}
.etype{display:block;font-family:var(--f-mono);font-size:.82rem;font-weight:700;color:var(--bad)}
.emsg{display:block;font-family:var(--f-mono);font-size:.76rem;color:var(--ink-soft);
  margin-top:3px;line-height:1.5;word-break:break-word}
.ditem.open .ehead .etype{color:var(--bad)}
.ditem.open .ehead .emsg{color:var(--ink)}
/* 実際に出る1行。ターミナルの見え方に寄せる */
.eout{font-family:var(--f-mono);font-size:.78rem;color:var(--term-err);background:var(--sunken);
  border-radius:var(--r-sm);padding:var(--f3);margin-top:var(--f2);line-height:1.6;
  white-space:pre-wrap;word-break:break-word;box-shadow:var(--well)}
.eplay{display:block;width:100%;min-height:var(--h-ctl);margin-top:var(--f4);border-radius:var(--r-md);
  background:var(--surface);color:var(--ink);font-weight:700;font-size:.88rem;box-shadow:var(--raise)}
.eplay:active{box-shadow:var(--press);transform:translateY(1px)}
/* 壊れた形 / 直した形 の切替 */
.eswitch{display:flex;gap:var(--f2);margin-top:var(--f3)}
.eswbtn{flex:1;min-height:var(--h-sm);border-radius:var(--r-sm);background:var(--surface);
  color:var(--ink-soft);font-family:var(--f-mono);font-size:.74rem;font-weight:700;
  box-shadow:var(--raise-sm);transition:box-shadow var(--t-up) var(--e-out),color var(--t-state) var(--e-std)}
.eswbtn:active{box-shadow:var(--press-sm)}
/* 選択中は影だけに頼らず、色と下線でも示す */
.eswbtn.on{color:var(--accent);box-shadow:var(--press-sm);text-decoration:underline;text-underline-offset:4px}

/* ══ 見出しカード（辞書 / エラー辞書 共通） ══
   スロット: media(コードの断片) → header(eyebrow+title) → body → metadata → footer
   ・chin 対策: カードを flex column にし、footer を margin-top:auto で底へ貼る。
     グリッドが等高に伸ばしても footer の上に死んだ余白が生まれない。
   ・角丸のはみ出し対策: カードに overflow:hidden。media は自前の角丸を持たない。
   ・padding はスロット側に置く。media だけ padding を持たず縁まで到達させる。
   ・カード全体が1個の <button>。中身は <span>（<div> を入れると不正な HTML）。 */
/* 150px 下限＝360px幅(Androidに多い)でも2列になる。320px だけは読めなくなるので1列に落とす */
#d-list,#e-list,#a-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:var(--f3);align-items:stretch}
#d-list .dcat,#e-list .dcat,#a-list .dcat,.dnone{grid-column:1/-1}

.ditem{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--raise);margin-bottom:0}
.dhead{display:flex;flex-direction:column;flex:1 1 auto;width:100%;min-height:0;
  padding:0;text-align:left;background:none;border-radius:0;font-weight:400;color:var(--ink);
  transition:box-shadow var(--t-up) var(--e-out),transform var(--t-up) var(--e-out)}
.dhead::after,.ditem.open .dhead::after{content:none}   /* 旧 ＋/− の絶対配置を無効化（open 側は詳細度が高いので明示） */
.ditem:active{box-shadow:var(--press);transform:translateY(1px)}

/* media＝コードの断片。縁まで到達させたいので padding は内側の要素に持たせない */
.c-media{display:block;height:80px;overflow:hidden;background:var(--sunken);
  padding:var(--f3);box-shadow:var(--well)}
.c-code{display:block;font-family:var(--f-mono);font-size:.64rem;line-height:1.6;
  color:var(--code-ink);white-space:pre;overflow:hidden}

.c-head{display:block;padding:var(--f3) var(--f3) 0}
.c-eyebrow{display:block;font-family:var(--f-mono);font-size:.52rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--pencil);margin-bottom:4px}
.c-title{display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;font-size:.84rem;font-weight:700;color:var(--ink);line-height:1.45;
  overflow-wrap:anywhere}   /* ModuleNotFoundError のような長い識別子を折り返す */
.c-body{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;padding:var(--f2) var(--f3) 0;font-size:.7rem;line-height:1.6;color:var(--ink-soft)}
.c-meta{display:block;padding:var(--f2) var(--f3) 0;font-family:var(--f-mono);
  font-size:.56rem;letter-spacing:.08em;color:var(--pencil)}

/* footer＝ここが chin 対策の本体 */
.c-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;
  padding:var(--f3);font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;color:var(--accent)}
.c-act::before{content:'ひらく'}
.c-sign::before{content:'＋'}

/* 展開時は2列をまたいで全幅。カード面は見出しだけに畳む */
.ditem.open{grid-column:1/-1;box-shadow:var(--raise-lg)}
.ditem.open .c-media,.ditem.open .c-body,.ditem.open .c-meta{display:none}
.ditem.open .c-title{-webkit-line-clamp:unset;line-clamp:unset;color:var(--accent)}
.ditem.open .c-act::before{content:'とじる'}
.ditem.open .c-sign::before{content:'−'}
.ditem.open .dbody{display:block}
.dbody{display:none;padding:0 var(--f4) var(--f4)}

/* エラーカードは型名を主役にする */
.eitem .c-title{font-family:var(--f-mono);color:var(--bad);font-size:.82rem}
.eitem.open .c-title{color:var(--bad)}
.eitem .c-body{font-family:var(--f-mono);font-size:.66rem}

/* 画面が広い時はカードを大きく、文字も少し戻す */
@media(min-width:560px){
  #d-list,#e-list,#a-list{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--f4)}
  .c-title{font-size:.92rem}
  .c-body{font-size:.75rem}
  .c-media{height:92px}
}

/* ── 原子辞書 ── */
.mode-a{font-family:var(--f-mono);font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);margin-bottom:var(--f1)}
/* media は記号そのもの。黒い面に大きく置く */
.c-sym{display:flex;align-items:center;justify-content:center;background:var(--sunken)}
.c-symtext{font-family:var(--f-mono);font-size:1.7rem;font-weight:700;color:var(--accent);
  letter-spacing:.06em;line-height:1;white-space:nowrap;overflow:hidden;max-width:100%}
.c-symtext.long{font-size:.95rem;white-space:normal;text-align:center;line-height:1.35;padding:0 8px}
.aitem .c-title{font-size:.82rem}
/* 役割＝1行で言い切る。黒い面に置いて強調する */
.arole{font-size:.9rem;font-weight:700;color:var(--ink);line-height:1.6;
  background:var(--sunken);border-radius:var(--r-sm);padding:var(--f3);box-shadow:var(--well)}
.aitem.open .c-symtext{font-size:1.25rem}
@media(min-width:560px){.c-symtext{font-size:2rem}}

/* ── タブ（例の切り替え）ref: ant.design/components/tabs の line タイプ ── */
.tabs{margin-top:var(--f2)}
.tablist{position:relative;display:flex;gap:var(--f4);overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;border-bottom:2px solid var(--sunken)}
.tablist::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:var(--hit);padding:11px 0;background:none;
  font-size:.74rem;font-weight:700;color:var(--pencil);white-space:nowrap;
  max-width:12em;overflow:hidden;text-overflow:ellipsis;
  transition:color var(--t-state) var(--e-std)}
.tab.on{color:var(--accent)}
@media (hover:hover){.tab:hover{color:var(--ink-soft)}.tab.on:hover{color:var(--accent)}}
.tab:active{color:var(--ink)}
/* インクバー＝active の下を滑る。色だけでなく位置でも現在地を示す */
.ink{position:absolute;left:0;bottom:-2px;width:0;height:2px;background:var(--accent);
  border-radius:2px;pointer-events:none;
  transition:left var(--t-state) var(--e-std),width var(--t-state) var(--e-std)}
.tabpanel{padding-top:var(--f3)}
.tabpanel[hidden]{display:none}
.tabpanel .dvar{margin-bottom:0}
/* 展開直後にインクバーが飛ばないよう、初回は動かさない */
@media (prefers-reduced-motion:reduce){.ink{transition:none}}

/* ── クラス（分類）の絞り込みチップ ── */
.chips{display:flex;flex-wrap:wrap;gap:var(--f2);margin-bottom:var(--f4)}
.chipf{display:inline-flex;align-items:center;gap:6px;min-height:var(--h-sm);
  padding:0 var(--f3);border-radius:var(--r-pill);background:var(--surface);
  color:var(--ink-soft);font-size:.7rem;font-weight:700;box-shadow:var(--raise-sm);
  transition:box-shadow var(--t-up) var(--e-out),color var(--t-state) var(--e-std)}
.chipf .n{font-family:var(--f-mono);font-size:.58rem;color:var(--pencil)}
.chipf:active{box-shadow:var(--press-sm)}
/* 選択中は影だけに頼らず色でも示す */
.chipf.on{color:var(--accent);box-shadow:var(--press-sm)}
.chipf.on .n{color:var(--accent)}
</style>
</head>
<body>

<div class="notif" id="notif"></div>

<!-- ══════ HOME ══════ -->
<section class="screen active" id="scr-home">
  <div class="wrap">
    <h1 class="logo">Python<br><em>組み立て</em>ドリル</h1>
    <p class="logo-sub">tap to build · 46問</p>

    <div class="stat-card">
      <div class="stat"><div class="stat-n" id="h-xp">0</div><div class="stat-l">XP</div></div>
      <div class="stat"><div class="stat-n" id="h-streak">0</div><div class="stat-l">連続日数</div></div>
      <div class="stat"><div class="stat-n" id="h-acc">—</div><div class="stat-l">正答率</div></div>
    </div>

    <button class="mode wide" onclick="openDict()" style="margin-bottom:22px">
      <div class="mode-n">辞書を開く</div>
      <div class="mode-d">やりたいこと から形を引く · 30見出し / 79パターン</div>
    </button>

    <button class="mode" onclick="openAtom()" style="margin-bottom:11px">
    <div class="mode-a">atom</div>
    <div class="mode-n">原子辞書</div>
    <div class="mode-d">記号ひとつを引く · 24原子 / 78例。役割・できること・落とし穴</div>
  </button>

  <button class="mode" onclick="openErr()" style="margin-bottom:22px">
    <div class="mode-e">error</div>
    <div class="mode-n">エラー辞書</div>
    <div class="mode-d">出たエラー文から引く · 18件。原因・直し方・いじり場つき</div>
  </button>

  <div id="h-modes"></div>

    <button class="reset-link" onclick="resetAll()">記録をすべて消す</button>
  </div>
</section>

<!-- ══════ QUIZ ══════ -->
<section class="screen" id="scr-quiz">
  <div class="qbar">
    <button class="qclose" onclick="goHome()" aria-label="やめる">×</button>
    <div class="prog"><i id="q-prog" style="width:0%"></i></div>
    <div class="combo" id="q-combo"></div>
  </div>
  <div class="qbody" id="q-body"></div>
  <div class="qfoot">
    <button class="btn-sub" id="q-reset" onclick="clearTokens()">↺</button>
    <button class="btn btn-main" id="q-check" onclick="checkAnswer()" disabled>答え合わせ</button>
    <button class="btn btn-main" id="q-next" onclick="nextQ()" style="display:none">次へ</button>
  </div>
</section>

<!-- ══════ DICT ══════ -->
<section class="screen" id="scr-dict">
  <div class="wrap">
    <div class="dbar">
      <button class="qclose" onclick="goHome()" aria-label="閉じる">×</button>
      <input class="dsearch" id="d-search" type="search" placeholder="やりたいことで探す（例：3文字目、2行、循環）" oninput="renderDict(this.value)">
    </div>
    <div id="d-list"></div>
  </div>
</section>

<!-- ══════ ATOM DICT ══════ -->
<section class="screen" id="scr-atom">
  <div class="wrap">
    <div class="dbar">
      <button class="qclose" onclick="goHome()" aria-label="閉じる">×</button>
      <input class="dsearch" id="a-search" type="search" placeholder="記号で探す（例：% 、スライス、クォート）" oninput="renderAtom(this.value)">
    </div>
    <div class="chips" id="a-chips"></div>
    <div id="a-list"></div>
  </div>
</section>

<!-- ══════ ERROR DICT ══════ -->
<section class="screen" id="scr-err">
  <div class="wrap">
    <div class="dbar">
      <button class="qclose" onclick="goHome()" aria-label="閉じる">×</button>
      <input class="dsearch" id="e-search" type="search" placeholder="エラー文で探す（例：TypeError、not defined、range）" oninput="renderErr(this.value)">
    </div>
    <div id="e-list"></div>
  </div>
</section>

<!-- ══════ RESULT ══════ -->
<section class="screen" id="scr-result">
  <div class="wrap">
    <div id="r-head"></div>
    <div id="r-stats" style="margin:22px 0"></div>
    <div id="r-miss"></div>
    <button class="btn btn-main" style="width:100%;margin-top:22px" onclick="goHome()">ホームへ</button>
  </div>
</section>

<script>
/* ═══════════════════════════════════════════════════════════
   問題データ

   共通  id / cat / q（やりたいこと）/ exp（解説）
   組み立て型（既定）
     tokens : 正解のトークン列
     extra  : まぎれ込ませる余分なブロック
     alt    : 別解（任意、トークン列の配列）
     ctx    : 前提コード。'▁' を書いた位置に組み立てた行が入る
              （文字列なら「前提」バッジ表示のみ）
     out    : プログラム全体の実行結果 / null なら出力なし
   出力予測型（type:'predict'）
     code    : コード行の配列
     choices : 選択肢
     ans     : 正解の添字
   ═══════════════════════════════════════════════════════════ */
const SLOT='▁';

const QUESTIONS=[
/* ═══ 基礎：記号を覚える ═══ */
{id:'a1',cat:'算術演算子',tier:1,
 q:'7 を 2 で割った商を、小数を切り捨てて表示する',
 tokens:['print','(','7','//','2',')'],extra:['/','%'],out:'3',
 exp:'<code>//</code> は切り捨て除算。「何個とれるか」を出すときの定番。<code>/</code> だと <code>3.5</code> になる。'},

{id:'a2',cat:'算術演算子',tier:1,
 q:'7 を 2 で割った余りを表示する',
 tokens:['print','(','7','%','2',')'],extra:['//','**'],out:'1',
 exp:'<code>%</code> は剰余。偶数判定と循環という2大用途がこの後に出てくる。'},

{id:'a3',cat:'算術演算子',tier:1,
 q:"文字列 'ABC' を 2 回繰り返して表示する",
 tokens:['print','(',"'ABC'",'*','2',')'],extra:['+','**'],out:'ABCABC',
 exp:'<code>*</code> は文字列に使うと繰り返し。<code>&#39;-&#39; * 30</code> で区切り線が作れる。'},

{id:'a4',cat:'算術演算子',tier:1,
 q:'9 の平方根を表示する（import は使わない）',
 tokens:['print','(','9','**','0.5',')'],extra:['//','*'],out:'3.0',
 exp:'0.5 乗 = 平方根。結果は float なので <code>3</code> ではなく <code>3.0</code>。'},

{id:'b1',cat:'比較・論理',tier:1,
 q:'n が偶数のときに実行する if 文の1行目を作る',
 ctx:'n = 7',
 tokens:['if','n','%','2','==','0',':'],extra:['=','//'],out:null,
 exp:'代入は <code>=</code>、比較は <code>==</code>。行末の <code>:</code> も忘れやすい。'},

{id:'b2',cat:'比較・論理',tier:1,
 q:'x が 0 以上 10 未満のときの条件を、and を使わずに作る',
 ctx:'x = 5',
 tokens:['if','0','<=','x','<','10',':'],extra:['and','>='],out:null,

const TIERS=[
 {n:1,h:'基礎 — 記号を覚える',d:'教科書の表と同じ範囲。記号の意味と形を手に入れる。',
  cats:['算術演算子','比較・論理','代入','文と関数']},
 {n:2,h:'実戦 — やりたいこと から引く',d:'「循環させたい」「余りごと出したい」から形を思い出す練習。ここが引き出しになる。',
  cats:['繰り返し','数を扱う','判定の型','文字列','集計','落とし穴']}
];
const KW=['if','in','for','while','return','else','and','or','not','is','import','elif'];
const SK='pydrill_v2';

let ST=loadST(),QS=null;

function defaultST(){return{xp:0,streak:0,lastDate:'',totalA:0,totalC:0,stats:{}};}
function loadST(){try{const r=localStorage.getItem(SK);return r?Object.assign(defaultST(),JSON.parse(r)):defaultST();}catch(e){return defaultST();}}
function saveST(){try{localStorage.setItem(SK,JSON.stringify(ST));}catch(e){}}
function todayStr(){return new Date().toISOString().slice(0,10);}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
function goHome(){QS=null;renderHome();show('scr-home');}
function notify(m,t=''){const e=document.getElementById('notif');e.textContent=m;e.className='notif show '+t;setTimeout(()=>e.classList.remove('show'),1700);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── トークン列 → 表示用コード（判定は配列で行うので表示専用） ── */
function isName(t){return /^[A-Za-z_][\w.]*$/.test(t)&&!KW.includes(t)||/[)\]'"]$/.test(t);}
function joinCode(ts){
  let s='';
  ts.forEach((t,i)=>{
    if(i>0){
      const p=ts[i-1];
      const tight=[')',']',',',':'].includes(t)||(['(','['].includes(t)&&isName(p))||['(','['].includes(p);
      if(!tight)s+=' ';
    }
    s+=t;
  });
  return s;
}

/* ── ホーム ── */
function renderHome(){
  document.getElementById('h-xp').textContent=ST.xp;
  document.getElementById('h-streak').textContent=ST.streak;
  document.getElementById('h-acc').textContent=ST.totalA?Math.round(ST.totalC/ST.totalA*100)+'%':'—';
  const box=document.getElementById('h-modes');box.innerHTML='';

  const card=(name,desc,qs,wide)=>{
    if(!qs.length)return;
    const done=qs.filter(q=>ST.stats[q.id]&&ST.stats[q.id].c>0).length;
    const b=document.createElement('button');
    b.className='mode'+(wide?' wide':'');
    b.innerHTML=`<div class="mode-n">${name}</div><div class="mode-d">${desc} · ${qs.length}問</div>
      <div class="mode-bar"><i style="width:${Math.round(done/qs.length*100)}%"></i></div>`;
    b.onclick=()=>start(qs);
    box.appendChild(b);
  };

  TIERS.forEach(t=>{
    const h=document.createElement('div');
    h.innerHTML=`<h2 class="sec-h">${t.h}</h2><p class="sec-d">${t.d}</p>`;
    box.appendChild(h);
    t.cats.forEach(c=>card(c,'',QUESTIONS.filter(q=>q.cat===c)));
    card('この段をまとめて','シャッフル',QUESTIONS.filter(q=>q.tier===t.n),true);
    box.appendChild(Object.assign(document.createElement('div'),{className:'spacer'}));
  });

  const weak=QUESTIONS.filter(q=>{const s=ST.stats[q.id];return s&&s.a>s.c;});
  if(weak.length){
    const h=document.createElement('div');
    h.innerHTML='<h2 class="sec-h">取りこぼし</h2><p class="sec-d">一度でも間違えた問題だけを回収する。</p>';
    box.appendChild(h);
    card('間違えた問題',' ',weak,true);
  }
}

/* ── 出題 ── */
function start(qs){
  QS={list:shuffle(qs),i:0,correct:0,miss:[],order:[],used:[],answered:false,pool:[]};
  const t=todayStr();
  if(ST.lastDate!==t){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    ST.streak=(ST.lastDate===y)?ST.streak+1:1;
    ST.lastDate=t;saveST();
  }
  show('scr-quiz');renderQ();
}

function renderQ(){
  const q=QS.list[QS.i];
  QS.answered=false;QS.order=[];

  document.getElementById('q-prog').style.width=(QS.i/QS.list.length*100)+'%';
  document.getElementById('q-combo').textContent=QS.correct>1?'×'+QS.correct:'';
  document.getElementById('q-next').style.display='none';

  if(q.type==='predict'){
    document.getElementById('q-check').style.display='none';
    document.getElementById('q-reset').style.display='none';
    document.getElementById('q-body').innerHTML=`
      <div class="qcat">${q.cat}</div>
      <p class="qtask">${q.q}</p>
      <div class="code">${esc(q.code.join('\n'))}</div>
      <div class="choices" id="q-choices"></div>
      <div id="q-feedback"></div>`;
    const box=document.getElementById('q-choices');
    q.choices.forEach((c,i)=>{
      const b=document.createElement('button');
      b.className='choice';b.textContent=c;b.onclick=()=>checkPredict(i);
      box.appendChild(b);
    });
    return;
  }

  QS.pool=shuffle([...q.tokens.map(t=>({t})),...q.extra.map(t=>({t}))]);
  QS.used=new Array(QS.pool.length).fill(false);
  document.getElementById('q-check').style.display='';
  document.getElementById('q-reset').style.display='';
  document.getElementById('q-body').innerHTML=`
    <div class="qcat">${q.cat}</div>
    <p class="qtask">${q.q}</p>
    <div class="code" id="q-code"></div>
    <div class="target" id="q-target"></div>
    <div class="pool" id="q-pool"></div>
    <div class="status" id="q-status"></div>
    <div id="q-feedback"></div>`;
  const pool=document.getElementById('q-pool');
  QS.pool.forEach((p,i)=>{
    const c=document.createElement('button');
    c.className='chip';c.textContent=p.t;c.onclick=()=>place(i);
    pool.appendChild(c);
  });
  update();
}

/* ── 前提コード＋スロットの描画 ── */
function renderCode(q,built,final){
  const inner=built.length
    ? `<span class="slot">${esc(joinCode(built))}</span>`+(final?'':'<span class="caret"></span>')
    : `<span class="slot empty">▁▁▁</span><span class="caret"></span>`;
  if(Array.isArray(q.ctx)){
    return q.ctx.map(l=>l.includes(SLOT)?esc(l).replace(SLOT,inner):esc(l)).join('\n');
  }
  const head=(typeof q.ctx==='string'&&q.ctx)?esc(q.ctx)+'\n':'';
  return head+inner;
}

function place(i){if(QS.answered||QS.used[i])return;QS.used[i]=true;QS.order.push(i);update();}
function unplace(pos){if(QS.answered)return;QS.used[QS.order[pos]]=false;QS.order.splice(pos,1);update();}
function clearTokens(){if(QS.answered)return;QS.order=[];QS.used.fill(false);update();}

function update(){
  const q=QS.list[QS.i];
  document.querySelectorAll('#q-pool .chip').forEach((c,i)=>c.classList.toggle('used',QS.used[i]));
  const tgt=document.getElementById('q-target');tgt.innerHTML='';
  QS.order.forEach((pi,pos)=>{
    const c=document.createElement('button');
    c.className='chip placed';
    c.innerHTML=`<span class="pos">${pos+1}</span>${esc(QS.pool[pi].t)}`;
    c.onclick=()=>unplace(pos);
    tgt.appendChild(c);
  });
  document.getElementById('q-code').innerHTML=renderCode(q,QS.order.map(i=>QS.pool[i].t),false);
  document.getElementById('q-check').disabled=QS.order.length===0;
  document.getElementById('q-status').textContent=
    `${QS.order.length} ブロック配置中 ・ 使わないブロックが混ざっています`;
}

/* ── 採点 ── */
function score(q,ok){
  if(!ST.stats[q.id])ST.stats[q.id]={c:0,a:0};
  ST.stats[q.id].a++;ST.totalA++;
  if(ok){
    ST.stats[q.id].c++;ST.totalC++;QS.correct++;
    const xp=10+(QS.correct>=3?10:0);ST.xp+=xp;
    notify('正解 +'+xp+'XP','ok');
  }else{QS.miss.push(q);notify('おしい','ng');}
  saveST();
}
function feedback(q,ok,label){
  document.getElementById('q-feedback').innerHTML=`
    <div class="verdict ${ok?'ok':'ng'}">${ok?'正解':label}</div>
    ${q.out!==null&&q.out!==undefined
      ? `<div class="term"><div class="term-l">実行結果</div><div class="term-o">${esc(q.out)}</div></div>`
      : `<div class="term"><div class="term-l">この行だけでは出力なし（構文の問題）</div></div>`}
    <div class="exp">${q.exp}</div>
    <button type="button" class="qplay" onclick="toggleQuizRun(this)">いじってみる</button>`;
  const n=document.getElementById('q-next');
  n.style.display='';n.textContent=(QS.i+1>=QS.list.length)?'結果を見る':'次へ';
  n.focus();
}

function checkAnswer(){
  if(QS.answered)return;
  QS.answered=true;
  const q=QS.list[QS.i];
  const user=QS.order.map(i=>QS.pool[i].t);
  const ok=[q.tokens,...(q.alt||[])].some(c=>c.length===user.length&&c.every((t,i)=>t===user[i]));
  score(q,ok);

  document.getElementById('q-code').innerHTML=renderCode(q,q.tokens,true);
  const tgt=document.getElementById('q-target');tgt.innerHTML='';
  q.tokens.forEach((t,i)=>{
    const c=document.createElement('div');c.className='chip placed';
    c.innerHTML=`<span class="pos">${i+1}</span>${esc(t)}`;tgt.appendChild(c);
  });
  document.getElementById('q-status').textContent='';
  document.getElementById('q-check').style.display='none';
  document.getElementById('q-reset').style.display='none';
  feedback(q,ok,'不正解 — 上が正しい並び');
}

function checkPredict(sel){
  if(QS.answered)return;
  QS.answered=true;
  const q=QS.list[QS.i];
  const ok=sel===q.ans;
  score(q,ok);
  document.querySelectorAll('#q-choices .choice').forEach((b,i)=>{
    if(i===q.ans)b.classList.add('ok');
    else if(i===sel)b.classList.add('ng');
    else b.classList.add('dim');
    b.onclick=null;
  });
  feedback(q,ok,'不正解 — 緑が正しい出力');
}

function nextQ(){QS.i++;if(QS.i>=QS.list.length)showResult();else renderQ();}

function showResult(){
  const total=QS.list.length,c=QS.correct;
  document.getElementById('r-head').innerHTML=`
    <div class="res-n">${c}<span style="font-size:1.4rem;color:#9a9388">/${total}</span></div>
    <div class="res-l">${c===total?'全問正解。次は速度を上げる。':c/total>=.7?'土台はできている。落とした形を覚え直す。':'まだ引き出しになっていない。同じ範囲をもう一周。'}</div>`;
  document.getElementById('r-stats').innerHTML=`
    <div class="res-row"><span>累計 XP</span><b>${ST.xp}</b></div>
    <div class="res-row"><span>連続日数</span><b>${ST.streak}</b></div>
    <div class="res-row"><span>通算正答率</span><b>${Math.round(ST.totalC/ST.totalA*100)}%</b></div>`;
  document.getElementById('r-miss').innerHTML=QS.miss.length
    ? '<h2 class="sec-h">落とした形</h2>'+QS.miss.map(q=>
        `<div class="miss">${esc(q.type==='predict'?q.code.join('\n')+'  →  '+q.out:joinCode(q.tokens))}<span>${q.q}</span></div>`).join('')
    : '';
  show('scr-result');
}

function resetAll(){
  if(!confirm('XP・連続日数・正答記録をすべて消します。よろしいですか。'))return;
  ST=defaultST();saveST();renderHome();notify('記録を消しました');
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!QS)return;
  if(QS.answered)nextQ();
  else{const b=document.getElementById('q-check');if(b.style.display!=='none'&&!b.disabled)checkAnswer();}
});
