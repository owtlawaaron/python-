<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 組み立てドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1117;--paper:#f5f0e8;--cream:#ede7d9;
  --navy:#1a2744;--navy-light:#253460;
  --gold:#c8991a;--gold-light:#e8b830;--gold-dim:rgba(200,153,26,0.15);
  --red:#c0392b;--green:#1a7a4a;
  --term:#0d1420;--term-text:#5ce68a;
  --surface:#ffffff;--border:rgba(26,39,68,0.12);
  --shadow:0 2px 16px rgba(26,39,68,0.10);
  --radius:10px;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'Noto Sans JP',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none;}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

.screen{position:fixed;inset:0;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:10;overflow-y:auto;}
.screen.active{opacity:1;pointer-events:all;}
.wrap{max-width:620px;margin:0 auto;padding:28px 18px 48px;}

/* HOME */
.logo{font-family:var(--font-display);font-size:clamp(1.5rem,6vw,2.2rem);color:var(--navy);line-height:1.15;}
.logo em{color:var(--gold);font-style:normal;}
.logo-sub{font-family:var(--font-mono);font-size:.72rem;color:#7a7364;margin-top:6px;}
.stat-card{background:var(--navy);color:#fff;border-radius:var(--radius);padding:16px 18px;margin:22px 0 22px;display:flex;gap:18px;}
.stat{flex:1;}
.stat-n{font-family:var(--font-mono);font-size:1.45rem;font-weight:700;color:var(--gold-light);line-height:1;}
.stat-l{font-size:.68rem;color:rgba(255,255,255,.65);margin-top:5px;}
.sec-h{font-size:.82rem;font-weight:700;color:var(--navy);margin:0 0 4px;}
.sec-d{font-size:.72rem;color:#8a8378;margin-bottom:11px;line-height:1.5;}
.mode{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:9px;box-shadow:var(--shadow);transition:transform .12s ease;}
.mode:active{transform:scale(.985);}
.mode-n{font-weight:700;font-size:.95rem;color:var(--navy);}
.mode-d{font-size:.74rem;color:#77716a;margin-top:3px;}
.mode-bar{height:4px;background:var(--cream);border-radius:2px;margin-top:9px;overflow:hidden;}
.mode-bar i{display:block;height:100%;background:var(--gold);border-radius:2px;}
.mode.wide{background:var(--navy);}
.mode.wide .mode-n{color:#fff;}
.mode.wide .mode-d{color:rgba(255,255,255,.6);}
.mode.wide .mode-bar{background:rgba(255,255,255,.15);}
.reset-link{display:block;width:100%;text-align:center;font-size:.72rem;color:#9a9388;margin-top:26px;}
.spacer{height:26px;}

/* QUIZ */
#scr-quiz{display:flex;flex-direction:column;}
.qbar{display:flex;align-items:center;gap:12px;padding:14px 18px 0;max-width:620px;margin:0 auto;width:100%;}
.qclose{font-size:1.3rem;color:#9a9388;line-height:1;padding:4px 6px;}
.prog{flex:1;height:8px;background:var(--cream);border-radius:4px;overflow:hidden;}
.prog i{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .3s ease;}
.combo{font-family:var(--font-mono);font-size:.75rem;font-weight:700;color:var(--gold);min-width:34px;text-align:right;}
.qbody{flex:1;overflow-y:auto;max-width:620px;margin:0 auto;width:100%;padding:18px;}
.qcat{font-family:var(--font-mono);font-size:.68rem;color:var(--gold);margin-bottom:8px;}
.qtask{font-size:1.02rem;font-weight:500;line-height:1.55;margin-bottom:14px;}

.code{font-family:var(--font-mono);font-size:.92rem;background:var(--term);color:#cdd3dc;border-radius:8px;padding:14px 15px;white-space:pre;overflow-x:auto;line-height:1.75;}
.code .slot{background:rgba(200,153,26,.18);border-bottom:2px solid var(--gold);color:#fff;padding:1px 3px;border-radius:3px;}
.code .slot.empty{color:#4a5568;}
.code .caret{display:inline-block;width:7px;height:.95em;background:var(--term-text);vertical-align:-1px;animation:blink 1.1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

.target{border:2px dashed rgba(26,39,68,.28);border-radius:8px;padding:11px;min-height:62px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;margin:11px 0;}
.target:empty::before{content:'下のブロックをタップして組み立てる';font-family:var(--font-body);font-size:.76rem;color:#9a9388;align-self:center;margin:auto;}
.pool{display:flex;flex-wrap:wrap;gap:7px;padding:11px;background:var(--cream);border-radius:8px;min-height:56px;}
.chip{font-family:var(--font-mono);font-size:.94rem;font-weight:500;background:var(--surface);border:1px solid var(--border);border-bottom-width:3px;border-radius:7px;padding:9px 13px;color:var(--navy);transition:opacity .12s,transform .12s;}
.chip:active{transform:translateY(1px);border-bottom-width:2px;}
.chip.used{opacity:.22;pointer-events:none;}
.chip.placed{background:var(--navy);color:#fff;border-color:var(--navy);}
.chip .pos{font-size:.6rem;color:var(--gold-light);margin-right:5px;}
.status{font-size:.74rem;color:#8a8378;text-align:center;margin:11px 0;}

.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.choice{font-family:var(--font-mono);font-size:.95rem;text-align:left;background:var(--surface);border:1px solid var(--border);border-bottom-width:3px;border-radius:8px;padding:14px 16px;color:var(--navy);white-space:pre-wrap;}
.choice:active{transform:translateY(1px);}
.choice.ok{background:var(--green);color:#fff;border-color:var(--green);}
.choice.ng{background:var(--red);color:#fff;border-color:var(--red);}
.choice.dim{opacity:.4;}

.term{background:var(--term);border-radius:8px;padding:13px 15px;margin-top:12px;font-family:var(--font-mono);font-size:.9rem;}
.term-l{font-size:.64rem;color:#5a6578;margin-bottom:6px;}
.term-o{color:var(--term-text);white-space:pre-wrap;word-break:break-all;}
.verdict{font-weight:700;font-size:.95rem;margin-top:14px;}
.verdict.ok{color:var(--green);}
.verdict.ng{color:var(--red);}
.exp{background:var(--surface);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:12px 14px;margin-top:10px;font-size:.83rem;line-height:1.75;}
.exp code{font-family:var(--font-mono);background:var(--cream);padding:1px 4px;border-radius:3px;font-size:.9em;}
.exp b{color:var(--navy);}
.qfoot{padding:12px 18px 20px;max-width:620px;margin:0 auto;width:100%;display:flex;gap:9px;}
.btn{flex:1;padding:15px;border-radius:var(--radius);font-weight:700;font-size:.94rem;}
.btn-main{background:var(--navy);color:#fff;}
.btn-main:disabled{background:#c9c4bb;color:#fff;cursor:default;}
.btn-sub{background:transparent;color:#8a8378;border:1px solid var(--border);flex:0 0 auto;padding:15px 18px;}

/* DICT */
.dbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.dbar .qclose{padding:4px 2px;}
.dsearch{flex:1;font-family:var(--font-body);font-size:.9rem;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--ink);}
.dsearch:focus{outline:2px solid var(--gold);outline-offset:0;}
.dcat{font-family:var(--font-mono);font-size:.68rem;color:var(--gold);margin:22px 0 8px;}
.dcat:first-of-type{margin-top:6px;}
.ditem{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden;}
.dhead{display:block;width:100%;text-align:left;padding:14px 16px;font-size:.92rem;font-weight:500;color:var(--navy);line-height:1.5;position:relative;padding-right:38px;}
.dhead::after{content:'＋';position:absolute;right:15px;top:14px;color:var(--gold);font-size:.9rem;}
.ditem.open .dhead::after{content:'−';}
.ditem.open .dhead{font-weight:700;border-bottom:1px solid var(--border);}
.dbody{padding:14px 16px 16px;display:none;}
.ditem.open .dbody{display:block;}
.dvar{margin-bottom:14px;}
.dvl{font-size:.74rem;color:#8a8378;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.dcopy{font-family:var(--font-mono);font-size:.66rem;color:var(--navy);border:1px solid var(--border);border-radius:5px;padding:3px 8px;flex:0 0 auto;}
.dio{font-family:var(--font-mono);font-size:.78rem;margin-top:6px;line-height:1.6;}
.dio i{color:#8a8378;font-style:normal;}
.dio .in{color:var(--navy);}
.dio .out{color:var(--green);font-weight:700;}
.duse{font-size:.8rem;line-height:1.7;background:var(--cream);border-radius:7px;padding:10px 12px;margin-top:4px;}
.dtrap{font-size:.8rem;line-height:1.7;border-left:3px solid var(--red);background:rgba(192,57,43,.05);border-radius:0 7px 7px 0;padding:10px 12px;margin-top:8px;}
.duse code,.dtrap code{font-family:var(--font-mono);background:rgba(26,39,68,.08);padding:1px 4px;border-radius:3px;font-size:.9em;}
.dtrap b,.duse b{color:var(--navy);}
.dlab{font-family:var(--font-mono);font-size:.62rem;color:#9a9388;margin-bottom:4px;}
.dnone{font-size:.82rem;color:#8a8378;text-align:center;padding:28px 0;}

/* RESULT */
.res-n{font-family:var(--font-display);font-size:3.4rem;color:var(--navy);line-height:1;}
.res-l{font-size:.8rem;color:#77716a;margin-top:4px;line-height:1.6;}
.res-row{display:flex;justify-content:space-between;font-size:.84rem;padding:11px 0;border-bottom:1px solid var(--border);}
.res-row b{font-family:var(--font-mono);color:var(--navy);}
.miss{font-family:var(--font-mono);font-size:.8rem;background:var(--surface);border-radius:7px;padding:10px 12px;margin-bottom:7px;border:1px solid var(--border);white-space:pre-wrap;}
.miss span{display:block;font-family:var(--font-body);font-size:.72rem;color:#8a8378;margin-top:4px;}

.notif{position:fixed;top:18px;left:50%;transform:translate(-50%,-140%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:22px;font-size:.82rem;font-weight:700;z-index:99;transition:transform .3s cubic-bezier(.2,1.3,.4,1);white-space:nowrap;}
.notif.show{transform:translate(-50%,0);}
.notif.ok{background:var(--green);}
.notif.ng{background:var(--red);}
</style>
</head>
<body>

<div class="notif" id="notif"></div>

<!-- ══════ HOME ══════ -->
<section class="screen active" id="scr-home">
  <div class="wrap">
    <h1 class="logo">Python<br><em>組み立て</em>ドリル</h1>
    <p class="logo-sub">tap to build · 46問</p>

    <div class="stat-card">
      <div class="stat"><div class="stat-n" id="h-xp">0</div><div class="stat-l">XP</div></div>
      <div class="stat"><div class="stat-n" id="h-streak">0</div><div class="stat-l">連続日数</div></div>
      <div class="stat"><div class="stat-n" id="h-acc">—</div><div class="stat-l">正答率</div></div>
    </div>

    <button class="mode wide" onclick="openDict()" style="margin-bottom:22px">
      <div class="mode-n">辞書を開く</div>
      <div class="mode-d">やりたいこと から形を引く · 30見出し / 79パターン</div>
    </button>

    <div id="h-modes"></div>

    <button class="reset-link" onclick="resetAll()">記録をすべて消す</button>
  </div>
</section>

<!-- ══════ QUIZ ══════ -->
<section class="screen" id="scr-quiz">
  <div class="qbar">
    <button class="qclose" onclick="goHome()" aria-label="やめる">×</button>
    <div class="prog"><i id="q-prog" style="width:0%"></i></div>
    <div class="combo" id="q-combo"></div>
  </div>
  <div class="qbody" id="q-body"></div>
  <div class="qfoot">
    <button class="btn-sub" id="q-reset" onclick="clearTokens()">↺</button>
    <button class="btn btn-main" id="q-check" onclick="checkAnswer()" disabled>答え合わせ</button>
    <button class="btn btn-main" id="q-next" onclick="nextQ()" style="display:none">次へ</button>
  </div>
</section>

<!-- ══════ DICT ══════ -->
<section class="screen" id="scr-dict">
  <div class="wrap">
    <div class="dbar">
      <button class="qclose" onclick="goHome()" aria-label="閉じる">×</button>
      <input class="dsearch" id="d-search" type="search" placeholder="やりたいことで探す（例：3文字目、2行、循環）" oninput="renderDict(this.value)">
    </div>
    <div id="d-list"></div>
  </div>
</section>

<!-- ══════ RESULT ══════ -->
<section class="screen" id="scr-result">
  <div class="wrap">
    <div id="r-head"></div>
    <div id="r-stats" style="margin:22px 0"></div>
    <div id="r-miss"></div>
    <button class="btn btn-main" style="width:100%;margin-top:22px" onclick="goHome()">ホームへ</button>
  </div>
</section>

<script>
/* ═══════════════════════════════════════════════════════════
   問題データ

   共通  id / cat / q（やりたいこと）/ exp（解説）
   組み立て型（既定）
     tokens : 正解のトークン列
     extra  : まぎれ込ませる余分なブロック
     alt    : 別解（任意、トークン列の配列）
     ctx    : 前提コード。'▁' を書いた位置に組み立てた行が入る
              （文字列なら「前提」バッジ表示のみ）
     out    : プログラム全体の実行結果 / null なら出力なし
   出力予測型（type:'predict'）
     code    : コード行の配列
     choices : 選択肢
     ans     : 正解の添字
   ═══════════════════════════════════════════════════════════ */
const SLOT='▁';

const QUESTIONS=[
/* ═══ 基礎：記号を覚える ═══ */
{id:'a1',cat:'算術演算子',tier:1,
 q:'7 を 2 で割った商を、小数を切り捨てて表示する',
 tokens:['print','(','7','//','2',')'],extra:['/','%'],out:'3',
 exp:'<code>//</code> は切り捨て除算。「何個とれるか」を出すときの定番。<code>/</code> だと <code>3.5</code> になる。'},

{id:'a2',cat:'算術演算子',tier:1,
 q:'7 を 2 で割った余りを表示する',
 tokens:['print','(','7','%','2',')'],extra:['//','**'],out:'1',
 exp:'<code>%</code> は剰余。偶数判定と循環という2大用途がこの後に出てくる。'},

{id:'a3',cat:'算術演算子',tier:1,
 q:"文字列 'ABC' を 2 回繰り返して表示する",
 tokens:['print','(',"'ABC'",'*','2',')'],extra:['+','**'],out:'ABCABC',
 exp:'<code>*</code> は文字列に使うと繰り返し。<code>&#39;-&#39; * 30</code> で区切り線が作れる。'},

{id:'a4',cat:'算術演算子',tier:1,
 q:'9 の平方根を表示する（import は使わない）',
 tokens:['print','(','9','**','0.5',')'],extra:['//','*'],out:'3.0',
 exp:'0.5 乗 = 平方根。結果は float なので <code>3</code> ではなく <code>3.0</code>。'},

{id:'b1',cat:'比較・論理',tier:1,
 q:'n が偶数のときに実行する if 文の1行目を作る',
 ctx:'n = 7',
 tokens:['if','n','%','2','==','0',':'],extra:['=','//'],out:null,
 exp:'代入は <code>=</code>、比較は <code>==</code>。行末の <code>:</code> も忘れやすい。'},

{id:'b2',cat:'比較・論理',tier:1,
 q:'x が 0 以上 10 未満のときの条件を、and を使わずに作る',
 ctx:'x = 5',
 tokens:['if','0','<=','x','<','10',':'],extra:['and','>='],out:null,
 exp:'Python は比較を連鎖できる。<code>x >= 0 and x < 10</code> と同じ意味で、こちらが読みやすい。'},

{id:'b3',cat:'比較・論理',tier:1,
 q:"s が空文字のときだけ '匿名' を name に入れる（if を使わない）",
 ctx:["s = ''",SLOT,'print(name)'],
 tokens:['name','=','s','or',"'匿名'"],extra:['==','if'],out:'匿名',
 exp:'<code>or</code> は True/False ではなく<b>値そのもの</b>を返す。左が偽なら右を返すので既定値に使える。'},

{id:'b4',cat:'比較・論理',tier:1,
 q:"文字列 word に 'a' が含まれるかを調べる条件",
 ctx:"word = 'cat'",
 tokens:['if',"'a'",'in','word',':'],extra:['==','has'],out:null,
 exp:'<code>in</code> は文字列・リスト・辞書すべてに使える。探すための for 文が不要になる。'},

{id:'b5',cat:'比較・論理',tier:1,
 q:'辞書 d に key が登録されていないときの条件',
 ctx:"d = {'a': 1}",
 tokens:['if','key','not','in','d',':'],extra:['!=','is'],out:null,
 exp:'<code>not in</code> は2語でひとつの演算子。<code>not (key in d)</code> と書く必要はない。'},

{id:'b6',cat:'比較・論理',tier:1,
 q:'x が None かどうかを調べる条件',
 tokens:['if','x','is','None',':'],extra:['==','!='],out:null,
 exp:'None の比較は <code>==</code> ではなく <code>is</code>。動くが規約違反で、レビューで必ず指摘される。'},

{id:'c1',cat:'代入',tier:1,
 q:'カウンタ count を 1 増やす',
 ctx:['count = 0',SLOT,'print(count)'],
 tokens:['count','+=','1'],extra:['++','='],out:'1',
 exp:'<code>count = count + 1</code> の省略形。Python に <code>++</code> は<b>存在しない</b>。'},

{id:'c2',cat:'代入',tier:1,
 q:'リスト lst の末尾に 5 を追加する（+= を使う）',
 ctx:['lst = [1, 2]',SLOT,'print(lst)'],
 tokens:['lst','+=','[','5',']'],extra:['(',')'],out:'[1, 2, 5]',
 exp:'<code>+=</code> はリストにも効く（<code>append</code> 相当）。右側はリストにする必要がある。'},

{id:'c3',cat:'代入',tier:1,
 q:"ok が False なら 'NG'、True なら 'OK' を msg に入れる（1行で）",
 ctx:['ok = False',SLOT,'print(msg)'],
 tokens:['msg','=',"'OK'",'if','ok','else',"'NG'"],extra:[':','then'],out:'NG',
 exp:'三項演算子。<b>値 → 条件 → else 値</b> の順で、英語の語順そのまま。'},

{id:'d1',cat:'文と関数',tier:1,
 q:'0, 1, 2 を順に取り出すループの1行目',
 tokens:['for','i','in','range','(','3',')',':'],extra:['while','to'],out:null,
 exp:'<code>range(3)</code> は 0,1,2 の3個。3 は<b>含まれない</b>。'},

{id:'d2',cat:'文と関数',tier:1,
 q:'n が 0 より大きい間くり返すループの1行目',
 ctx:'n = 3',
 tokens:['while','n','>','0',':'],extra:['for','if'],out:null,
 exp:'回数が決まっていないときは while。中で n を減らさないと無限ループになる。'},

{id:'d3',cat:'文と関数',tier:1,
 q:'n が 80 のとき 80点 と表示する（f文字列を使う）',
 ctx:['n = 80',SLOT],
 tokens:['print','(',"f'{n}点'",')'],extra:["'{n}点'",'+'],out:'80点',
 exp:'先頭の <code>f</code> があると <code>{ }</code> の中身が値に置き換わる。f を忘れると <code>{n}点</code> がそのまま出る。'},

{id:'d4',cat:'文と関数',tier:1,
 q:"'abc' の文字数を表示する",
 tokens:['print','(','len','(',"'abc'",')',')'],extra:['count','size'],out:'3',
 exp:'<code>len()</code> は文字列・リスト・辞書の長さ。閉じ括弧が2つ並ぶ形に慣れる。'},

{id:'d5',cat:'文と関数',tier:1,
 q:'引数 x を 2 倍にして返す行（関数の中身）',
 ctx:['def double(x):','    '+SLOT,'print(double(4))'],
 tokens:['return','x','*','2'],extra:['print','='],out:'8',
 exp:'<code>return</code> は値を返す。<code>print</code> は画面に出すだけなので、混同すると戻り値が None になる。'},

/* ═══ 実戦：やりたいこと → 形 ═══ */
/* ── 繰り返し ── */
{id:'n1',cat:'繰り返し',tier:2,
 q:'データの個数だけ繰り返す（中身は使わない）',

const TIERS=[
 {n:1,h:'基礎 — 記号を覚える',d:'教科書の表と同じ範囲。記号の意味と形を手に入れる。',
  cats:['算術演算子','比較・論理','代入','文と関数']},
 {n:2,h:'実戦 — やりたいこと から引く',d:'「循環させたい」「余りごと出したい」から形を思い出す練習。ここが引き出しになる。',
  cats:['繰り返し','数を扱う','判定の型','文字列','集計','落とし穴']}
];
const KW=['if','in','for','while','return','else','and','or','not','is','import','elif'];
const SK='pydrill_v2';

let ST=loadST(),QS=null;

function defaultST(){return{xp:0,streak:0,lastDate:'',totalA:0,totalC:0,stats:{}};}
function loadST(){try{const r=localStorage.getItem(SK);return r?Object.assign(defaultST(),JSON.parse(r)):defaultST();}catch(e){return defaultST();}}
function saveST(){try{localStorage.setItem(SK,JSON.stringify(ST));}catch(e){}}
function todayStr(){return new Date().toISOString().slice(0,10);}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
function goHome(){QS=null;renderHome();show('scr-home');}
function notify(m,t=''){const e=document.getElementById('notif');e.textContent=m;e.className='notif show '+t;setTimeout(()=>e.classList.remove('show'),1700);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── トークン列 → 表示用コード（判定は配列で行うので表示専用） ── */
function isName(t){return /^[A-Za-z_][\w.]*$/.test(t)&&!KW.includes(t)||/[)\]'"]$/.test(t);}
function joinCode(ts){
  let s='';
  ts.forEach((t,i)=>{
    if(i>0){
      const p=ts[i-1];
      const tight=[')',']',',',':'].includes(t)||(['(','['].includes(t)&&isName(p))||['(','['].includes(p);
      if(!tight)s+=' ';
    }
    s+=t;
  });
  return s;
}

/* ── ホーム ── */
function renderHome(){
  document.getElementById('h-xp').textContent=ST.xp;
  document.getElementById('h-streak').textContent=ST.streak;
  document.getElementById('h-acc').textContent=ST.totalA?Math.round(ST.totalC/ST.totalA*100)+'%':'—';
  const box=document.getElementById('h-modes');box.innerHTML='';

  const card=(name,desc,qs,wide)=>{
    if(!qs.length)return;
    const done=qs.filter(q=>ST.stats[q.id]&&ST.stats[q.id].c>0).length;
    const b=document.createElement('button');
    b.className='mode'+(wide?' wide':'');
    b.innerHTML=`<div class="mode-n">${name}</div><div class="mode-d">${desc} · ${qs.length}問</div>
      <div class="mode-bar"><i style="width:${Math.round(done/qs.length*100)}%"></i></div>`;
    b.onclick=()=>start(qs);
    box.appendChild(b);
  };

  TIERS.forEach(t=>{
    const h=document.createElement('div');
    h.innerHTML=`<h2 class="sec-h">${t.h}</h2><p class="sec-d">${t.d}</p>`;
    box.appendChild(h);
    t.cats.forEach(c=>card(c,'',QUESTIONS.filter(q=>q.cat===c)));
    card('この段をまとめて','シャッフル',QUESTIONS.filter(q=>q.tier===t.n),true);
    box.appendChild(Object.assign(document.createElement('div'),{className:'spacer'}));
  });

  const weak=QUESTIONS.filter(q=>{const s=ST.stats[q.id];return s&&s.a>s.c;});
  if(weak.length){
    const h=document.createElement('div');
    h.innerHTML='<h2 class="sec-h">取りこぼし</h2><p class="sec-d">一度でも間違えた問題だけを回収する。</p>';
    box.appendChild(h);
    card('間違えた問題',' ',weak,true);
  }
}

/* ── 出題 ── */
function start(qs){
  QS={list:shuffle(qs),i:0,correct:0,miss:[],order:[],used:[],answered:false,pool:[]};
  const t=todayStr();
  if(ST.lastDate!==t){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    ST.streak=(ST.lastDate===y)?ST.streak+1:1;
    ST.lastDate=t;saveST();
  }
  show('scr-quiz');renderQ();
}

function renderQ(){
  const q=QS.list[QS.i];
  QS.answered=false;QS.order=[];

  document.getElementById('q-prog').style.width=(QS.i/QS.list.length*100)+'%';
  document.getElementById('q-combo').textContent=QS.correct>1?'×'+QS.correct:'';
  document.getElementById('q-next').style.display='none';

  if(q.type==='predict'){
    document.getElementById('q-check').style.display='none';
    document.getElementById('q-reset').style.display='none';
    document.getElementById('q-body').innerHTML=`
      <div class="qcat">${q.cat}</div>
      <p class="qtask">${q.q}</p>
      <div class="code">${esc(q.code.join('\n'))}</div>
      <div class="choices" id="q-choices"></div>
      <div id="q-feedback"></div>`;
    const box=document.getElementById('q-choices');
    q.choices.forEach((c,i)=>{
      const b=document.createElement('button');
      b.className='choice';b.textContent=c;b.onclick=()=>checkPredict(i);
      box.appendChild(b);
    });
    return;
  }

  QS.pool=shuffle([...q.tokens.map(t=>({t})),...q.extra.map(t=>({t}))]);
  QS.used=new Array(QS.pool.length).fill(false);
  document.getElementById('q-check').style.display='';
  document.getElementById('q-reset').style.display='';
  document.getElementById('q-body').innerHTML=`
    <div class="qcat">${q.cat}</div>
    <p class="qtask">${q.q}</p>
    <div class="code" id="q-code"></div>
    <div class="target" id="q-target"></div>
    <div class="pool" id="q-pool"></div>
    <div class="status" id="q-status"></div>
    <div id="q-feedback"></div>`;
  const pool=document.getElementById('q-pool');
  QS.pool.forEach((p,i)=>{
    const c=document.createElement('button');
    c.className='chip';c.textContent=p.t;c.onclick=()=>place(i);
    pool.appendChild(c);
  });
  update();
}

/* ── 前提コード＋スロットの描画 ── */
function renderCode(q,built,final){
  const inner=built.length
    ? `<span class="slot">${esc(joinCode(built))}</span>`+(final?'':'<span class="caret"></span>')
    : `<span class="slot empty">▁▁▁</span><span class="caret"></span>`;
  if(Array.isArray(q.ctx)){
    return q.ctx.map(l=>l.includes(SLOT)?esc(l).replace(SLOT,inner):esc(l)).join('\n');
  }
  const head=(typeof q.ctx==='string'&&q.ctx)?esc(q.ctx)+'\n':'';
  return head+inner;
}

function place(i){if(QS.answered||QS.used[i])return;QS.used[i]=true;QS.order.push(i);update();}
function unplace(pos){if(QS.answered)return;QS.used[QS.order[pos]]=false;QS.order.splice(pos,1);update();}
function clearTokens(){if(QS.answered)return;QS.order=[];QS.used.fill(false);update();}

function update(){
  const q=QS.list[QS.i];
  document.querySelectorAll('#q-pool .chip').forEach((c,i)=>c.classList.toggle('used',QS.used[i]));
  const tgt=document.getElementById('q-target');tgt.innerHTML='';
  QS.order.forEach((pi,pos)=>{
    const c=document.createElement('button');
    c.className='chip placed';
    c.innerHTML=`<span class="pos">${pos+1}</span>${esc(QS.pool[pi].t)}`;
    c.onclick=()=>unplace(pos);
    tgt.appendChild(c);
  });
  document.getElementById('q-code').innerHTML=renderCode(q,QS.order.map(i=>QS.pool[i].t),false);
  document.getElementById('q-check').disabled=QS.order.length===0;
  document.getElementById('q-status').textContent=
    `${QS.order.length} ブロック配置中 ・ 使わないブロックが混ざっています`;
}

/* ── 採点 ── */
function score(q,ok){
  if(!ST.stats[q.id])ST.stats[q.id]={c:0,a:0};
  ST.stats[q.id].a++;ST.totalA++;
  if(ok){
    ST.stats[q.id].c++;ST.totalC++;QS.correct++;
    const xp=10+(QS.correct>=3?10:0);ST.xp+=xp;
    notify('正解 +'+xp+'XP','ok');
  }else{QS.miss.push(q);notify('おしい','ng');}
  saveST();
}
function feedback(q,ok,label){
  document.getElementById('q-feedback').innerHTML=`
    <div class="verdict ${ok?'ok':'ng'}">${ok?'正解':label}</div>
    ${q.out!==null&&q.out!==undefined
      ? `<div class="term"><div class="term-l">実行結果</div><div class="term-o">${esc(q.out)}</div></div>`
      : `<div class="term"><div class="term-l">この行だけでは出力なし（構文の問題）</div></div>`}
    <div class="exp">${q.exp}</div>`;
  const n=document.getElementById('q-next');
  n.style.display='';n.textContent=(QS.i+1>=QS.list.length)?'結果を見る':'次へ';
  n.focus();
}

function checkAnswer(){
  if(QS.answered)return;
  QS.answered=true;
  const q=QS.list[QS.i];
  const user=QS.order.map(i=>QS.pool[i].t);
  const ok=[q.tokens,...(q.alt||[])].some(c=>c.length===user.length&&c.every((t,i)=>t===user[i]));
  score(q,ok);

  document.getElementById('q-code').innerHTML=renderCode(q,q.tokens,true);
  const tgt=document.getElementById('q-target');tgt.innerHTML='';
  q.tokens.forEach((t,i)=>{
    const c=document.createElement('div');c.className='chip placed';
    c.innerHTML=`<span class="pos">${i+1}</span>${esc(t)}`;tgt.appendChild(c);
  });
  document.getElementById('q-status').textContent='';
  document.getElementById('q-check').style.display='none';
  document.getElementById('q-reset').style.display='none';
  feedback(q,ok,'不正解 — 上が正しい並び');
}

function checkPredict(sel){
  if(QS.answered)return;
  QS.answered=true;
  const q=QS.list[QS.i];
  const ok=sel===q.ans;
  score(q,ok);
  document.querySelectorAll('#q-choices .choice').forEach((b,i)=>{
    if(i===q.ans)b.classList.add('ok');
    else if(i===sel)b.classList.add('ng');
    else b.classList.add('dim');
    b.onclick=null;
  });
  feedback(q,ok,'不正解 — 緑が正しい出力');
}

function nextQ(){QS.i++;if(QS.i>=QS.list.length)showResult();else renderQ();}

function showResult(){
  const total=QS.list.length,c=QS.correct;
  document.getElementById('r-head').innerHTML=`
    <div class="res-n">${c}<span style="font-size:1.4rem;color:#9a9388">/${total}</span></div>
    <div class="res-l">${c===total?'全問正解。次は速度を上げる。':c/total>=.7?'土台はできている。落とした形を覚え直す。':'まだ引き出しになっていない。同じ範囲をもう一周。'}</div>`;
  document.getElementById('r-stats').innerHTML=`
    <div class="res-row"><span>累計 XP</span><b>${ST.xp}</b></div>
    <div class="res-row"><span>連続日数</span><b>${ST.streak}</b></div>
    <div class="res-row"><span>通算正答率</span><b>${Math.round(ST.totalC/ST.totalA*100)}%</b></div>`;
  document.getElementById('r-miss').innerHTML=QS.miss.length
    ? '<h2 class="sec-h">落とした形</h2>'+QS.miss.map(q=>
        `<div class="miss">${esc(q.type==='predict'?q.code.join('\n')+'  →  '+q.out:joinCode(q.tokens))}<span>${q.q}</span></div>`).join('')
    : '';
  show('scr-result');
}

function resetAll(){
  if(!confirm('XP・連続日数・正答記録をすべて消します。よろしいですか。'))return;
  ST=defaultST();saveST();renderHome();notify('記録を消しました');
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!QS)return;
  if(QS.answered)nextQ();
  else{const b=document.getElementById('q-check');if(b.style.display!=='none'&&!b.disabled)checkAnswer();}
});

function openDict(){renderDict(document.getElementById('d-search').value);show('scr-dict');}

function renderDict(filter){
  const f=(filter||'').trim().toLowerCase();
  const box=document.getElementById('d-list');box.innerHTML='';
  let hits=0;
  DICT.forEach(cat=>{
    const items=cat.items.filter(it=>{
      if(!f)return true;
      const hay=(it.head+' '+it.use+' '+it.trap+' '+cat.cat+' '+it.v.map(v=>v.l+' '+v.c).join(' ')).toLowerCase();
      return hay.includes(f);
    });
    if(!items.length)return;
    hits+=items.length;
    const ch=document.createElement('div');
    ch.className='dcat';ch.textContent=cat.cat;box.appendChild(ch);
    items.forEach(it=>{
      const d=document.createElement('div');
      d.className='ditem';
      const b=document.createElement('button');
      b.className='dhead';b.textContent=it.head;
      b.onclick=()=>{
        d.classList.toggle('open');
        if(d.classList.contains('open')&&!d.dataset.built){buildDictBody(d,it);d.dataset.built='1';}
      };
      d.appendChild(b);
      const body=document.createElement('div');
      body.className='dbody';d.appendChild(body);
      box.appendChild(d);
      if(f&&items.length<=3){d.classList.add('open');buildDictBody(d,it);d.dataset.built='1';}
    });
  });
  if(!hits)box.innerHTML='<div class="dnone">見つかりません。別の言い方で探してみてください。</div>';
}

function buildDictBody(d,it){
  const body=d.querySelector('.dbody');
  body.innerHTML=it.v.map((v,i)=>`
    <div class="dvar">
      <div class="dvl"><span>${esc(v.l)}</span><button class="dcopy" onclick="copyCode('${it.id}',${i})">コピー</button></div>
      <div class="code">${esc(v.c)}</div>
      <div class="dio">
        ${v.i?`<div><i>入力</i> <span class="in">${esc(v.i).replace(/\n/g,' ⏎ ')}</span></div>`:''}
        <div><i>結果</i> <span class="out">${esc(v.o).replace(/\n/g,' ⏎ ')}</span></div>
      </div>
    </div>`).join('')
    +`<div class="dlab">どこで使うか</div><div class="duse">${it.use}</div>
      <div class="dtrap">${it.trap}</div>`;
}

function copyCode(id,i){
  let code=null;
  DICT.forEach(c=>c.items.forEach(it=>{if(it.id===id)code=it.v[i].c;}));
  if(!code)return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>notify('コピーしました','ok'),()=>notify('コピーできませんでした','ng'));
  }else notify('このブラウザではコピーできません','ng');
}

renderHome();
</script>
</body>
</html>
