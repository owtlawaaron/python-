<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="hsl(276,13%,15%)">
<title>ブロックで組む</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
/* ref: pydrill のダーク Soft UI（CLAUDE.md §配色の方針）
   設計: docs/BLOCKS.md — 構造と記法を分けて片方ずつ確定させる */
:root{
  --surface:hsl(276,13%,15%);--sunken:hsl(276,22%,7%);
  --ink:hsl(280,18%,93%);--ink-soft:hsl(280,10%,72%);--pencil:hsl(280,7%,56%);
  --accent:hsl(281,66%,62%);--accent-press:hsl(281,62%,53%);--accent-wash:hsla(281,66%,62%,.15);
  --good:hsl(150,50%,58%);--bad:hsl(2,78%,64%);
  --code-ink:hsl(280,12%,84%);--on-accent:hsl(276,20%,11%);--disabled-ink:hsl(280,7%,50%);
  --sh-l:hsl(276,11%,26%);--sh-d:hsl(276,26%,3%);
  --raise:-6px -6px 14px var(--sh-l), 6px 6px 14px var(--sh-d);
  --raise-sm:-3px -3px 7px var(--sh-l), 3px 3px 7px var(--sh-d);
  --press:inset -4px -4px 9px var(--sh-l), inset 4px 4px 9px var(--sh-d);
  --press-sm:inset -2px -2px 5px var(--sh-l), inset 2px 2px 5px var(--sh-d);
  --well:inset -5px -5px 11px var(--sh-l), inset 5px 5px 11px var(--sh-d);
  --f1:5px;--f2:8px;--f3:13px;--f4:21px;--f5:34px;--f6:55px;
  --r-lg:22px;--r-md:16px;--r-sm:13px;--r-pill:999px;
  --h-cta:56px;--h-ctl:48px;--h-sm:40px;--hit:44px;
  --t-down:30ms;--t-up:90ms;--t-state:140ms;
  --e-out:cubic-bezier(.22,1,.36,1);--e-std:cubic-bezier(.4,0,.2,1);
  --f-disp:'Anton','Noto Sans JP',sans-serif;--f-body:'Noto Sans JP',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',monospace;--f-hand:'Yomogi',cursive;
  --rail-w:104px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--f-body);background:var(--surface);color:var(--ink);line-height:1.6;overflow:hidden}
button,textarea,input{font-family:var(--f-body);color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--surface)}
.screen.on{display:flex}

/* ── 上のバー ── */
.top{flex:0 0 auto;display:flex;align-items:center;gap:var(--f2);padding:var(--f2) var(--f3);
  padding-top:max(var(--f2),env(safe-area-inset-top))}
.top .ttl{flex:1;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--pencil)}
.ic{position:relative;width:var(--h-sm);height:var(--h-sm);border-radius:var(--r-sm);
  background:var(--surface);box-shadow:var(--raise-sm);color:var(--ink-soft);font-size:1.05rem;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ic::before{content:"";position:absolute;inset:calc((var(--h-sm) - var(--hit))/2)}
.ic:active{box-shadow:var(--press-sm);color:var(--ink)}
.ic.on{color:var(--accent);box-shadow:var(--press-sm)}

/* ── 組み立て: レール(左) + 面(右) ── */
.work{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:var(--rail-w) 1fr;gap:var(--f2);
  padding:0 var(--f3)}
.work.righty{grid-template-columns:1fr var(--rail-w)}
.work.righty .rail{order:2}
.work.righty .canvas{order:1}
.work.slim{grid-template-columns:0 1fr}
.work.slim.righty{grid-template-columns:1fr 0}
.work.slim .rail{opacity:0;pointer-events:none}

.rail{min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--sunken);
  box-shadow:var(--well);border-radius:var(--r-md);padding:var(--f2) var(--f2) var(--f5);
  display:flex;flex-direction:column;gap:6px;scrollbar-width:none;transition:opacity var(--t-state)}
.rail::-webkit-scrollbar{display:none}
.rhead{font-family:var(--f-mono);font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pencil);margin:var(--f3) 0 2px;padding-left:3px}
.rhead:first-child{margin-top:2px}
.rb{min-height:var(--h-sm);padding:7px 6px;border-radius:10px;background:var(--surface);
  box-shadow:var(--raise-sm);color:var(--ink-soft);font-family:var(--f-mono);font-size:.68rem;
  line-height:1.3;text-align:center;word-break:break-all;
  transition:box-shadow var(--t-up) var(--e-out),color var(--t-state) var(--e-std)}
.rb:active{box-shadow:var(--press-sm);color:var(--accent)}
.rb.mine{color:var(--accent)}
.rb.st{font-family:var(--f-body);font-weight:700;font-size:.7rem}

/* ── 面 ── */
.canvas{min-height:0;overflow:auto;background:var(--sunken);box-shadow:var(--well);
  border-radius:var(--r-md);padding:var(--f3) var(--f2) var(--f5)}
.row{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.8rem;
  line-height:1.9;color:var(--code-ink);padding:2px 4px;border-radius:8px;white-space:nowrap}
.row.sel{background:var(--accent-wash)}
.band{width:3px;align-self:stretch;border-radius:2px;background:var(--accent);opacity:.5;flex:0 0 auto}
.band.d2{opacity:.32}.band.d3{opacity:.2}
.kw{color:var(--accent);font-weight:700}
.slot{display:inline-block;min-width:26px;padding:1px 6px;border-radius:7px;background:var(--surface);
  box-shadow:var(--press-sm);color:var(--ink);text-align:center}
.slot.empty{color:var(--pencil)}
.slot.act{background:var(--accent);color:var(--on-accent);box-shadow:none;font-weight:700}
.caret{height:3px;background:var(--accent);border-radius:2px;margin:3px 4px;
  animation:blink 1.15s step-end infinite}
@keyframes blink{50%{opacity:.25}}
.hint{font-family:var(--f-hand);font-size:.86rem;color:var(--pencil);padding:var(--f4) var(--f3);text-align:center}

/* ── 選択中の操作 ── */
.tools{flex:0 0 auto;display:flex;gap:6px;padding:var(--f2) var(--f3) 0}
.tools button{flex:1;min-height:var(--h-sm);border-radius:var(--r-sm);background:var(--surface);
  box-shadow:var(--raise-sm);color:var(--ink);font-size:.82rem;font-weight:700}
.tools button:active{box-shadow:var(--press-sm)}
.tools .del{color:var(--bad)}

/* ── 下のバー ── */
.bar{flex:0 0 auto;display:flex;gap:var(--f2);padding:var(--f3);
  padding-bottom:max(var(--f3),env(safe-area-inset-bottom));background:var(--surface);
  box-shadow:0 -7px 18px var(--sh-d)}
.btn{flex:1;min-height:var(--h-cta);border-radius:var(--r-md);font-weight:700;font-size:.95rem;
  background:var(--accent);color:var(--on-accent);box-shadow:var(--raise);
  transition:box-shadow var(--t-up) var(--e-out),transform var(--t-up) var(--e-out),
    background-color var(--t-state) var(--e-std)}
.btn:active{box-shadow:var(--press);transform:translateY(1px);background:var(--accent-press)}
.btn:disabled{background:var(--surface);color:var(--disabled-ink);box-shadow:var(--press-sm);transform:none}
.btn.stop{background:var(--bad)}
.btn2{flex:0 0 auto;min-height:var(--h-cta);padding:0 var(--f4);border-radius:var(--r-md);
  background:var(--surface);color:var(--ink);font-weight:700;font-size:.88rem;box-shadow:var(--raise)}
.btn2:active{box-shadow:var(--press);transform:translateY(1px)}
.btn2:disabled{color:var(--disabled-ink);box-shadow:var(--press-sm)}

/* ── 出力 ── */
.out{flex:0 0 auto;max-height:34vh;overflow-y:auto;margin:var(--f2) var(--f3) 0;padding:var(--f3);
  background:var(--sunken);box-shadow:var(--well);border-radius:var(--r-md)}
.out .lab{font-family:var(--f-mono);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pencil);margin-bottom:4px}
.out pre{font-family:var(--f-mono);font-size:.82rem;line-height:1.7;color:var(--good);
  white-space:pre-wrap;word-break:break-word;margin:0}
.out pre.err{color:var(--bad)}
.out pre.idle{color:var(--pencil)}

/* ── 写経 ── */
.ref{flex:0 0 auto;max-height:30vh;overflow:auto;margin:var(--f2) var(--f3) 0;padding:var(--f3);
  background:var(--sunken);box-shadow:var(--well);border-radius:var(--r-md)}
.ref .lab{font-family:var(--f-mono);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pencil);margin-bottom:var(--f2)}
#w-code{flex:1 1 auto;min-height:0;margin:var(--f2) var(--f3) 0;padding:var(--f3);border:none;
  border-radius:var(--r-md);background:var(--sunken);box-shadow:var(--well);color:var(--code-ink);
  font-family:var(--f-mono);font-size:1rem;line-height:1.7;resize:none;tab-size:4;caret-color:var(--accent)}
.verdict{flex:0 0 auto;margin:var(--f2) var(--f3) 0;font-family:var(--f-mono);font-size:.8rem}
.verdict.ok{color:var(--good)}
.verdict.ng{color:var(--bad)}
.verdict::before{font-family:var(--f-hand);font-weight:700;margin-right:6px}
.verdict.ok::before{content:"○"}
.verdict.ng::before{content:"×"}

.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-220%);background:var(--accent);
  color:var(--on-accent);padding:10px 18px;border-radius:var(--r-pill);font-size:.8rem;font-weight:700;
  z-index:60;transition:transform .3s var(--e-out);white-space:nowrap;box-shadow:var(--raise)}
.toast.show{transform:translate(-50%,0)}
.toast.ng{background:var(--bad)}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ══════ 組み立て ══════ -->
<section class="screen on" id="scr-build">
  <div class="top">
    <span class="ttl">組み立て</span>
    <button class="ic" id="hand" onclick="flipHand()" aria-label="レールの左右を入れ替える">⇄</button>
    <button class="ic" id="slim" onclick="toggleRail()" aria-label="レールを畳む">▤</button>
    <button class="ic" onclick="clearAll()" aria-label="全部消す">⌫</button>
  </div>
  <div class="tools" id="tools" hidden>
    <button onclick="moveSel(-1)">↑</button>
    <button onclick="moveSel(1)">↓</button>
    <button onclick="indentSel(1)">⇥</button>
    <button onclick="indentSel(-1)">⇤</button>
    <button class="del" onclick="delSel()">🗑</button>
  </div>
  <div class="work" id="work">
    <div class="rail" id="rail"></div>
    <div class="canvas" id="canvas"></div>
  </div>
  <div class="out" id="out" hidden>
    <div class="lab" id="out-lab">結果</div>
    <pre id="out-pre" class="idle" aria-live="polite">まだ実行していません</pre>
  </div>
  <div class="bar">
    <button class="btn" id="run" onclick="runProg()">▶ 実行</button>
    <button class="btn2" id="towrite" onclick="toWrite()" disabled>✎ 自分で打つ</button>
  </div>
</section>

<!-- ══════ 自分で打つ ══════ -->
<section class="screen" id="scr-write">
  <div class="top">
    <button class="ic" onclick="backToBuild()" aria-label="組み立てに戻る">←</button>
    <span class="ttl">自分で打つ</span>
    <button class="ic" onclick="showAnswer()" aria-label="答えを見る">?</button>
  </div>
  <div class="ref">
    <div class="lab">この形を Python で書く</div>
    <div id="w-ref"></div>
  </div>
  <textarea id="w-code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="書いたコード"></textarea>
  <div class="verdict" id="w-verdict" hidden></div>
  <div class="out" id="w-out" hidden>
    <div class="lab">結果</div>
    <pre id="w-pre" aria-live="polite"></pre>
  </div>
  <div class="bar">
    <button class="btn" id="w-run" onclick="judgeWrite()">▶ 実行して判定</button>
  </div>
</section>

<script>
/* ══════════════════════════════════════════════════════════════
   PyRun — 共有 Python ランタイム（Web Worker）
   pydrill と同じ構造。time.sleep でも UI が止まらず、中断できる。
   Pyodide は「実行」を押した瞬間にだけ取りに行く。
   ══════════════════════════════════════════════════════════════ */
var PyRun=(function(){
  var CDN='https://cdn.jsdelivr.net/pyodide/v0.28.3/full/';
  var inst=null,ready=null,job=null,seq=0,booted=false,w=null;
  var WORKER=[
    'var py=null, RUNNER=null;',
    'function post(o){ self.postMessage(o); }',
    'self.onmessage=function(e){',
    '  var m=e.data;',
    '  if(m.t==="boot"){ boot(m.cdn, m.runner); return; }',
    '  if(m.t==="run"){ exec(m.id, m.code, m.stdin); return; }',
    '};',
    'function boot(cdn, runner){',
    '  RUNNER=runner;',
    '  try{ importScripts(cdn+"pyodide.js"); }',
    '  catch(err){ post({t:"bootfail", m:"Python 本体を取得できませんでした"}); return; }',
    '  loadPyodide({indexURL:cdn}).then(function(p){',
    '    py=p;',
    '    py.setStdout({batched:function(s){ post({t:"out", s:s+"\\n"}); }});',
    '    py.setStderr({batched:function(s){ post({t:"out", s:s+"\\n"}); }});',
    '    post({t:"ready"});',
    '  }).catch(function(err){ post({t:"bootfail", m:(err&&err.message)||String(err)}); });',
    '}',
    'function exec(id, code, stdin){',
    '  try{',
    '    py.globals.set("_SRC", code);',
    '    py.globals.set("_STDIN", stdin||"");',
    '    py.runPythonAsync(RUNNER).then(function(r){',
    '      var tb=r.get(0), er=r.get(1); r.destroy();',
    '      post({t:"done", id:id, tb:tb, err:er===1});',
    '    }).catch(function(err){ post({t:"done", id:id, tb:(err&&err.message)||String(err), err:true}); });',
    '  }catch(err){ post({t:"done", id:id, tb:(err&&err.message)||String(err), err:true}); }',
    '}'
  ].join('\n');
  var RUNNER=[
    'import sys, io, builtins, traceback, linecache',
    'sys.stdin = io.StringIO(_STDIN)',
    "linecache.cache['code.py'] = (len(_SRC), None, _SRC.splitlines(True), 'code.py')",
    "def _inp(prompt=''):",
    '    line = sys.stdin.readline()',
    "    if line == '':",
    "        raise EOFError('EOF when reading a line — 入力データが足りません')",
    "    return line.rstrip('\\n')",
    'builtins.input = _inp',
    '_err = 0',
    "_tb = ''",
    'try:',
    "    exec(compile(_SRC, 'code.py', 'exec'), {'__name__': '__main__'})",
    'except BaseException:',
    '    _err = 1',
    '    _keep = []',
    '    _skip = False',
    '    for _l in traceback.format_exc().splitlines():',
    '        if _l.startswith(\'  File "\'):',
    "            _skip = 'code.py' not in _l",
    '            if not _skip:',
    '                _keep.append(_l)',
    "        elif _l.startswith('    '):",
    '            if not _skip:',
    '                _keep.append(_l)',
    '        else:',
    '            _skip = False',
    '            _keep.append(_l)',
    "    _tb = '\\n'.join(_keep)",
    'try:',
    '    sys.stdout.flush()',
    'except Exception:',
    '    pass',
    '[_tb, _err]'
  ].join('\n');
  function kill(){ if(w){try{w.terminate();}catch(e){}} w=null;ready=null;booted=false; }
  function ensure(){
    if(ready)return ready;
    ready=new Promise(function(res,rej){
      var abs=CDN; try{abs=new URL(CDN,location.href).href;}catch(e){}
      try{ w=new Worker(URL.createObjectURL(new Blob([WORKER],{type:'text/javascript'}))); }
      catch(e){ ready=null; rej(new Error('この環境では実行機能を使えません')); return; }
      w.onmessage=function(e){
        var m=e.data;
        if(m.t==='ready'){booted=true;res();return;}
        if(m.t==='bootfail'){kill();rej(new Error(m.m));return;}
        if(m.t==='out'){ if(!job)return; job.acc+=m.s; if(job.onChunk)job.onChunk(m.s); return; }
        if(m.t==='done'){
          if(!job||job.id!==m.id)return;
          var j=job; job=null;
          if(m.err&&m.tb){ var t=m.tb+'\n'; j.acc+=t; if(j.onChunk)j.onChunk(t); }
          j.res({out:j.acc,err:!!m.err,cancelled:false});
        }
      };
      w.onerror=function(){ var j=job;job=null;kill(); if(j)j.res({out:j.acc,err:true,cancelled:false}); rej(new Error('実行環境が落ちました')); };
      w.postMessage({t:'boot',cdn:abs,runner:RUNNER});
    });
    return ready;
  }
  function run(code,stdin,onChunk){
    if(job)return Promise.reject(new Error('まだ実行中です'));
    return ensure().then(function(){
      return new Promise(function(res){
        job={id:++seq,acc:'',onChunk:onChunk,res:res};
        w.postMessage({t:'run',id:job.id,code:code,stdin:stdin||''});
      });
    });
  }
  function cancel(){ if(!job)return; var j=job;job=null;kill(); j.res({out:j.acc,err:false,cancelled:true}); }
  function norm(s){ return String(s).replace(/\r/g,'').split('\n')
      .map(function(l){return l.replace(/\s+$/,'');}).join('\n').replace(/^\n+|\n+$/g,''); }
  return {ensure:ensure,run:run,cancel:cancel,norm:norm,
          busy:function(){return !!job;},booted:function(){return booted;}};
})();

/* ══ 式トークン → 表示用コード（pydrill の joinCode と同じ規則） ══ */
var KW=['if','in','for','while','return','else','and','or','not','is','import','elif'];
function isName(t){return /^[A-Za-z_][\w.]*$/.test(t)&&KW.indexOf(t)<0||/[)\]'"]$/.test(t);}
function joinCode(ts){
  var s='';
  ts.forEach(function(t,i){
    if(i>0){
      var p=ts[i-1];
      var tight=[')',']',',',':'].indexOf(t)>=0||(['(','['].indexOf(t)>=0&&isName(p))||['(','['].indexOf(p)>=0;
      if(!tight)s+=' ';
    }
    s+=t;
  });
  return s;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ══ ブロックのカタログ ══ */
var STMT=[
 {t:'assign',    r:'＝ 入れる',  mk:function(){return {t:'assign',v:'kansu',e:[]};}},
 {t:'addassign', r:'＋= 足す',   mk:function(){return {t:'addassign',v:'kansu',e:[]};}},
 {t:'print',     r:'print',      mk:function(){return {t:'print',e:[]};}},
 {t:'print_end', r:'print 続き', mk:function(){return {t:'print_end',e:[]};}},
 {t:'input',     r:'入力',       mk:function(){return {t:'input',v:'kansu'};}},
 {t:'input_int', r:'数で入力',   mk:function(){return {t:'input_int',v:'kansu'};}},
 {t:'for_range', r:'for 回数',   mk:function(){return {t:'for_range',v:'i',e:[],body:[]};}},
 {t:'for_in',    r:'for 中身',   mk:function(){return {t:'for_in',v:'x',e:[],body:[]};}},
 {t:'while',     r:'while',      mk:function(){return {t:'while',e:[],body:[]};}},
 {t:'if',        r:'if',         mk:function(){return {t:'if',e:[],body:[]};}},
 {t:'else',      r:'else',       mk:function(){return {t:'else'};}},
 {t:'append',    r:'リストに足す',mk:function(){return {t:'append',v:'kansu',e:[]};}},
 {t:'break',     r:'ぬける',     mk:function(){return {t:'break'};}},
 {t:'continue',  r:'次へ',       mk:function(){return {t:'continue'};}},
 {t:'def',       r:'def 関数',   mk:function(){return {t:'def',name:'',args:[],body:[]};}},
 {t:'return',    r:'return',     mk:function(){return {t:'return',e:[]};}},
 {t:'call',      r:'呼ぶだけ',   mk:function(){return {t:'call',e:[]};}}
];
var OPS=['+','-','*','/','//','%','**','==','!=','<','>','<=','>=','and','or','not','in','(',')','[',']',',',':'];
var VARS=['kansu','kansu1','kansu2','i','n','x','a','b'];
var NUMS=['0','1','2','3','4','5','10','100'];
var STRS=["''","' '","'-'","'OK'","'\\n'"];
var FNS=['len','range','int','str','float','sum','max','min','sorted','input','print','enumerate','zip','abs'];

/* ══ 状態 ══ */
var PROG=[], CARET={arr:PROG,i:0}, SEL=null, SLOT=null, LAST={code:'',out:''};

function toast(m,ng){var e=document.getElementById('toast');e.textContent=m;
  e.className='toast show'+(ng?' ng':'');setTimeout(function(){e.className='toast'+(ng?' ng':'');},1600);}

/* ══ コード生成 ══ */
function lineOf(b){
  var e=b.e?joinCode(b.e):'';
  switch(b.t){
    case 'assign':    return b.v+' = '+e;
    case 'addassign': return b.v+' += '+e;
    case 'print':     return 'print('+e+')';
    case 'print_end': return 'print('+e+", end='')";
    case 'input':     return b.v+' = input()';
    case 'input_int': return b.v+' = int(input())';
    case 'for_range': return 'for '+b.v+' in range('+e+'):';
    case 'for_in':    return 'for '+b.v+' in '+e+':';
    case 'while':     return 'while '+e+':';
    case 'if':        return 'if '+e+':';
    case 'else':      return 'else:';
    case 'append':    return b.v+' += ['+e+']';
    case 'break':     return 'break';
    case 'continue':  return 'continue';
    case 'def':       return 'def '+(b.name||'?')+'('+b.args.join(', ')+'):';
    case 'return':    return 'return '+e;
    case 'call':      return e;
  }
  return '';
}
function isBlockStart(b){return ['for_range','for_in','while','if','else','def'].indexOf(b.t)>=0;}

function gen(arr,d){
  var out=[],pad=new Array(d*4+1).join(' ');
  arr.forEach(function(b){
    out.push(pad+lineOf(b));
    if(isBlockStart(b)){
      var inner=b.body?gen(b.body,d+1):[];
      if(!inner.length)inner=[pad+'    pass'];
      out=out.concat(inner);
    }
  });
  return out;
}
function code(){return gen(PROG,0).join('\n');}

/* 空のスロットを探す（実行前の確認） */
function firstHole(arr){
  for(var k=0;k<arr.length;k++){
    var b=arr[k];
    if(b.e&&!b.e.length&&['print','print_end','assign','addassign','for_range','for_in','while','if','append','return','call'].indexOf(b.t)>=0)return b;
    if(b.t==='def'&&!b.name)return b;
    if(b.body){var h=firstHole(b.body);if(h)return h;}
  }
  return null;
}

/* ══ 描画 ══ */
function render(){
  var c=document.getElementById('canvas');
  c.innerHTML='';
  if(!PROG.length){
    var h=document.createElement('div');h.className='hint';
    h.textContent='レールのブロックをタップすると ここに入ります';
    c.appendChild(h);
  }
  drawArr(PROG,0,c);
  if(CARET.arr===PROG&&CARET.i>=PROG.length)c.appendChild(caretEl());
  document.getElementById('tools').hidden=!SEL;
  renderRail();
}
function caretEl(){var d=document.createElement('div');d.className='caret';return d;}

function drawArr(arr,depth,host){
  arr.forEach(function(b,idx){
    if(CARET.arr===arr&&CARET.i===idx)host.appendChild(caretEl());
    host.appendChild(rowEl(b,arr,idx,depth));
    if(isBlockStart(b)){
      b.body=b.body||[];
      drawArr(b.body,depth+1,host);
      if(CARET.arr===b.body&&CARET.i>=b.body.length)host.appendChild(caretEl());
    }
  });
  if(arr!==PROG&&CARET.arr===arr&&CARET.i>=arr.length&&!arr.length){
    host.appendChild(caretEl());
  }
}

function rowEl(b,arr,idx,depth){
  var r=document.createElement('div');
  r.className='row'+(SEL&&SEL.arr===arr&&SEL.i===idx?' sel':'');
  for(var d=0;d<depth;d++){
    var band=document.createElement('span');
    band.className='band'+(d>0?(d>1?' d3':' d2'):'');
    r.appendChild(band);
  }
  var parts=partsOf(b);
  parts.forEach(function(p){
    var s=document.createElement('span');
    if(p.k){
      s.className='slot'+(p.txt?'':' empty')+(SLOT&&SLOT.b===b&&SLOT.k===p.k?' act':'');
      s.textContent=p.txt||'［　］';
      s.onclick=function(ev){ev.stopPropagation();pickSlot(b,p.k);};
    }else{
      s.className=p.kw?'kw':'';
      s.textContent=p.txt;
    }
    r.appendChild(s);
  });
  r.onclick=function(){ SEL={arr:arr,i:idx}; SLOT=null;
    CARET=isBlockStart(b)?{arr:(b.body=b.body||[]),i:b.body.length}:{arr:arr,i:idx+1};
    render(); };
  return r;
}

/* 1行をトークンに割る（スロットは押せる） */
function partsOf(b){
  var P=[],e=b.e?joinCode(b.e):'';
  function kw(t){P.push({txt:t,kw:1});}
  function tx(t){P.push({txt:t});}
  function sl(k,v){P.push({k:k,txt:v});}
  switch(b.t){
    case 'assign':    sl('v',b.v);tx('=');sl('e',e);break;
    case 'addassign': sl('v',b.v);tx('+=');sl('e',e);break;
    case 'print':     kw('print');tx('(');sl('e',e);tx(')');break;
    case 'print_end': kw('print');tx('(');sl('e',e);tx(", end='')");break;
    case 'input':     sl('v',b.v);tx('= input()');break;
    case 'input_int': sl('v',b.v);tx('= int(input())');break;
    case 'for_range': kw('for');sl('v',b.v);kw('in');tx('range(');sl('e',e);tx('):');break;
    case 'for_in':    kw('for');sl('v',b.v);kw('in');sl('e',e);tx(':');break;
    case 'while':     kw('while');sl('e',e);tx(':');break;
    case 'if':        kw('if');sl('e',e);tx(':');break;
    case 'else':      kw('else:');break;
    case 'append':    sl('v',b.v);tx('+= [');sl('e',e);tx(']');break;
    case 'break':     kw('break');break;
    case 'continue':  kw('continue');break;
    case 'def':       kw('def');sl('name',b.name);tx('(');sl('args',b.args.join(', '));tx('):');break;
    case 'return':    kw('return');sl('e',e);break;
    case 'call':      sl('e',e);break;
  }
  return P;
}

function pickSlot(b,k){
  if(k==='name'){
    var n=prompt('関数の名前',b.name||'tasu');
    if(n){ b.name=String(n).trim().replace(/[^A-Za-z0-9_]/g,'')||'tasu'; }
    SLOT=null;render();return;
  }
  SLOT={b:b,k:k};SEL=null;render();
}

/* ══ レール ══ */
function userFuncs(){
  var out=[];
  (function walk(a){a.forEach(function(b){ if(b.t==='def'&&b.name)out.push(b); if(b.body)walk(b.body); });})(PROG);
  return out;
}
function renderRail(){
  var rail=document.getElementById('rail');
  rail.innerHTML='';
  var fns=userFuncs();
  if(fns.length){
    head(rail,'じぶん');
    fns.forEach(function(f){ rb(rail,f.name,'mine',function(){ insertToken(f.name); insertToken('('); }); });
  }
  head(rail,'文');
  /* 挿入点を親の次へ出す。これが無いと「行を選ぶ→⇤→スロット」で3タップかかる */
  if(CARET.arr!==PROG)rb(rail,'⇤ 外へ','st',function(){ caretOut(); });
  STMT.forEach(function(s){ rb(rail,s.r,'st',function(){ addStmt(s); }); });
  head(rail,'式');
  OPS.forEach(function(o){ rb(rail,o,'',function(){ insertToken(o); }); });
  head(rail,'変数');
  VARS.forEach(function(v){ rb(rail,v,'',function(){ setVarOrToken(v); }); });
  head(rail,'数');
  NUMS.forEach(function(n){ rb(rail,n,'',function(){ insertToken(n); }); });
  head(rail,'字');
  STRS.forEach(function(s){ rb(rail,s,'',function(){ insertToken(s); }); });
  head(rail,'道具');
  FNS.forEach(function(f){ rb(rail,f,'',function(){ insertToken(f); insertToken('('); }); });
  head(rail,'消す');
  rb(rail,'← 1つ','',function(){ backToken(); });
}
function head(host,t){var d=document.createElement('div');d.className='rhead';d.textContent=t;host.appendChild(d);}
function rb(host,label,cls,fn){
  var b=document.createElement('button');b.type='button';
  b.className='rb'+(cls?' '+cls:'');b.textContent=label;b.onclick=fn;host.appendChild(b);
}

/* ══ 編集 ══ */
function addStmt(s){
  var b=s.mk();
  CARET.arr.splice(CARET.i,0,b);
  if(isBlockStart(b)){ b.body=b.body||[]; CARET={arr:b.body,i:0}; }
  else { CARET={arr:CARET.arr,i:CARET.i+1}; }
  SEL=null;
  SLOT=(b.e?{b:b,k:'e'}:null);
  if(b.t==='def'){ pickSlot(b,'name'); SLOT={b:b,k:'args'}; }
  render();
}
function insertToken(t){
  if(!SLOT||SLOT.k!=='e'){ toast('入れる場所をタップしてください',1); return; }
  SLOT.b.e.push(t); render();
}
function setVarOrToken(v){
  if(SLOT&&SLOT.k==='v'){ SLOT.b.v=v; render(); return; }
  if(SLOT&&SLOT.k==='args'){ SLOT.b.args.push(v); render(); return; }
  insertToken(v);
}
function backToken(){
  if(SLOT&&SLOT.k==='e'&&SLOT.b.e.length){ SLOT.b.e.pop(); render(); return; }
  if(SLOT&&SLOT.k==='args'&&SLOT.b.args.length){ SLOT.b.args.pop(); render(); return; }
  toast('消す場所をタップしてください',1);
}
function delSel(){
  if(!SEL)return;
  SEL.arr.splice(SEL.i,1);
  CARET={arr:SEL.arr,i:Math.min(SEL.i,SEL.arr.length)};
  SEL=null;SLOT=null;render();
}
function moveSel(d){
  if(!SEL)return;
  var a=SEL.arr,i=SEL.i,j=i+d;
  if(j<0||j>=a.length)return;
  var t=a[i];a[i]=a[j];a[j]=t;SEL={arr:a,i:j};render();
}
function indentSel(d){
  if(!SEL)return;
  var a=SEL.arr,i=SEL.i,b=a[i];
  if(d>0){
    var prev=a[i-1];
    if(!prev||!isBlockStart(prev)){toast('上が for / if などのときだけ入れます',1);return;}
    a.splice(i,1); prev.body=prev.body||[]; prev.body.push(b);
    SEL={arr:prev.body,i:prev.body.length-1};
  }else{
    var p=findParent(PROG,a);
    if(!p){toast('これ以上は外に出せません',1);return;}
    a.splice(i,1); p.arr.splice(p.i+1,0,b);
    SEL={arr:p.arr,i:p.i+1};
  }
  CARET={arr:SEL.arr,i:SEL.i+1};
  render();
}
function caretOut(){
  var p=findParent(PROG,CARET.arr);
  if(!p){toast('もう一番外です',1);return;}
  CARET={arr:p.arr,i:p.i+1};
  SEL=null;SLOT=null;render();
}
function findParent(arr,target){
  for(var i=0;i<arr.length;i++){
    var b=arr[i];
    if(b.body===target)return {arr:arr,i:i};
    if(b.body){var r=findParent(b.body,target);if(r)return r;}
  }
  return null;
}
function clearAll(){
  if(PROG.length&&!confirm('全部消しますか？'))return;
  PROG.length=0;CARET={arr:PROG,i:0};SEL=null;SLOT=null;
  document.getElementById('out').hidden=true;
  document.getElementById('towrite').disabled=true;
  render();
}

/* ══ 実行 ══ */
var running=false;
function runProg(){
  if(running){PyRun.cancel();return;}
  if(!PROG.length){toast('まだ何も組まれていません',1);return;}
  var hole=firstHole(PROG);
  if(hole){ SLOT={b:hole,k:hole.e?'e':'name'}; render(); toast('空のスロットがあります',1); return; }
  var src=code();
  var box=document.getElementById('out'),pre=document.getElementById('out-pre');
  box.hidden=false;pre.className='';pre.textContent='';
  document.getElementById('out-lab').textContent=PyRun.booted()?'結果':'Python を読み込み中（初回は10MBほど）';
  setRun(true);
  PyRun.run(src,'',function(c){pre.textContent+=c;}).then(function(r){
    setRun(false);
    document.getElementById('out-lab').textContent='結果';
    if(r.cancelled){pre.textContent+='\n— 中断しました —';pre.className='idle';return;}
    if(pre.textContent===''){pre.className='idle';pre.textContent='（出力なし）';}
    else if(r.err)pre.className='err';
    if(!r.err){ LAST={code:src,out:r.out}; document.getElementById('towrite').disabled=false; }
  }).catch(function(e){
    setRun(false);
    document.getElementById('out-lab').textContent='結果';
    pre.className='err';
    pre.textContent=(e&&e.message)||String(e);
  });
}
function setRun(on){
  running=on;
  var b=document.getElementById('run');
  b.textContent=on?'■ 中断':'▶ 実行';
  b.classList.toggle('stop',on);
}

/* ══ 写経 ══ */
function toWrite(){
  if(!LAST.code){toast('先に実行してください',1);return;}
  var ref=document.getElementById('w-ref');
  ref.innerHTML='';
  drawArr(PROG,0,ref);        /* 構造だけ見せる。Python は見せない */
  document.getElementById('w-code').value='';
  document.getElementById('w-verdict').hidden=true;
  document.getElementById('w-out').hidden=true;
  document.getElementById('scr-build').classList.remove('on');
  document.getElementById('scr-write').classList.add('on');
  document.getElementById('w-code').focus();
}
function backToBuild(){
  document.getElementById('scr-write').classList.remove('on');
  document.getElementById('scr-build').classList.add('on');
  render();
}
function showAnswer(){
  var box=document.getElementById('w-out'),pre=document.getElementById('w-pre');
  box.hidden=false;pre.className='idle';pre.textContent=LAST.code;
}
function judgeWrite(){
  var src=document.getElementById('w-code').value;
  if(!src.trim()){toast('まだ何も書かれていません',1);return;}
  var box=document.getElementById('w-out'),pre=document.getElementById('w-pre');
  var v=document.getElementById('w-verdict');
  box.hidden=false;pre.className='';pre.textContent='';v.hidden=true;
  var btn=document.getElementById('w-run');btn.disabled=true;btn.textContent='実行中';
  PyRun.run(src,'',function(c){pre.textContent+=c;}).then(function(r){
    btn.disabled=false;btn.textContent='▶ 実行して判定';
    if(r.err){pre.className='err';v.hidden=false;v.className='verdict ng';v.textContent='まだ動いていません';return;}
    if(pre.textContent===''){pre.className='idle';pre.textContent='（出力なし）';}
    var same=PyRun.norm(r.out)===PyRun.norm(LAST.out);
    v.hidden=false;
    v.className='verdict '+(same?'ok':'ng');
    v.textContent=same?'ブロック版と同じ出力。書けました。':'出力がちがいます（ブロック版は '+PyRun.norm(LAST.out).replace(/\n/g,' ⏎ ')+'）';
  }).catch(function(e){
    btn.disabled=false;btn.textContent='▶ 実行して判定';
    pre.className='err';pre.textContent=(e&&e.message)||String(e);
  });
}

/* ══ 利き手 / レール ══ */
var K='pyblock_v1';
function loadPref(){try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}}
function savePref(p){try{localStorage.setItem(K,JSON.stringify(p));}catch(e){}}
function flipHand(){
  var p=loadPref();p.righty=!p.righty;savePref(p);applyPref();
  toast(p.righty?'レールを右へ':'レールを左へ');
}
function toggleRail(){
  var p=loadPref();p.slim=!p.slim;savePref(p);applyPref();
}
function applyPref(){
  var p=loadPref(),w=document.getElementById('work');
  w.classList.toggle('righty',!!p.righty);
  w.classList.toggle('slim',!!p.slim);
  document.getElementById('hand').classList.toggle('on',!!p.righty);
  document.getElementById('slim').classList.toggle('on',!!p.slim);
}

applyPref();
render();
</script>
